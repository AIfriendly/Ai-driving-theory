name: pages

# Publishes web/ to GitHub Pages.
#
# REQUIRES ONE MANUAL STEP, NOT YET DONE:
#   Settings -> Pages -> Source: "GitHub Actions"
#   https://github.com/AIfriendly/Ai-driving-theory/settings/pages
#
# Until that is set, every run fails at configure-pages and nothing deploys —
# the build steps still pass, so the commit looks fine while the live site
# stays on old content. Tested 2026-08-18: enablement: true is not enough on
# its own, because GITHUB_TOKEN cannot create the site
# ("Create Pages site failed. Resource not accessible by integration") —
# creating it needs repo-admin rights. enablement: true is kept because it is
# a no-op once the site exists, and self-heals if the token ever gains scope.

on:
  push:
    branches:
      - main
      - master
      - claude/trading-agent-bybit-mcp-ao56dp
    paths:
      - "web/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Verify the site is self-contained
        # The app must have no external references: a strict CSP blocks every
        # outside host, so a stray CDN link would silently break the page.
        run: |
          set -euo pipefail
          if grep -nEi '(src|href)="https?://' web/index.html; then
            echo "::error::external resource reference found in index.html"
            exit 1
          fi
          echo "OK: no external resource references"

      # enablement: true lets the action turn Pages on via the API the first
      # time it runs, instead of failing with "Get Pages site failed" until
      # somebody flips Settings -> Pages -> Source by hand.
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web

      - id: deploy
        uses: actions/deploy-pages@v4
