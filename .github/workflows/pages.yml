name: pages

# Publishes web/ to GitHub Pages.
#
# Pages was enabled by hand on 2026-08-18 (Settings -> Pages -> Source:
# "GitHub Actions"). Every run before that failed at configure-pages with
# "Get Pages site failed", and nothing this repo has ever built reached a
# public URL. The build steps passed throughout, so the commits looked fine
# while the live site did not exist — check the pages run, not just the push.
#
# enablement: true stays. GITHUB_TOKEN cannot create a Pages site (that needs
# repo-admin rights, which is why the manual step was unavoidable), but the
# flag is a no-op now the site exists and re-creates it if it is ever removed.

on:
  push:
    branches:
      - main
      - master
      - claude/trading-agent-bybit-mcp-ao56dp
    paths:
      - "web/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Verify the site is self-contained
        # No external *resource loads*: a strict CSP blocks every outside host,
        # so a stray CDN script/style/image would silently break the page.
        # Anchor links (<a href="https://…">) are navigation, not a resource
        # load — CSP doesn't touch them — so they're allowed (e.g. the CC-BY
        # attribution credit for the 3D car model links to Sketchfab + the
        # licence). Block external src= and external <link href=> only.
        run: |
          set -euo pipefail
          if grep -nEi 'src="https?://' web/index.html; then
            echo "::error::external resource (src) reference found in index.html"
            exit 1
          fi
          if grep -nEi '<link[^>]+href="https?://' web/index.html; then
            echo "::error::external stylesheet (link href) found in index.html"
            exit 1
          fi
          echo "OK: no external resource loads (anchor links allowed)"

      - name: Verify each page carries a document shell
        # index.html doubles as a Claude Artifact body, and the Artifact
        # publisher supplies its own <head>. Served raw from Pages nothing
        # does, so a missing viewport tag makes mobile browsers lay out at
        # ~980px and scale the whole app down to about half the screen.
        # That shipped once. It is invisible to a headless check that sets the
        # viewport directly, so assert the tag is present in the file instead.
        run: |
          set -euo pipefail
          for f in web/index.html web/ad.html; do
            head -c 2000 "$f" | grep -qi '<!doctype html>' \
              || { echo "::error::$f has no doctype — renders in quirks mode"; exit 1; }
            head -c 2000 "$f" | grep -qi '<meta name="viewport"' \
              || { echo "::error::$f has no viewport meta — will render zoomed out on phones"; exit 1; }
          done
          echo "OK: doctype and viewport present on every page"

      # enablement: true lets the action turn Pages on via the API the first
      # time it runs, instead of failing with "Get Pages site failed" until
      # somebody flips Settings -> Pages -> Source by hand.
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web

      - id: deploy
        uses: actions/deploy-pages@v4
