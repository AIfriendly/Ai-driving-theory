[project]
name = "bybit-mcp"
version = "0.1.0"
description = "Fail-closed Bybit V5 MCP server for the automated-trading agent"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.2.0",
    "httpx>=0.27",
]

[project.scripts]
bybit-mcp = "bybit_mcp.server:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bybit_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
