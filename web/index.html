<style>
  :root{
    --bg:#f1efe8; --surface:#ffffff; --surface2:#f6f3ec; --ink:#161b26; --muted:#5c6675;
    --line:#e4ded1; --brand:#0f5f86; --brand2:#0c4d6e; --on-brand:#ffffff;
    --accent:#e29b00; --good:#1f9d55; --good-bg:#e7f6ec; --bad:#d33b3b; --bad-bg:#fbe9e9;
    --shadow:0 6px 22px rgba(20,30,50,.10); --radius:16px;
  }
  @media (prefers-color-scheme:dark){:root{
    --bg:#0c1320; --surface:#141d2b; --surface2:#101826; --ink:#e9edf4; --muted:#93a0b4;
    --line:#ffffff18; --brand:#38a0d6; --brand2:#2b8dc2; --on-brand:#04121c;
    --accent:#f2b52e; --good:#37c47c; --good-bg:#12331f; --bad:#f06a6a; --bad-bg:#361818;
    --shadow:0 8px 30px rgba(0,0,0,.4);
  }}
  :root[data-theme="light"]{--bg:#f1efe8;--surface:#fff;--surface2:#f6f3ec;--ink:#161b26;--muted:#5c6675;--line:#e4ded1;--brand:#0f5f86;--brand2:#0c4d6e;--on-brand:#fff;--accent:#e29b00;--good:#1f9d55;--good-bg:#e7f6ec;--bad:#d33b3b;--bad-bg:#fbe9e9;--shadow:0 6px 22px rgba(20,30,50,.10)}
  :root[data-theme="dark"]{--bg:#0c1320;--surface:#141d2b;--surface2:#101826;--ink:#e9edf4;--muted:#93a0b4;--line:#ffffff18;--brand:#38a0d6;--brand2:#2b8dc2;--on-brand:#04121c;--accent:#f2b52e;--good:#37c47c;--good-bg:#12331f;--bad:#f06a6a;--bad-bg:#361818;--shadow:0 8px 30px rgba(0,0,0,.4)}

  *{box-sizing:border-box}
  html,body{margin:0}
  body{background:var(--bg);color:var(--ink);
    font-family:-apple-system,"Segoe UI",Roboto,system-ui,"Noto Sans Arabic","Geeza Pro",sans-serif;
    line-height:1.5;-webkit-text-size-adjust:100%}
  #app{max-width:560px;margin:0 auto;min-height:100dvh;display:flex;flex-direction:column}
  .tnum{font-variant-numeric:tabular-nums}

  /* header */
  header{position:sticky;top:0;z-index:10;background:linear-gradient(180deg,var(--brand),var(--brand2));
    color:var(--on-brand);padding:12px 16px;display:flex;align-items:center;gap:12px;
    padding-top:max(12px,env(safe-area-inset-top));box-shadow:0 2px 12px rgba(0,0,0,.15)}
  .logo{display:flex;align-items:center;gap:9px;font-weight:800;font-size:17px;letter-spacing:.2px;flex:1;cursor:pointer}
  .logo svg{width:26px;height:26px;flex:none}
  .logo small{display:block;font-weight:600;font-size:10.5px;opacity:.85;letter-spacing:.06em;text-transform:uppercase}
  .hbtns{display:flex;gap:6px;align-items:center}
  .lang{display:flex;background:#ffffff26;border-radius:999px;padding:3px}
  .lang button{border:0;background:transparent;color:inherit;font:inherit;font-size:13px;font-weight:700;
    padding:5px 11px;border-radius:999px;cursor:pointer;line-height:1}
  .lang button[aria-pressed="true"]{background:var(--on-brand);color:var(--brand)}
  .szbtn{border:0;background:#ffffff26;color:inherit;font:inherit;font-weight:800;font-size:13px;padding:5px 10px;border-radius:999px;cursor:pointer;line-height:1}
  .szbtn[aria-pressed="true"]{background:var(--on-brand);color:var(--brand)}
  #app.big .qtext{font-size:21px;line-height:1.36}
  #app.big .opt span{font-size:16.5px}
  #app.big .explain{font-size:15.5px}
  #app.big .rex{font-size:13.5px}
  #app.big .tile b{font-size:17.5px}

  main{flex:1;padding:16px;display:flex;flex-direction:column;gap:14px}
  h1{font-size:24px;line-height:1.2;margin:2px 0 0;text-wrap:balance;font-weight:800}
  .sub{color:var(--muted);font-size:14px;margin:0}

  .card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
  .menu{display:flex;flex-direction:column;gap:12px}
  .tile{display:flex;align-items:center;gap:14px;padding:16px;text-align:start;cursor:pointer;
    border:1px solid var(--line);background:var(--surface);border-radius:var(--radius);box-shadow:var(--shadow);
    width:100%;font:inherit;color:inherit;transition:transform .08s,border-color .12s}
  .tile:hover{border-color:var(--brand)}.tile:active{transform:scale(.99)}
  .tile .ic{width:46px;height:46px;border-radius:12px;flex:none;display:grid;place-items:center;
    background:var(--surface2);color:var(--brand)}
  .tile .ic svg{width:26px;height:26px}
  .tile b{font-size:16.5px;display:block}
  .tile span{color:var(--muted);font-size:13px}
  .tile .arw{margin-inline-start:auto;color:var(--muted);font-size:20px}
  .exam .ic{background:var(--brand);color:var(--on-brand)}

  .pill{display:inline-flex;align-items:center;gap:6px;background:var(--surface2);border:1px solid var(--line);
    color:var(--muted);font-size:12.5px;font-weight:600;padding:5px 11px;border-radius:999px}
  .stats{display:flex;gap:8px;flex-wrap:wrap}
  .kpi{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .kt{background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:14px 15px}
  .kv{font-size:26px;font-weight:800;line-height:1}
  .kl{color:var(--muted);font-size:12.5px;margin-top:5px}
  .statcard{padding:15px}
  .ct{font-weight:700;font-size:15px;margin:0 0 6px}
  .mrow{display:flex;align-items:center;gap:10px;margin:11px 0}
  .ml{flex:none;width:40%;font-size:13px;display:flex;align-items:center;gap:5px;flex-wrap:wrap}
  .wtag{background:var(--accent);color:#1a1400;font-size:10px;font-weight:800;padding:1px 6px;border-radius:999px}
  .track{flex:1;height:11px;background:var(--surface2);border:1px solid var(--line);border-radius:999px;overflow:hidden}
  .track i{display:block;height:100%;background:var(--brand);border-radius:999px;min-width:3px;transition:width .4s}
  .mv{flex:none;width:44px;text-align:end;font-weight:800;font-size:13.5px}
  .spark{position:relative;display:flex;align-items:flex-end;gap:4px;height:118px;border-bottom:2px solid var(--line);margin-top:20px}
  .sb{flex:1;display:flex;align-items:flex-end;justify-content:center;height:100%}
  .sb i{display:block;width:100%;max-width:20px;background:var(--brand);border-radius:4px 4px 0 0}
  .passline{position:absolute;left:0;right:0;bottom:68%;border-top:2px dashed var(--accent);pointer-events:none}
  .passline span{position:absolute;inset-inline-end:0;top:-15px;font-size:10px;color:var(--accent);font-weight:800;background:var(--surface);padding:0 4px;border-radius:4px}
  .btn.danger{color:var(--bad);border-color:var(--bad);background:transparent}
  .streakrow{display:flex;gap:10px;margin:4px 0 14px}
  .sfig{flex:1;background:var(--surface2);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
  .sv{font-size:20px;font-weight:800;line-height:1}
  .sl{color:var(--muted);font-size:11.5px;margin-top:3px}
  .goalhead{display:flex;justify-content:space-between;font-size:13.5px;font-weight:700;margin-bottom:7px}
  .week{display:flex;gap:6px;margin-top:13px}
  .wd{flex:1;height:9px;border-radius:999px;background:var(--surface2);border:1px solid var(--line)}
  .wd.on{background:var(--brand);border-color:var(--brand)}
  .wd.td{outline:2px solid var(--accent);outline-offset:1px}

  /* quiz */
  .qbar{display:flex;align-items:center;gap:10px}
  .prog{flex:1;height:8px;background:var(--surface2);border-radius:999px;overflow:hidden;border:1px solid var(--line)}
  .prog i{display:block;height:100%;background:var(--brand);width:0;transition:width .3s}
  .timer{font-weight:800;font-size:15px;padding:5px 10px;border-radius:10px;background:var(--surface2);border:1px solid var(--line)}
  .timer.low{background:var(--bad-bg);color:var(--bad);border-color:transparent}
  .qcount{font-size:13px;color:var(--muted);font-weight:700}
  .signwrap{display:grid;place-items:center;padding:18px;background:var(--surface2);border-radius:14px;border:1px solid var(--line)}
  .scenewrap{border-radius:14px;overflow:hidden;border:1px solid var(--line);background:var(--surface2)}
  .scenewrap svg{display:block;width:100%;height:auto;aspect-ratio:200/120}
  .signwrap svg{width:150px;height:150px}
  .qtext{font-size:19px;font-weight:750;line-height:1.35;margin:4px 0;text-wrap:balance}
  .opts{display:flex;flex-direction:column;gap:10px}
  .opt{display:flex;align-items:center;gap:12px;padding:14px;border:1.5px solid var(--line);border-radius:14px;
    background:var(--surface);cursor:pointer;font:inherit;color:inherit;text-align:start;width:100%;transition:border-color .1s,background .1s}
  .opt:hover:not(:disabled){border-color:var(--brand)}
  .opt .key{width:26px;height:26px;border-radius:50%;flex:none;display:grid;place-items:center;font-weight:800;
    font-size:13px;background:var(--surface2);color:var(--muted)}
  .opt.correct{border-color:var(--good);background:var(--good-bg)}
  .opt.correct .key{background:var(--good);color:#fff}
  .opt.wrong{border-color:var(--bad);background:var(--bad-bg)}
  .opt.wrong .key{background:var(--bad);color:#fff}
  .opt:disabled{cursor:default}
  .explain{padding:13px 14px;border-radius:12px;font-size:14px;line-height:1.5;border:1px solid var(--line)}
  .explain.ok{background:var(--good-bg);border-color:transparent}
  .explain.no{background:var(--bad-bg);border-color:transparent}
  .rex{color:var(--muted);font-size:12.5px;margin-top:7px;line-height:1.45}
  .explain b{font-weight:800}

  .btn{border:0;border-radius:13px;font:inherit;font-weight:750;font-size:16px;padding:14px 18px;cursor:pointer;
    background:var(--brand);color:var(--on-brand);width:100%;transition:transform .08s,filter .1s}
  .btn:hover{filter:brightness(1.05)}.btn:active{transform:scale(.99)}
  .btn.ghost{background:var(--surface);color:var(--ink);border:1.5px solid var(--line)}
  .btn.amber{background:var(--accent);color:#20170a}
  .row{display:flex;gap:10px}

  /* results */
  .score-badge{display:grid;place-items:center;padding:26px 18px;border-radius:var(--radius);color:#fff;text-align:center;gap:4px}
  .score-badge.pass{background:linear-gradient(160deg,#1f9d55,#127a40)}
  .score-badge.fail{background:linear-gradient(160deg,#d33b3b,#a52a2a)}
  .score-badge .big{font-size:52px;font-weight:800;line-height:1}
  .score-badge .lbl{font-size:15px;font-weight:700;opacity:.95}
  .bd{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line)}
  .bd:last-child{border-bottom:0}
  .bd .n{font-weight:800}
  .review .ri{padding:13px 14px;border-bottom:1px solid var(--line)}
  .review .ri:last-child{border-bottom:0}
  .review .rq{font-weight:700;font-size:14px;margin-bottom:6px}
  .review .ra{font-size:13px;display:flex;gap:7px;align-items:flex-start}
  .review .tag{font-size:11px;font-weight:800;padding:2px 7px;border-radius:6px;flex:none;margin-top:1px}
  .tag.g{background:var(--good-bg);color:var(--good)}.tag.b{background:var(--bad-bg);color:var(--bad)}

  /* signs gallery */
  .grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
  .sc{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;text-align:center;box-shadow:var(--shadow)}
  .sc svg{width:78px;height:78px}
  .sc .nm{font-weight:700;font-size:13.5px;margin-top:8px}
  .sqbtns{display:flex;gap:10px;margin-bottom:14px}
  .sqbtns .btn{flex:1}
  .signmean{font-weight:800;font-size:19px;text-align:center;margin:2px 0 12px;line-height:1.4}
  .signopts{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
  .signopt{padding:12px 6px;display:flex;align-items:center;justify-content:center;min-height:104px}
  .signopt svg{width:84px;height:84px}
  .flashcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:28px 20px;text-align:center;cursor:pointer;margin-bottom:14px;-webkit-user-select:none;user-select:none}
  .flashcard svg{width:150px;height:150px}
  .flashname{margin-top:16px;font-weight:800;font-size:22px;min-height:30px;color:var(--brand)}
  .flashhint{margin-top:16px;color:var(--muted);font-size:15px;min-height:30px}
  .flashnav{display:flex;gap:10px;margin-bottom:12px}
  .flashnav .btn{flex:1}
  .findinput{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink);font-size:16px;margin-bottom:6px;box-sizing:border-box}
  .findhd{display:flex;align-items:center;justify-content:space-between;gap:8px;font-weight:800;font-size:13px;margin:16px 2px 8px;color:var(--muted)}
  .qrow{display:flex;align-items:center;gap:8px;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--surface);margin-bottom:8px}
  .qrt{flex:1;cursor:pointer;font-size:14px;line-height:1.4}
  .bmbtn{background:none;border:none;font-size:21px;cursor:pointer;color:var(--muted);padding:0 4px;line-height:1}
  .bmbtn.on{color:var(--accent)}
  .btnsm{padding:6px 12px;font-size:13px;border-radius:10px;background:var(--brand);color:#fff;border:none;cursor:pointer;font-weight:700;white-space:nowrap}
  .signchips{display:flex;flex-wrap:wrap;gap:8px}
  .chip{display:flex;align-items:center;gap:6px;padding:6px 10px;border:1px solid var(--line);border-radius:12px;background:var(--surface);font-size:13px}
  .chip svg{width:34px;height:34px}
  .readycard{padding:16px;margin-bottom:14px;border-left:5px solid var(--muted)}
  .readycard.ready{border-left-color:var(--good)}
  .readycard.almost{border-left-color:var(--accent)}
  .readycard.practise{border-left-color:var(--bad)}
  .rdtop{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
  .rdlabel{font-weight:800;font-size:17px}
  .rdpct{font-weight:800;font-size:23px}
  .readycard.ready .rdpct{color:var(--good)}.readycard.almost .rdpct{color:var(--accent)}.readycard.practise .rdpct{color:var(--bad)}
  .rdbar{position:relative;height:8px;background:var(--line);border-radius:6px;margin:11px 0}
  .rdbar i{display:block;height:100%;border-radius:6px;background:var(--brand)}
  .readycard.ready .rdbar i{background:var(--good)}.readycard.almost .rdbar i{background:var(--accent)}.readycard.practise .rdbar i{background:var(--bad)}
  .rdbar .rdmark{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ink);opacity:.45;left:80%}
  .rdguide{color:var(--muted);font-size:13.5px;line-height:1.5;margin-bottom:11px}
  .rdactions{display:flex;flex-direction:column;gap:8px}
  .rdactions .btn{width:100%}
  .sc .ds{color:var(--muted);font-size:12px;margin-top:2px;line-height:1.35}

  /* achievements */
  .asum{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:14px;box-shadow:var(--shadow)}
  .asum .an{font-size:26px;font-weight:800;line-height:1}
  .asum .al{color:var(--muted);font-size:13px;margin-top:2px}
  .asum .aring{margin-inline-start:auto;flex:0 0 auto}
  .agrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .abadge{border:1px solid var(--line);border-radius:14px;background:var(--surface2);padding:13px 10px;text-align:center;opacity:.62}
  .abadge.on{opacity:1;background:var(--surface);border-color:var(--accent);box-shadow:var(--shadow)}
  .abadge .aic{font-size:30px;line-height:1.1;filter:grayscale(1)}
  .abadge.on .aic{filter:none}
  .abadge .at{font-weight:800;font-size:13.5px;margin-top:7px;line-height:1.3}
  .abadge .ad{color:var(--muted);font-size:11.6px;line-height:1.4;margin-top:3px}
  .abadge .abar{height:5px;border-radius:3px;background:var(--bg);border:1px solid var(--line);margin-top:8px;overflow:hidden}
  .abadge .abar i{display:block;height:100%;background:var(--brand);border-radius:3px}
  .abadge.on .abar i{background:var(--good)}
  .abadge .ap{color:var(--muted);font-size:11px;margin-top:4px;font-variant-numeric:tabular-nums}
  .newachv{background:var(--good-bg);border:1px solid var(--good);border-radius:14px;padding:12px 14px;margin-bottom:12px}
  .newachv b{color:var(--good);font-size:13.5px}
  .newachv .nrow{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
  .newachv .nchip{background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:5px 11px;font-size:12.5px;font-weight:700}

  /* study guide */
  .gnav{display:flex;flex-wrap:wrap;gap:8px;margin:2px 0 14px}.sgtools{margin-bottom:12px}.sgchips{display:flex;flex-wrap:wrap;gap:7px;margin:8px 0 4px}.sgchip{background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:12.5px;font-weight:700;color:var(--ink);cursor:pointer;white-space:nowrap}.sgchip.on{background:var(--accent);border-color:var(--accent);color:#fff}.sgchip .n{opacity:.65;font-weight:600;margin-inline-start:4px}.sghead{display:flex;align-items:baseline;gap:8px;margin:18px 0 8px;font-weight:800;font-size:15px}.sghead .n{font-size:12.5px;font-weight:600;opacity:.6}.sc .mn{font-size:11.5px;line-height:1.45;opacity:.72;margin-top:5px}.sgnone{text-align:center;opacity:.7;padding:26px 8px;font-size:14px}
  .gchip{background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:7px 14px;font-size:13px;font-weight:700;color:var(--ink);cursor:pointer}
  .gsec{border:1px solid var(--line);border-radius:14px;background:var(--surface);margin-bottom:10px;overflow:hidden;box-shadow:var(--shadow)}
  .gsec>summary{list-style:none;cursor:pointer;padding:15px 16px;display:flex;align-items:center;gap:11px;font-weight:800;font-size:15.5px}
  .gsec>summary::-webkit-details-marker{display:none}
  .gsec>summary .gic{font-size:21px;line-height:1}
  .gsec>summary .gct{margin-inline-start:auto;color:var(--muted);font-weight:700;font-size:12.5px;background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:2px 10px}
  .gsec>summary .gcar{color:var(--muted);font-size:12px;transition:transform .2s ease}
  .gsec[open]>summary .gcar{transform:rotate(90deg)}
  .gbody{padding:0 16px 14px}
  .gsub{font-weight:800;font-size:12px;color:var(--muted);margin:14px 2px 8px;letter-spacing:.04em;text-transform:uppercase}
  .gsgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .gscard{border:1px solid var(--line);border-radius:12px;padding:11px 9px;background:var(--surface2);display:flex;flex-direction:column;align-items:center;text-align:center}
  .gscard svg{width:60px;height:60px}
  .gscard .gsn{font-weight:800;font-size:13px;margin-top:7px}
  .gscard .gsm{color:var(--muted);font-size:11.7px;line-height:1.42;margin-top:4px}
  .gbul{list-style:none;padding:0;margin:0}
  .gbul li{position:relative;padding:9px 0;padding-inline-start:20px;border-bottom:1px solid var(--line);font-size:13.8px;line-height:1.5}
  .gbul li:last-child{border-bottom:none}
  .gbul li::before{content:"";position:absolute;inset-inline-start:2px;top:15px;width:7px;height:7px;border-radius:50%;background:var(--accent)}
  .foot{color:var(--muted);font-size:11.5px;text-align:center;padding:6px 16px 20px;line-height:1.5}
  button:focus-visible,.tile:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div id="app" dir="ltr">
  <header>
    <div class="logo" onclick="Go('home')" role="button" tabindex="0">
      <svg viewBox="0 0 48 48" fill="none" aria-hidden="true">
        <circle cx="24" cy="24" r="21" stroke="currentColor" stroke-width="4"/>
        <circle cx="24" cy="24" r="6.5" fill="currentColor"/>
        <path d="M24 3.5v14M8.5 33 20 26M39.5 33 28 26" stroke="currentColor" stroke-width="4" stroke-linecap="round"/>
      </svg>
      <span id="brand">Tareeq<small id="brandSub">Kurdistan Driving Theory</small></span>
    </div>
    <div class="hbtns">
      <button id="szB" class="szbtn" onclick="toggleSize()" aria-pressed="false" aria-label="Text size" title="Text size">Aa</button>
      <div class="lang" role="group" aria-label="Language">
        <button id="kuB" aria-pressed="true" onclick="setLang('ku')">کوردی</button>
        <button id="enB" aria-pressed="false" onclick="setLang('en')">EN</button>
      </div>
    </div>
  </header>
  <main id="view"></main>
  <div class="foot" id="foot"></div>
</div>

<script>
(function(){
  "use strict";

    Q("rules",null,"At 40 km/h with no one behind you, a cyclist ahead is passing a parked car. What do you do?","",

    Q("rules",null,"Driving straight ahead at 50–60 km/h on a narrow road with an oncoming cyclist and a bump ahead, what do you do?","",

    Q("rules",null,"Approaching a village junction with give-way signs at 50 km/h, what should you be most aware of?","",

    Q("rules",null,"You are turning right at a junction, but cyclists are going straight across your path. What do you do?","",

    // ---- Kurdish "Traffic Light" hazard app, batch 10 (correct answer shown in green) ----
    Q("rules",null,"You have wanted to overtake for a while, but the oncoming vehicle has not left you room. What should you do?","",

    Q("rules",null,"You are in the correct lane to turn right at the junction ahead. How should you proceed?","",

    Q("rules",null,"It has just started to rain. What should you be most aware of?","",

    Q("rules",null,"At 70–80 km/h you are unsure whether the oncoming vehicle will pull out to overtake the lorry in front of it. How should you proceed?","",

      "If an oncoming vehicle might pull out to overtake into your lane, use your headlights so you are seen and be ready to slow down — do not just hold your speed or accelerate.","","بەخێرایی ٧٠-٨٠ کم/سەعات لێدەخوڕیت و دڵنیانیت ئۆتۆمبیلی ڕووبەڕووت لۆریەکە تێدەپەڕێنیت یاخود نا، بە چ شێوازێک بەردەوام دەبیت؟","ئەگەر لەوانەیە ئۆتۆمبیلی ڕووبەڕوو بۆ تێپەڕاندن بێتە ناو ڕێڕەوەکەت، لایتەکانت بەکاربهێنە بۆ ئەوەی دەبینرێیت و ئامادە بە بۆ کەمکردنەوەی خێرایی — تەنها خێراییەکەت مەگرە و خێراتریش مەکە."),

    Q("rules",null,"You are driving at 30 km/h behind a child on a bicycle, and there is no vehicle behind you. What should you do?","",
      [O("Keep the same speed, or only slightly slower","","بەهەمان خێرایی یان تۆزێک کەمتر بەردەوام دەبم"),O("Warn the child with your horn","","بە هۆڕن پاسکیل سوارەکە وریا دەکەمەوە"),O("Be ready to brake and stop for the child","","بە توندی ئیستۆپ دەگرم")],2,
      "A child on a bike can wobble or change direction without warning. With nothing behind you, it is safe to slow right down and be ready to stop. Do not sound the horn — it may startle the child into the road.","","بەخێرایی ٣٠ کم/سەعات لە دوای منداڵێکی پاسکیلسواردا لێدەخوڕیت و هیچ ئۆتۆمبیلێک لە پشتتەوە نییە، چی دەکەیت؟","منداڵێکی پاسکیلسوار لەوانەیە بەبێ ئاگادارکردنەوە بلەقێت یان ئاراستە بگۆڕێت. کە هیچ لە پشتتەوە نییە، سەلامەتە خێرایی زۆر کەم بکەیتەوە و ئامادە بیت بۆ وەستان. هۆڕن لێمەدە — لەوانەیە منداڵەکە بترسێنێت و بەرەو ڕێگا بیبات."),
    Q("rules",null,"When must you use your headlights?","",

    Q("signs","motor_road","This sign means:","",[O("A road reserved for motor vehicles (expressway) begins","","ڕێگەی تایبەت بە ئۆتۆمبیل (نیمچەخێرا) دەستپێدەکات"),O("The expressway ends here","","ڕێگەی نیمچەخێرا لێرە تەواودەبێت"),O("Watch for oncoming traffic","","ئاگاداری هاتووچۆی ڕووبەڕوو بە")],0,"The blue sign with a white car marks the start of a road for motor vehicles only — slow tractors, cyclists and pedestrians are not allowed.","","ئەم هێمایە واتای:","هێمای شین لەگەڵ ئۆتۆمبێلی سپی دەستپێکی ڕێگایەک دیاری دەکات کە تەنها بۆ ئۆتۆمبێلە — تراکتۆری هێواش و پاسکیلسوار و پیادە ڕێگەپێنەدراون."),
    Q("signs","give_way_oncoming","You meet this sign at a narrow section. What must you do?","",[O("Give way — stop and let the oncoming vehicle pass first","","ڕێگا بدە — بوەستە و ڕێگا بدە بە ئۆتۆمبیلی ڕووبەڕوو یەکەم تێبپەڕێت"),O("You have priority — the oncoming vehicle must stop for you","","تۆ پێشینەت هەیە — ئۆتۆمبیلی ڕووبەڕوو دەبێت بۆت بوەستێت"),O("Sound your horn and drive through","","هۆڕن لێبدە و تێپەڕە")],0,"The red arrow on your side means oncoming traffic has priority through the narrow stretch — wait and give way.","","لە بەشێکی تەسکدا بەم هێمایە دەگەیت. دەبێت چی بکەیت؟","تیری سوور لەلای تۆوە واتای ئەوەیە هاتووچۆی ڕووبەڕوو پێشینەی هەیە بەناو بەشە تەسکەکەدا — چاوەڕێ بکە و ڕێگا بدە."),
    Q("signs","bends","This warning sign shows bends with '45' beneath it. What does it mean?","",[O("It is dangerous to drive faster than 45 km/h — an advisory speed","","مەترسیدارە خێراتر لە ٤٥ کم/کاتژمێر لێبخوڕیت — خێراییەکی ئامۆژگاریە"),O("It is illegal to drive faster than 45 km/h","","قەدەغەیە خێراتر لە ٤٥ کم/کاتژمێر لێبخوڕیت"),O("The bends end in 45 metres","","پێچەکان لە ٤٥ مەتردا تەواودەبن")],0,"A number under a warning sign is an advisory (recommended) speed for the hazard — it is unsafe, not illegal, to go faster. Slow down for the bends.","","ئەم هێمای ئاگادارکردنەوەیە پێچەکان و ژمارەی '٤٥' پیشان دەدات. واتای چییە؟","ژمارەیەک لەژێر هێمای ئاگادارکردنەوەدا خێراییەکی ئامۆژگاری (پێشنیارکراو)یە بۆ مەترسییەکە — ناسەلامەتە خێراتر بڕۆیت، بەڵام قەدەغە نییە. بۆ پێچەکان خێرایی کەم بکەرەوە."),

    Q("rules",null,"On a multi-lane road, the overhead signs show that your lane already leads to where you want to go. What should you do?","",
      [O("Stay in your lane — do not change lanes unnecessarily","","لە ڕێڕەوەکەی خۆتدا بمێنەرەوە — بەبێ پێویست ڕێڕەو مەگۆڕە"),O("Move across to the right-hand lane","","بگوازەرەوە بۆ ڕێڕەوی لای ڕاست"),O("Move across to the far left-hand lane","","بگوازەرەوە بۆ ڕێڕەوی ئەوپەڕی لای چەپ")],0,
      "Read the overhead lane signs early. If your current lane already serves your route, stay in it — unnecessary lane changes on a multi-lane road create risk. Only move over when the signs show your lane does not go where you need.","","لە ڕێگایەکی فرەڕێڕەودا، هێماکانی سەرەوە پیشان دەدەن کە ڕێڕەوەکەت پێشتر بەرەو شوێنی مەبەستت دەڕوات. دەبێت چی بکەیت؟","زوو هێماکانی سەرەوەی ڕێڕەو بخوێنەرەوە. ئەگەر ڕێڕەوی ئێستات پێشتر بۆ ڕێگاکەت دەڕوات، لێی بمێنەرەوە — گۆڕینی ڕێڕەوی بەبێ پێویست لە ڕێگای فرەڕێڕەودا مەترسی دروست دەکات. تەنها کاتێک بگوازەرەوە کە هێماکان پیشان دەدەن ڕێڕەوەکەت بۆ شوێنی مەبەست ناڕوات."),
    // ---- Kurdish "Traffic Light" app, batch 16 (expressway merging + parking rule; correct answer shown in green) ----
    Q("rules",null,"You are on the slip road joining an expressway at 50 km/h. A lorry is just ahead in the lane you must merge into, and there is nothing behind you. What should you do?","",
      [O("Ease off slightly and merge safely into the gap behind the lorry","","خێراییەکەم تۆزێک کەمدەکەمەوە و بە سەلامەتی لە دوای لۆرییەکەوە یەکدەگرم"),O("Speed up to get in front of the lorry","","خێراییم بەرزدەکەمەوە بۆ ئەوەی پێش لۆرییەکە بکەوم"),O("Keep your speed and force your way in","","خێراییەکەم دەپارێزم و بە زۆر خۆم دەکەمە ناوی")],0,
      "Use the slip road to match the speed of expressway traffic and merge into a safe gap. If a vehicle is right beside you, adjust your speed — here, ease off to slot in behind the lorry — never force your way in.","","لەسەر ڕێگای چوونەناوی ڕێگای خێرا بە خێرایی ٥٠ کم/سەعات دەڕۆیت. لۆرییەک تەنها لە پێشتەوەیە لەو ڕێڕەوەی دەبێت یەکیبگریت، و هیچ لە پشتتەوە نییە. چی دەکەیت؟","ڕێگای چوونەناو بەکاربهێنە بۆ هاوتەریبکردنی خێرایی لەگەڵ هاتووچۆی ڕێگای خێرا و یەکگرتن لە کەلێنێکی سەلامەتدا. ئەگەر ئۆتۆمبێلێک ڕێک لەلاتەوەیە، خێراییەکەت بگۆڕە — لێرەدا کەمی بکەرەوە بۆ چوونە دوای لۆرییەکە — هەرگیز بە زۆر خۆت مەکە ناوی."),
    Q("rules",null,"May you park your car under a bridge or in an underpass like this one?","",

      "Never park under a bridge, in a tunnel or underpass, on or near a junction, or anywhere that blocks traffic or sight lines. Park only where it is clearly permitted and safe.","","دەتوانیت ئۆتۆمبیلەکەت لەژێر پردێک یان لە ژێرگوزەرێکی وەک ئەمەدا پارک بکەیت؟","هەرگیز لەژێر پرد، لە تونێل یان ژێرگوزەر، لەسەر یان نزیک چوارڕیان، یان لە هەر شوێنێک کە ڕێگری لە هاتووچۆ یان بینین دەکات پارک مەکە. تەنها لەو شوێنانە پارک بکە کە بە ڕوونی ڕێگەپێدراو و سەلامەتن."),
    // ---- Kurdish "Traffic Light" app, batch 17 (crosswind, police signals, wiper failure; correct answer in green) ----
    Q("rules",null,"You are following a vehicle towing a caravan across an exposed bridge in a strong crosswind. What should you be most aware of?","",

      "A strong crosswind can push a caravan, trailer or high-sided vehicle sideways and make it hard to control. Keep well back, leave extra room, and be ready for sudden sideways movement — especially on bridges and open, exposed roads.","","لە دوای ئۆتۆمبیلێکەوە دەڕۆیت کە کەرەشانی بەدواوەیە لەسەر پردێکی کراوە، و بایەکی بەهێزی لاتەنیش هەیە. زۆرترین دەبێت ئاگاداری چی بیت؟","بای بەهێزی لاتەنیش دەتوانێت کەرەشان، تریلە یان ئۆتۆمبیلی بەرزلا بەلادا پاڵبنێت و کۆنترۆڵکردنی قورس بکات. چاک خۆت لێ دوور بگرە، بۆشایی زیاتر بهێڵە، و ئامادە بە بۆ جووڵەی لەناکاوی لاتەنیش — بەتایبەت لەسەر پرد و ڕێگای کراوەدا."),

    Q("mech",null,"In heavy rain, your windscreen wipers suddenly stop working. What should you do?","",

      [O("Follow the yellow lines — temporary markings override the permanent white ones","","دوای هێڵە زەردەکان بکەوە — نیشانە کاتییەکان لەسەر سپییە جێگیرەکان پێشترن"),O("Follow the white lines and go straight on","","دوای هێڵە سپییەکان بکەوە و ڕاست بڕۆ"),O("Keep your speed and stay exactly where you are","","خێراییەکەت بپارێزە و ڕێک لە شوێنی خۆتدا بمێنەرەوە")],0,
      "At roadworks or lane closures, temporary yellow lane markings take priority over the normal white ones. Follow the yellow lines and keep to the open lane on the right.","","لە پێشەوە ڕێڕەوێک داخراوە. هێڵە زەردە کاتییەکان هاتووچۆ بۆ لای ڕاست ڕێنمایی دەکەن، لە کاتێکدا هێڵە سپییە کۆنەکان هێشتا ڕاست دەڕۆن. کامیان پەیڕەو دەکەیت؟","لە شوێنی کارکردن یان داخستنی ڕێڕەودا، هێڵە زەردە کاتییەکان لەسەر هێڵە سپییە ئاساییەکان پێشترن. دوای هێڵە زەردەکان بکەوە و لە ڕێڕەوی کراوەی لای ڕاست بمێنەرەوە."),

      "This sign marks the start of a motorway. Motorway rules apply: no pedestrians, cyclists, slow vehicles or U-turns, and you must keep up with the faster traffic flow.","","ئەم هێما شینە واتای چییە؟","ئەم هێمایە دەستپێکی ڕێگای خێرا دیاری دەکات. یاسای ڕێگای خێرا جێبەجێ دەبێت: پیادە، پاسکیلسوار، ئۆتۆمبیلی هێواش و سووڕانەوە ڕێگەپێنەدراون، و دەبێت لەگەڵ ڕۆیشتنی خێراتری هاتووچۆ بڕۆیت."),

    Q("rules",null,"The road ahead is flooded and you cannot tell how deep the water is. What should you do?","",

      "Never drive into floodwater of unknown depth — it can be deeper and faster-moving than it looks, stall the engine, or sweep the car away. Turn around and find another route.","","ڕێگاکەی پێشەوە ژێر ئاو کەوتووە و ناتوانیت بزانیت ئاوەکە چەند قووڵە. دەبێت چی بکەیت؟","هەرگیز مەچۆ ناو ئاوی ڕژاوی ناناسراوی قووڵی — لەوانەیە قووڵتر و خێراتر بێت لەوەی دیارە، بزوێنەر بکوژێنێتەوە، یان ئۆتۆمبیلەکە ببات. بگەڕێوە و ڕێگەیەکی تر بدۆزەوە."),

      "Traffic joining a motorway must give way, but where it is safe and the next lane is clear, moving over eases merging and keeps traffic flowing. Check it is clear, signal, then move over.","","لەسەر ڕێگای خێرا دەڕۆیت و هیچ لە پشتتەوە نییە، و لۆرییەک لە ڕێگای چوونەناوەوە لەلای ڕاستتەوە دەچێتە ناوی. کاری سەلامەت و ڕێزدارانە چییە؟","هاتووچۆی هاتنە ناو ڕێگای خێرا دەبێت ڕێگا بدات، بەڵام لەکوێ سەلامەتە و ڕێڕەوی داهاتوو خاڵییە، گواستنەوە یەکگرتن ئاسان دەکات و هاتووچۆ بەردەوام دەکات. دڵنیابە خاڵییە، لایت دابگرسێنە، پاشان بگوازەرەوە."),

      "A speed number on a supplementary plate beneath a warning sign is an advisory (recommended) speed for the hazard, not a red-circle legal limit. Slow to around that speed to take the bend safely — a mandatory limit would instead be shown as a number inside a red circle.","","لەژێر سێگۆشەی ئاگادارکردنەوەی پێچدا تابلۆیەک هەیە کە '٤٠' نیشان دەدات. ئەم '٤٠'یە چی دەگەیەنێت؟","ژمارەی خێرایی لەسەر تابلۆیەکی لاوەکی لەژێر هێمای ئاگادارکردنەوەدا خێراییەکی ئامۆژگاریکراوە (پێشنیارکراو) بۆ مەترسییەکە، نەک سنووری یاسایی بازنە سوور. خێرایی کەم بکەرەوە بۆ نزیکەی ئەو خێراییە بۆ ئەوەی بە سەلامەتی پێچەکە ببڕیت — سنووری ناچاری بە ژمارەیەک لەناو بازنەیەکی سووردا پیشان دەدرێت."),

    Q("signs","uneven_road","What does this warning sign mean?","",
      [O("The road surface is uneven or broken up — slow down before you reach it","","ڕووی ڕێگا ناتەخت یان تێکشکاوە — پێش گەیشتن خێرایی کەم بکەرەوە"),O("A single artificial speed hump is ahead","","یەک بەرزکراوەی دەستکردی خێرایی لە پێشەوەیە"),O("A hill with a summit is ahead","","گردێک بە لووتکەوە لە پێشەوەیە")],0,
      "This warns of a rough, wavy or damaged road surface — not a single built speed hump. Slow down before you reach it: hitting bumps at speed upsets the steering and suspension, and can throw a motorcycle or a loaded vehicle off line.","","ئەم هێمای ئاگادارکردنەوەیە چی دەگەیەنێت؟","ئەمە ئاگادارکردنەوەیە لە ڕووی ڕێگای ناهەموار، شەپۆلاوی یان زیانلێکەوتوو — نەک یەک بەرزکراوەی دروستکراوی خێرایی. پێش گەیشتن خێرایی کەم بکەرەوە: بەرکەوتنی بەرزکراوەکان بە خێرایی ستیرینگ و سیستەمی هەڵگرتن تێکدەدات، و دەتوانێت ماتۆڕسیکل یان ئۆتۆمبیلی بارکراو لە ئاراستە دەربخات."),
    // ---- Kurdish "Traffic Light" app, sign gallery (turn left / bend right / ahead-or-right / road edge / roundabout ahead) ----
    Q("signs","turn_left","What does this blue sign mean?","",
      [O("You must turn left here","","لێرەدا دەبێت بۆ لای چەپ بسووڕێیتەوە"),O("Left turns are forbidden here","","سووڕانەوە بۆ چەپ لێرە قەدەغەیە"),O("A left bend is coming up","","پێچێکی چەپ لە پێشەوەیە")],0,
      "A blue circle gives a compulsory instruction. A blue circle with a left arrow means you must turn left — it is not a warning and not a prohibition. The prohibition version would be a red circle with the arrow crossed out.","","ئەم هێمای شینە چی دەگەیەنێت؟","بازنەی شین ڕێنمایی ناچاری دەدات. بازنەی شین لەگەڵ تیری چەپ واتای ئەوەیە دەبێت بۆ لای چەپ بسووڕێیتەوە — ئاگادارکردنەوە نییە و قەدەغەکردنیش نییە. شێوەی قەدەغەکردن بازنەیەکی سوورە کە تیرەکەی بەسەردا هێڵکێشراوە."),
    Q("signs","bend_right","What does this warning sign mean?","",
      [O("A sharp bend to the right — slow down before you reach it","","پێچێکی توند بۆ لای ڕاست — پێش گەیشتن خێرایی کەم بکەرەوە"),O("You must turn right here","","لێرەدا دەبێت بۆ لای ڕاست بسووڕێیتەوە"),O("The road bends to the left","","ڕێگاکە بۆ لای چەپ دەپێچێتەوە")],0,
      "A red triangle warns of a sharp right-hand bend. Do your braking before the bend, not in it — braking mid-corner unsettles the car and can cause a skid.","","ئەم هێمای ئاگادارکردنەوەیە چی دەگەیەنێت؟","سێگۆشەیەکی سوور ئاگادار دەکاتەوە لە پێچێکی توندی لای ڕاست. برێکەکەت پێش پێچەکە بکە، نەک لە ناویدا — برێکگرتن لە ناوەڕاستی پێچدا ئۆتۆمبیل ناجێگیر دەکات و دەتوانێت ببێتە هۆی خلیسکبوونەوە."),
    Q("signs","ahead_or_right","What does this blue sign mean?","",
      [O("You may only go straight ahead or turn right","","تەنها دەتوانیت ڕاست بەرەوپێش بڕۆیت یان بۆ لای ڕاست بسووڕێیتەوە"),O("You may go in any direction you choose","","دەتوانیت بە هەر ئاراستەیەکدا بڕۆیت کە هەڵیدەبژێریت"),O("The road divides into two separate roads","","ڕێگاکە دەبێت بە دوو ڕێگای جیاواز")],0,
      "The arrows show the only movements allowed from here: straight on or right. Turning left or making a U-turn is not permitted. Pick your lane early so you are in the right place for the way you want to go.","","ئەم هێمای شینە چی دەگەیەنێت؟","تیرەکان تەنها ئەو جووڵانە پیشان دەدەن کە لێرەوە ڕێگەپێدراون: ڕاست بەرەوپێش یان بۆ لای ڕاست. سووڕانەوە بۆ چەپ یان گەڕانەوە ڕێگەپێنەدراوە. زوو لاینەکەت هەڵبژێرە تاکو لە شوێنی دروستدا بیت بۆ ئەو ئاراستەیەی دەتەوێت."),
    Q("signs","road_edge","What does this warning sign mean?","",
      [O("A dangerous road edge — the shoulder drops away, so keep away from the verge","","قەراغی ڕێگای مەترسیدار — شانەکە دادەبەزێت، بۆیە لە لێوارەکە دووربکەوە"),O("A speed hump is ahead","","بەرزکراوەی خێرایی لە پێشەوەیە"),O("The road is banked for a bend","","ڕێگاکە بۆ پێچێک لادراوە")],0,
      "There is a sharp drop between the carriageway and the shoulder. If a wheel drops off the edge, do not snatch the steering to get back — ease off, hold the wheel firmly and come back gently when it is safe. Keep clear of the verge, especially when passing.","","ئەم هێمای ئاگادارکردنەوەیە چی دەگەیەنێت؟","نێوان ڕێگاکە و شانەکە داکشانێکی توندی هەیە. ئەگەر چەرخێک لە لێوارەکە کەوتە خوارەوە، بە توندی ستیرینگ مەکێشە بۆ گەڕانەوە — پێ هەڵبگرە، ستیرینگ بە توندی بگرە و کاتێک سەلامەتە بە نەرمی بگەڕێوە. لە لێوارەکە دووربکەوە، بەتایبەت لە کاتی تێپەڕاندندا."),
    Q("signs","roundabout_ahead","What does this warning sign mean?","",
      [O("A roundabout is ahead — slow down and be ready to give way to traffic already on it","","بازنەیەک لە پێشەوەیە — خێرایی کەم بکەرەوە و ئامادەبە بۆ ڕێگادان بە هاتووچۆی ناو بازنەکە"),O("You must drive around the roundabout to the left","","دەبێت بەلای چەپدا بە دەوری بازنەکەدا بڕۆیت"),O("Vehicles are turning in a circle for no reason","","ئۆتۆمبیلەکان بەبێ هۆ بە بازنە دەسووڕێنەوە")],0,
      "The red triangle is a warning that a roundabout is coming up, not the blue mandatory sign at the roundabout itself. Slow down on the approach, read the lane markings early, and give way to traffic already circulating.","","ئەم هێمای ئاگادارکردنەوەیە چی دەگەیەنێت؟","سێگۆشەی سوور ئاگادارکردنەوەیە کە بازنەیەک لە پێشەوەیە، نەک ئەو هێما شینە ناچارییەی لە خودی بازنەکەدایە. لە کاتی نزیکبوونەوە خێرایی کەم بکەرەوە، زوو نیشانەکانی لاین بخوێنەوە، و ڕێگا بدە بەو هاتووچۆیەی پێشتر لە بازنەکەدا دەسووڕێتەوە."),
    // ---- Kurdish "Traffic Light" app, reference pages (warning-triangle distances, roadworthiness, plates, licence) ----
    Q("rules",null,"Your vehicle has broken down. How far behind it should the reflective warning triangle be placed?","",
      [O("About 50 m inside a town, 100 m outside a town, and 150 m in mountainous areas","","نزیکەی ٥٠ م لەناو شار، ١٠٠ م لە دەرەوەی شار، و ١٥٠ م لە ناوچە شاخاوییەکان"),O("Always exactly 10 m behind the vehicle","","هەمیشە بە تەواوی ١٠ م لە دواوەی ئۆتۆمبیلەکە"),O("Right next to the vehicle so drivers see them together","","ڕێک لەتەنیشت ئۆتۆمبیلەکە بۆ ئەوەی شۆفێران پێکەوە بیانبینن")],0,
      "The triangle must go far enough back that drivers get real warning before they reach you. The faster and less visible the road, the further back it goes: roughly 50 m in town, 100 m on the open road, and 150 m in the mountains where bends hide the view. Put on your hazard lights and a high-visibility vest first.","","ئۆتۆمبیلەکەت پەککەوتووە. سێگۆشەی ئاگادارکردنەوەی فسفۆڕی دەبێت چەند دوور لە دواوەی دابنرێت؟","سێگۆشەکە دەبێت ئەوەندە دوور دابنرێت کە شۆفێران ئاگادارکردنەوەی ڕاستەقینەیان دەستکەوێت پێش ئەوەی پێت بگەن. ڕێگا هەرچەند خێراتر و کەمتر دیار بێت، دوورتر دادەنرێت: نزیکەی ٥٠ م لەناو شار، ١٠٠ م لە ڕێگای کراوە، و ١٥٠ م لە شاخەکاندا کە پێچەکان دیمەن دەشارنەوە. سەرەتا لایتی مەترسی و جلی دیارکەرەوە لەبەربکە."),
    Q("mech",null,"Which of these must be in the vehicle for it to pass a roadworthiness check?","",
      [O("A reflective warning triangle, an in-date fire extinguisher, and a spare tyre with a jack and wheel wrench","","سێگۆشەی ئاگادارکردنەوەی فسفۆڕ، ئاگرکوژێنەرەوەیەکی بەسەرنەچوو، و تایەی سپێر لەگەڵ جەک و سپانە"),O("Only a first-aid kit","","تەنها سندوقی فریاگوزاری سەرەتایی"),O("Nothing — only the vehicle's paperwork matters","","هیچ — تەنها بەڵگەنامەکانی ئۆتۆمبیل گرنگن")],0,
      "A roadworthiness check covers the emergency kit as well as the vehicle itself: the warning triangle, a fire extinguisher that has not passed its expiry date, and a spare tyre together with the jack and wheel wrench needed to fit it. Mirrors and windows must also be clean and unbroken, and the number plate readable from a distance.","","کام لەمانە دەبێت لە ئۆتۆمبیلەکەدا هەبێت تاکو لە پشکنینی توندوتۆڵیدا دەربچێت؟","پشکنینی توندوتۆڵی کەرەستەی فریاگوزاریش لەخۆدەگرێت وەک خودی ئۆتۆمبیلەکە: سێگۆشەی ئاگادارکردنەوە، ئاگرکوژێنەرەوەیەک کە بەرواری بەسەرچوونی تێنەپەڕیوە، و تایەیەکی سپێر لەگەڵ جەک و سپانەی پێویست بۆ دانانی. هەروەها ئاوێنە و پەنجەرەکان دەبێت پاک و نەشکاو بن، و تابلۆی ژمارە لە دوورەوە خوێندنەوەی بۆ بکرێت."),
    Q("rules",null,"In the Kurdistan Region, a vehicle with a WHITE number plate is:","",
      [O("A private vehicle","","ئۆتۆمبیلێکی تایبەت"),O("A goods (cargo) vehicle","","ئۆتۆمبیلێکی بارهەڵگر"),O("A government vehicle","","ئۆتۆمبیلێکی حکومەت")],0,
      "Plate colours identify what a vehicle is used for: white = private, red = public passenger transport, yellow = goods/cargo, blue = government departments, green = defence. Knowing them helps you predict how a vehicle is likely to behave in traffic.","","لە هەرێمی کوردستاندا، ئۆتۆمبیلێک بە تابلۆی سپییەوە:","ڕەنگی تابلۆ دیاری دەکات ئۆتۆمبیلەکە بۆ چی بەکاردێت: سپی = تایبەت، سوور = گواستنەوەی گشتیی نەفەر، زەرد = بارهەڵگر، شین = دامودەزگاکانی حکومەت، سەوز = بەرگری. زانینیان یارمەتیت دەدات پێشبینی بکەیت ئۆتۆمبیلەکە لە هاتووچۆدا چۆن ڕەفتار دەکات."),
    Q("rules",null,"You are behind a vehicle with a YELLOW number plate. What does that tell you?","",
      [O("It is a goods (cargo) vehicle — expect it to be heavy, slower and to need longer to stop","","ئۆتۆمبیلێکی بارهەڵگرە — چاوەڕێی بکە قورس و هێواشتر بێت و کاتی زیاتری بوێت بۆ وەستان"),O("It is a taxi","","تاکسییە"),O("It belongs to the police","","هی پۆلیسە")],0,
      "A yellow plate marks a goods or cargo vehicle. Loaded vehicles accelerate slowly, take much longer to stop and swing wide on bends — leave a bigger gap and do not cut in front of one.","","لە دوای ئۆتۆمبیلێکی بە تابلۆی زەردیت. ئەمە چیت پێ دەڵێت؟","تابلۆی زەرد ئۆتۆمبیلی بارهەڵگر دیاری دەکات. ئۆتۆمبیلی بارکراو بەهێواشی خێرا دەبێت، کاتێکی زۆر زیاتری دەوێت بۆ وەستان و لە پێچەکاندا فراوان دەسووڕێتەوە — کەلێنێکی گەورەتر بهێڵە و لەبەردەمیدا مەبڕە."),
    Q("rules",null,"Which of these is required before you can be granted a driving licence?","",
      [O("Being medically and mentally fit, of the required age, not banned by a court, and passing both the theory and practical tests","","بارودۆخی تەندروستی و دەروونی باش، تەمەنی پێویست، قەدەغەنەکراو لەلایەن دادگاوە، و دەرچوون لە تاقیکردنەوەی تیۆری و پراکتیکی"),O("Only passing the practical driving test","","تەنها دەرچوون لە تاقیکردنەوەی پراکتیکی"),O("Only owning a vehicle","","تەنها خاوەندارێتی ئۆتۆمبیل")],0,
      "All four conditions must be met: you must be medically and mentally fit to drive, have reached the required age, not be under a court driving ban, and have passed both the theory and the practical test. Failing any one of them means no licence.","","کام لەمانە پێویستە پێش ئەوەی مۆڵەتی لێخوڕینت پێبدرێت؟","دەبێت هەر چوار مەرجەکە جێبەجێ بن: دەبێت لە ڕووی تەندروستی و دەروونییەوە توانای لێخوڕینت هەبێت، گەیشتبیت بە تەمەنی پێویست، لەلایەن دادگاوە قەدەغەی لێخوڕینت لەسەر نەبێت، و لە هەردوو تاقیکردنەوەی تیۆری و پراکتیکیدا دەرچووبیت. نەبوونی هەریەکێکیان واتە مۆڵەت نادرێت."),
    Q("rules",null,"In which of these cases can a driving licence be withdrawn?","",
      [O("Causing a crash you are fully at fault for in which someone dies or is disabled, leaving the scene of a crash, or having your licence confiscated three times","","دروستکردنی ڕووداوێک کە بە تەواوی تاوانباریت تێیدا و کەسێک گیانی لەدەست دەدات یان کەم‌ئەندام دەبێت، ڕاکردن لە شوێنی ڕووداو، یان سێ جار کۆنکردنی مۆڵەتەکەت"),O("Only for parking in the wrong place","","تەنها بۆ پارککردن لە شوێنی هەڵە"),O("Only if you drive an unregistered vehicle","","تەنها ئەگەر ئۆتۆمبیلێکی تۆمارنەکراو لێبخوڕیت")],0,
      "A licence can be taken away for the most serious failures: causing a fatal or disabling crash for which you are wholly to blame, causing a crash and leaving the scene, failing to give way where you must and causing a crash, or having the licence confiscated by the police three times.","","لە کام لەم حاڵەتانەدا دەکرێت مۆڵەتی لێخوڕین لێبسەندرێتەوە؟","مۆڵەت دەکرێت لێبسەندرێتەوە لە هەڵە هەرە گەورەکاندا: دروستکردنی ڕووداوێکی کوشندە یان کەم‌ئەندامکەر کە بە تەواوی تاوانباریت تێیدا، دروستکردنی ڕووداو و ڕاکردن لە شوێنەکە، ڕێگانەدان لەو شوێنانەی پێویستە و دروستکردنی ڕووداو، یان سێ جار کۆنکردنی مۆڵەتەکە لەلایەن پۆلیسەوە."),
    // ---- Kurdish driving-school wall chart (prohibition, warning and mandatory signs) ----
    Q("signs","no_right","What does this sign mean?","",
      [O("Turning right is prohibited here","","سووڕانەوە بۆ لای ڕاست لێرە قەدەغەیە"),O("You must turn right here","","لێرەدا دەبێت بۆ لای ڕاست بسووڕێیتەوە"),O("A right bend is coming up","","پێچێکی ڕاست لە پێشەوەیە")],0,
      "A red circle with the arrow crossed out is a prohibition: you may not turn right at this junction. The blue circle with a plain right arrow means the opposite — that you must turn right.","","ئەم هێمایە چی دەگەیەنێت؟","بازنەی سوور کە تیرەکەی بەسەردا هێڵکێشراوە قەدەغەکردنە: ناتوانیت لەم چوارڕیانەدا بۆ لای ڕاست بسووڕێیتەوە. بازنەی شین لەگەڵ تیرێکی ساکاری ڕاست پێچەوانەکەی دەگەیەنێت — کە دەبێت بۆ لای ڕاست بسووڕێیتەوە."),
    Q("signs","other_danger","What does this warning sign mean?","",
      [O("Some other danger not covered by another sign — read any plate below it and slow down","","مەترسییەکی تر کە هێمایەکی تر ناینوێنێت — هەر تابلۆیەکی ژێری بخوێنەوە و خێرایی کەم بکەرەوە"),O("An exclamation point marks the end of all warnings","","نیشانەی سەرسوڕمان کۆتایی هەموو ئاگادارکردنەوەکان دیاری دەکات"),O("You must sound your horn here","","لێرەدا دەبێت هۆڕن لێبدەیت")],0,
      "The exclamation mark is the general danger sign, used where no specific symbol exists. There is usually a plate underneath saying what the hazard is. Slow down and be ready to react.","","ئەم هێمای ئاگادارکردنەوەیە چی دەگەیەنێت؟","نیشانەی سەرسوڕمان هێمای مەترسیی گشتییە، لەو شوێنانەدا بەکاردێت کە هێمایەکی تایبەت نییە. زۆرجار تابلۆیەک لە ژێریدایە کە مەترسییەکە ڕوون دەکاتەوە. خێرایی کەم بکەرەوە و ئامادەبە بۆ کاردانەوە."),
    Q("signs","side_wind","What does this warning sign mean?","",
      [O("Strong side wind — hold the wheel firmly and expect a push when you leave shelter","","بای بەهێزی تەنیشت — ستیرینگ بە توندی بگرە و چاوەڕێی پاڵنانێک بکە کاتێک لە پەناگە دەردەچیت"),O("An airport is ahead","","فڕۆکەخانەیەک لە پێشەوەیە"),O("A flag-marked checkpoint is ahead","","خاڵێکی پشکنینی ئاڵادار لە پێشەوەیە")],0,
      "A windsock warns of strong crosswinds. Hold the steering wheel firmly, slow down, and take extra care as you come out from behind a bridge, cutting or large vehicle — the sudden gust can push you sideways. High-sided vehicles, caravans and motorcycles are affected most.","","ئەم هێمای ئاگادارکردنەوەیە چی دەگەیەنێت؟","جۆرابەبا ئاگادار دەکاتەوە لە بای بەهێزی تەنیشت. ستیرینگ بە توندی بگرە، خێرایی کەم بکەرەوە، و زیاتر وریابە کاتێک لە پشت پرد، بڕین یان ئۆتۆمبیلێکی گەورەوە دەردەچیت — پاڵەی لەناکاو دەتوانێت بەرەو تەنیشت پاڵت پێوەبنێت. ئۆتۆمبیلی بەرزلا، کاروان و ماتۆڕسیکل زۆرترین کاریگەرییان لێدەبێت."),
    Q("signs","steep_ascent","What does this warning sign mean?","",
      [O("A steep uphill ahead — change down in good time so the engine does not labour","","سەرکەوتنێکی توند لە پێشەوە — بەکاتی خۆی گێر دابەزێنە تاکو بزوێنەر ماندوو نەبێت"),O("A steep downhill ahead","","داکشانێکی توند لە پێشەوە"),O("A ramp onto a bridge","","سەرەڕێیەک بۆ سەر پرد")],0,
      "The black wedge rising to the right means a steep climb. Select a lower gear before the hill rather than half-way up, keep momentum, and remember that a heavily loaded vehicle in front may slow right down.","","ئەم هێمای ئاگادارکردنەوەیە چی دەگەیەنێت؟","قەپەڵە ڕەشەکە کە بەرەو ڕاست بەرز دەبێتەوە واتای سەرکەوتنێکی توندە. پێش گردەکە گێرێکی نزمتر هەڵبژێرە نەک لە ناوەڕاستیدا، جووڵە بپارێزە، و لەبیرت بێت ئۆتۆمبیلی بارکراوی پێشەوە لەوانەیە زۆر هێواش بێت."),
    Q("signs","no_pedestrians","What does this sign mean?","",
      [O("Pedestrians are not allowed on this road","","پیادە ڕێگەپێنەدراون لەم ڕێگایەدا"),O("Watch out for pedestrians crossing","","ئاگاداری پەڕینەوەی پیادە بە"),O("A pedestrian-only zone begins","","ناوچەی تەنها بۆ پیادە دەستپێدەکات")],0,
      "A red circle is a prohibition, so this bans pedestrians from the road — it is not a warning to watch for them. You will see it on roads where walking would be dangerous, such as expressways.","","ئەم هێمایە چی دەگەیەنێت؟","بازنەی سوور قەدەغەکردنە، بۆیە ئەمە پیادە لە ڕێگاکە قەدەغە دەکات — ئاگادارکردنەوە نییە بۆ وریابوون لێیان. لەو ڕێگایانەدا دەیبینیت کە پیادەڕۆیشتن مەترسیدارە، وەک ڕێگا خێراکان."),
    Q("signs","height_limit","What does this sign mean?","",
      [O("Vehicles higher than the figure shown may not pass","","ئۆتۆمبیلی بەرزتر لە ژمارەی نیشانکراو ناتوانێت تێبپەڕێت"),O("The road ahead is that far away","","ڕێگای پێشەوە بەو دووریە دوورە"),O("The bridge ahead is that wide","","پردی پێشەوە بەو پانییەیە")],0,
      "The figure is the maximum height allowed, usually because of a bridge or tunnel ahead. Know your vehicle's height, including any roof load — striking a bridge is a serious offence and a serious danger.","","ئەم هێمایە چی دەگەیەنێت؟","ژمارەکە بەرزترین بەرزی ڕێگەپێدراوە، زۆرجار بەهۆی پرد یان تونێلێک لە پێشەوە. بەرزی ئۆتۆمبیلەکەت بزانە، لەگەڵ هەر بارێکی سەر سەقف — لێدان لە پرد تاوانێکی گەورە و مەترسییەکی گەورەیە."),
    Q("signs","weight_limit","What does this sign mean?","",
      [O("Vehicles over the weight shown may not pass","","ئۆتۆمبیلی قورستر لە کێشی نیشانکراو ناتوانێت تێبپەڕێت"),O("The load must weigh at least that much","","بارەکە دەبێت بەلایەنی کەم ئەوەندە بێت"),O("A weighbridge is ahead","","تەرازووی ئۆتۆمبیل لە پێشەوەیە")],0,
      "The figure in tonnes is the maximum total weight allowed, usually to protect a weak bridge or road surface. It applies to the vehicle plus its load, not just the load.","","ئەم هێمایە چی دەگەیەنێت؟","ژمارەکە بە تەن بەرزترین کێشی گشتیی ڕێگەپێدراوە، زۆرجار بۆ پاراستنی پردێکی لاواز یان ڕووی ڕێگا. بۆ ئۆتۆمبیلەکە لەگەڵ بارەکەی جێبەجێ دەبێت، نەک تەنها بۆ بارەکە."),
    Q("signs","min_speed","This blue circle shows a speed. What does it mean?","",
      [O("It is a MINIMUM speed — you must not drive slower than this","","کەمترین خێراییە — نابێت لەمە هێواشتر لێبخوڕیت"),O("It is a maximum speed limit","","بەرزترین سنووری خێراییە"),O("It is a recommended speed only","","تەنها خێراییەکی پێشنیارکراوە")],0,
      "Colour tells you which it is: a number in a RED ring is the maximum you may drive, while a number on a BLUE circle is the minimum. A minimum-speed sign keeps very slow vehicles off roads where they would be a hazard.","","ئەم بازنە شینە خێراییەک پیشان دەدات. چی دەگەیەنێت؟","ڕەنگەکە پێت دەڵێت کامەیە: ژمارەیەک لە بازنەیەکی سووردا بەرزترین خێراییە کە دەتوانیت پێی بڕۆیت، بەڵام ژمارەیەک لەسەر بازنەیەکی شین کەمترین خێراییە. هێمای کەمترین خێرایی ڕێگر دەبێت لە ئۆتۆمبیلی زۆر هێواش لەو ڕێگایانەی دەبنە مەترسی."),
    Q("signs","roadworks","What does this warning sign mean?","",
      [O("Roadworks ahead — expect workers, machinery and a changed lane layout","","کارکردن لەسەر ڕێگا لە پێشەوە — چاوەڕێی کرێکار، ئامێر و گۆڕانی ڕێککەوتنی لاین بکە"),O("A rubbish tip is ahead","","شوێنی خۆڵدان لە پێشەوەیە"),O("A footpath crosses the road","","ڕێچکەیەکی پیادە ڕێگاکە دەبڕێت")],0,
      "Roadworks change the road without warning: lanes narrow or swap sides, the surface may be loose, and people are working close to moving traffic. Slow to the posted limit, follow the temporary markings, and never overtake inside the works.","","ئەم هێمای ئاگادارکردنەوەیە چی دەگەیەنێت؟","کارکردن لەسەر ڕێگا بەبێ ئاگادارکردنەوە ڕێگا دەگۆڕێت: لاینەکان تەسک دەبن یان لا دەگۆڕن، ڕووەکە لەوانەیە بڵاو بێت، و خەڵک لە نزیک هاتووچۆی جوڵاوەوە کاردەکەن. خێرایی کەم بکەرەوە بۆ سنووری دانراو، دوای نیشانە کاتییەکان بکەوە، و هەرگیز لەناو ناوچەی کارەکەدا تێمەپەڕێنە."),
    Q("signs","end_priority","What does this sign mean?","",
      [O("Your priority road ends — from here you no longer have automatic right of way","","ڕێگا پێشینەدارەکەت کۆتایی دێت — لێرەوە چیتر بەخۆکارانە مافی پێشینەت نییە"),O("A priority road begins here","","ڕێگای پێشینەدار لێرەوە دەستپێدەکات"),O("Parking is no longer allowed","","چیتر پارککردن ڕێگەپێدراو نییە")],0,
      "The yellow diamond with a black bar cancels the priority road. Beyond this sign the normal rules apply again — usually give way to traffic from your right unless another sign says otherwise. Slow down and check junctions carefully.","","ئەم هێمایە چی دەگەیەنێت؟","لۆزەنگی زەرد لەگەڵ هێڵی ڕەش ڕێگای پێشینەدار هەڵدەوەشێنێتەوە. لە دوای ئەم هێمایەوە یاسا ئاساییەکان دووبارە جێبەجێ دەبن — زۆرجار ڕێگا دەدەیت بە هاتووچۆی لای ڕاستت مەگەر هێمایەکی تر شتێکی تر بڵێت. خێرایی کەم بکەرەوە و چوارڕیانەکان بە وردی بپشکنە."),
    Q("signs","width_limit","What does this sign mean?","",
      [O("Vehicles wider than the figure shown may not pass","","ئۆتۆمبیلی پانتر لە ژمارەی نیشانکراو ناتوانێت تێبپەڕێت"),O("The road ahead is that wide in total","","ڕێگای پێشەوە بە گشتی ئەو پانییەیە"),O("Keep at least that far from the vehicle in front","","بەلایەنی کەم ئەو دوورییە لە ئۆتۆمبیلی پێشەوە بپارێزە")],0,
      "The figure is the maximum width allowed, usually because of a narrow bridge, gate or tunnel. Remember your load and mirrors count towards your width, not just the bodywork.","","ئەم هێمایە چی دەگەیەنێت؟","ژمارەکە پانترین پانی ڕێگەپێدراوە، زۆرجار بەهۆی پردێکی تەسک، دەروازە یان تونێل. لەبیرت بێت بار و ئاوێنەکانیشت بەشێکن لە پانییەکەت، نەک تەنها لاشەی ئۆتۆمبیلەکە."),
    Q("signs","no_overtake_truck","What does this sign mean?","",
      [O("Lorries and other large goods vehicles may not overtake here","","لۆری و ئۆتۆمبیلی گەورەی بارهەڵگر لێرەدا ناتوانن تێبپەڕێنن"),O("No vehicle at all may overtake here","","هیچ ئۆتۆمبیلێک لێرەدا ناتوانێت تێبپەڕێنێت"),O("Lorries are banned from this road","","لۆری لەم ڕێگایە قەدەغەیە")],0,
      "This restricts overtaking to cars only — the lorry in the picture is the one that may not overtake. It is used where a slow, long vehicle pulling out would block the road for a long time, such as on hills and narrow stretches.","","ئەم هێمایە چی دەگەیەنێت؟","ئەمە تێپەڕاندن تەنها بۆ ئۆتۆمبیلی بچووک سنووردار دەکات — ئەو لۆرییەی لە وێنەکەدایە ئەوەیە کە ناتوانێت تێبپەڕێنێت. لەو شوێنانەدا بەکاردێت کە ئۆتۆمبیلێکی هێواش و درێژ ئەگەر لابدات بۆ ماوەیەکی درێژ ڕێگا دەبەستێت، وەک لە گردەکان و بەشە تەسکەکاندا."),
    // ---- Kurdish driving-school wall chart (traffic-light sequence) ----
    Q("rules",null,"The traffic light shows RED and AMBER together. What does that mean?","",
      [O("Get ready to move, but do not go until the green shows","","ئامادەبە بۆ جووڵان، بەڵام مەڕۆ هەتا سەوز دەردەکەوێت"),O("You may go now — it is the same as green","","ئێستا دەتوانیت بڕۆیت — وەک سەوز وایە"),O("The lights are faulty, so treat it as a give-way","","چراکان تێکچوون، بۆیە وەک ڕێگادانی لەگەڵدا جوڵێ")],0,
      "Red and amber together is the 'get ready' phase before green. Release the handbrake and select first gear if you like, but you must not cross the line until the green light shows.","","چرای هاتووچۆ سوور و زەرد پێکەوە پیشان دەدات. واتای چییە؟","سوور و زەرد پێکەوە قۆناغی 'ئامادەبە'یە پێش سەوز. ئەگەر بتەوێت هێزی دەست بەربدە و گێری یەکەم هەڵبژێرە، بەڵام نابێت لە هێڵەکە تێپەڕیت هەتا چرای سەوز دەردەکەوێت."),
    Q("signs","narrows_right","What does this warning sign mean?","",
      [O("The road narrows from the right — the right-hand side runs out, so be ready to merge","","ڕێگا لە لای ڕاستەوە تەسک دەبێتەوە — لای ڕاست کۆتایی دێت، بۆیە ئامادەبە بۆ یەکگرتن"),O("The road narrows from the left","","ڕێگا لە لای چەپەوە تەسک دەبێتەوە"),O("The road narrows from both sides at once","","ڕێگا لە هەردوو لاوە پێکەوە تەسک دەبێتەوە")],0,
      "Look at which side of the symbol bends inwards — here it is the right. The lane or shoulder on your right is ending, so check your mirrors and blind spot early and merge smoothly rather than at the last moment.","","ئەم هێمای ئاگادارکردنەوەیە چی دەگەیەنێت؟","سەیر بکە کام لای هێماکە بەرەو ناوەوە دەچەمێتەوە — لێرەدا لای ڕاستە. لاین یان شانەکەی لای ڕاستت کۆتایی دێت، بۆیە زوو ئاوێنە و خاڵی کوێرەکەت بپشکنە و بە نەرمی یەکبگرە نەک لە دوا ساتدا."),
    Q("signs","ahead_or_left","What does this blue sign mean?","",
      [O("You may only go straight ahead or turn left","","تەنها دەتوانیت ڕاست بەرەوپێش بڕۆیت یان بۆ لای چەپ بسووڕێیتەوە"),O("You must turn left — going straight is not allowed","","دەبێت بۆ لای چەپ بسووڕێیتەوە — ڕۆیشتنی ڕاست ڕێگەپێدراو نییە"),O("Traffic may come from the left","","لەوانەیە هاتووچۆ لە لای چەپەوە بێت")],0,
      "The arrows show every movement that is allowed: straight on or left. Turning right or making a U-turn is not permitted. Get into the correct lane in good time for the direction you want.","","ئەم هێمای شینە چی دەگەیەنێت؟","تیرەکان هەموو ئەو جووڵانە پیشان دەدەن کە ڕێگەپێدراون: ڕاست بەرەوپێش یان بۆ چەپ. سووڕانەوە بۆ ڕاست یان گەڕانەوە ڕێگەپێدراو نییە. بەکاتی خۆی بڕۆ ناو لاینی دروست بۆ ئەو ئاراستەیەی دەتەوێت."),
    Q("signs","bus_stop","What does this yellow sign mean?","",
      [O("A bus stop — expect buses pulling in and out, and people crossing near it","","وێستگەی پاس — چاوەڕێی هاتن و چوونی پاس بکە، و کەسانێک لە نزیکەوە ڕێگا دەبڕن"),O("Buses are prohibited from this road","","پاس لەم ڕێگایە قەدەغەیە"),O("Only buses may use this lane","","تەنها پاس دەتوانێت ئەم لاینە بەکاربهێنێت")],0,
      "The yellow plate marks a bus stop. Do not park on or near it, give way to a bus signalling to pull out, and watch for passengers stepping into the road — especially from in front of a stopped bus, where you cannot see them.","","ئەم هێما زەردە چی دەگەیەنێت؟","تابلۆ زەردەکە وێستگەی پاس دیاری دەکات. لەسەری یان نزیکی پارک مەکە، ڕێگا بدە بەو پاسەی هێما دەدات بۆ چوونە دەرەوە، و ئاگات لەو سەرنشینانە بێت کە دێنە سەر ڕێگا — بەتایبەت لەبەردەم پاسێکی ڕاوەستاوەوە، کە نایانبینیت."),
    Q("signs","side_road_left","What does this warning sign mean?","",
      [O("A side road joins from the left — you are on the priority road, but be ready for vehicles pulling out","","ڕێگایەکی لاوەکی لە چەپەوە تێدەکەوێت — تۆ لەسەر ڕێگا پێشینەدارەکەیت، بەڵام ئامادەبە بۆ ئۆتۆمبیلی دەرچوو"),O("You must turn left ahead","","لە پێشەوە دەبێت بۆ لای چەپ بسووڕێیتەوە"),O("The road ahead ends in a T-junction","","ڕێگای پێشەوە بە سێڕیانێک کۆتایی دێت")],0,
      "The thick bar is your road and the thin bar is the joining side road — here only on the left. You have priority, but a driver waiting there may misjudge your speed, so cover the brake and be ready to slow.","","ئەم هێمای ئاگادارکردنەوەیە چی دەگەیەنێت؟","هێڵە ئەستوورەکە ڕێگای تۆیە و هێڵە باریکەکە ڕێگا لاوەکییە تێکەوتووەکەیە — لێرەدا تەنها لە چەپەوە. پێشینەت هەیە، بەڵام لەوانەیە ئەو لێخوڕەی لەوێ چاوەڕێیە خێراییەکەت بە هەڵە هەڵبسەنگێنێت، بۆیە دەست لەسەر برێک بێت و ئامادەبە بۆ کەمکردنەوەی خێرایی."),
    Q("signs","no_vehicles","What does this plain red ring mean?","",
      [O("No vehicles at all may pass, in either direction","","هیچ ئۆتۆمبیلێک ناتوانێت تێبپەڕێت، بە هیچ ئاراستەیەک"),O("No entry from this side only","","تەنها لەم لایەوە چوونەژوورەوە قەدەغەیە"),O("The end of all restrictions","","کۆتایی هەموو قەدەغەکان")],0,
      "An empty red ring closes the road to all vehicles in both directions. Do not confuse it with the no-entry sign (a red disc with a white bar), which only stops you entering from your side — the road is still open the other way.","","ئەم بازنە سووری سادەیە چی دەگەیەنێت؟","بازنەی سووری بەتاڵ ڕێگاکە دادەخات لەبەردەم هەموو ئۆتۆمبێلێک بە هەردوو ئاراستە. تێکەڵی بە هێمای چوونەژوورەوە قەدەغە مەکە (قورسێکی سوور لەگەڵ هێڵێکی سپی)، کە تەنها ڕێگرت لێدەکات لە لای خۆتەوە بچیتە ژوورەوە — ڕێگاکە بە لای تردا هێشتا کراوەیە."),
    Q("signs","level_crossing_multi","What does this sign mean?","",
      [O("A level crossing with more than one track — a second train may follow the first","","پەڕینگەیەک بە زیاتر لە یەک هێڵ — لەوانەیە شەمەندەفەرێکی دووەم بەدوای یەکەمدا بێت"),O("A level crossing with a single track","","پەڕینگەیەک بە یەک هێڵ"),O("Two roads cross ahead","","دوو ڕێگا لە پێشەوە یەکتر دەبڕن")],0,
      "The extra chevron below the cross means several tracks. The danger is that one train can hide another: after the first passes, wait until you are certain nothing is coming on the other line before you cross.","","ئەم هێمایە چی دەگەیەنێت؟","چێڤرۆنی زیادە لەژێر خاچەکەوە واتای چەند هێڵێکە. مەترسییەکە ئەوەیە شەمەندەفەرێک دەتوانێت یەکێکی تر بشارێتەوە: دوای تێپەڕینی یەکەمیان، چاوەڕێ بکە هەتا دڵنیا دەبیت هیچ شتێک لەسەر هێڵەکەی تر نایەت پێش ئەوەی بپەڕیتەوە."),
    Q("signs","ped_route","What does this blue sign mean?","",
      [O("A route reserved for pedestrians — motor traffic must not use it","","ڕێڕەوێکی تەرخانکراو بۆ پیادە — هاتووچۆی ئۆتۆمبیل نابێت بەکاریبهێنێت"),O("Pedestrians are forbidden here","","پیادە لێرە قەدەغەیە"),O("Watch out for pedestrians crossing","","ئاگاداری پەڕینەوەی پیادە بە")],0,

  function achvCtx(){
    var st=loadStore(), cat=st.cat||{}, srs=st.srs||{}, sc=srsCounts(), stk=streaks(st.daily), rd=readiness();
    var answered=0;Object.keys(cat).forEach(function(k){answered+=(cat[k]&&cat[k].n)||0;});
    var signM=0,signT=0,everWrong=0;
    QUESTIONS.forEach(function(q){
      if(q.id==null)return;
      var r=srs[q.id];
      if(q.cat==="signs"){signT++;if(r&&r.b>=5)signM++;}
      if(r&&r.w>0)everWrong++;
    });
    return {answered:answered, mastered:sc.mastered, signM:signM, signT:signT, everWrong:everWrong,
      exams:(st.exams||[]).length, best:st.best||0, streakBest:Math.max(stk.best,stk.cur),
      mistakes:Object.keys(st.mistakes||{}).length, ready:rd.level==="ready"?1:0, total:QUESTIONS.length};
  }
  function achvState(){
    var c=achvCtx(), earned=(loadStore().achv)||[];
    return ACHV.map(function(a){
      var target=a.g||(a.id==="signs"?c.signT:c.total);
      var cur=Math.min(a.v(c),target);
      return {a:a, cur:cur, target:target, done:cur>=target||earned.indexOf(a.id)>=0};
    });
  }
  function syncAchv(){
    var st=loadStore(), had=st.achv||[], now=[], fresh=[];
    achvState().forEach(function(s){if(s.done){now.push(s.a.id);if(had.indexOf(s.a.id)<0)fresh.push(s.a);}});
    st.achv=now;saveStore(st);
    return fresh;
  }

  function _firstSent(s){

    var cut=-1,cands=[s.indexOf(". "),s.indexOf(" — "),s.indexOf("— ")];

    if(cut>0)return (s.charAt(cut)==="."?s.slice(0,cut+1):s.slice(0,cut)).trim();
    return s;

    {id:"proh",en:"Prohibition signs",ku:"هێماکانی قەدەغە",ar:"إشارات المنع",keys:["no_entry","no_overtake","no_overtake_truck","no_parking","no_stopping","no_uturn","no_left","no_right","no_vehicles","no_pedestrians","tractor","speed50","height_limit","weight_limit","width_limit","length_limit","stop_control"]},
    {id:"end",en:"End of restriction",ku:"کۆتایی سنووردانان",ar:"نهاية المنع",keys:["end_no_overtake","end_no_overtake_truck","end_speed","end_all_restrictions"]},
    {id:"mand",en:"Mandatory & direction",ku:"فەرز و ئاراستە",ar:"إشارات الإلزام والاتجاه",keys:["ahead_only","turn_right","turn_left","ahead_or_left","ahead_or_right","roundabout","keep_left","keep_right","pass_either_side","min_speed"]},
    {id:"info",en:"Information & motorway",ku:"زانیاری و ڕێگای خێرا",ar:"إشارات الإرشاد والطريق السريع",keys:["ped","oneway","parking","motor_road","motorway","end_motorway","speed_camera","ped_route","taxi","dead_end","bus_stop","lane_route"]},
    {id:"mark",en:"Road markings",ku:"نیشانەکانی سەر ڕێگا",ar:"علامات الطريق",keys:["broken_line","solid_line","double_line"]}
  ];

  /* Any sign not listed above still shows up, under "Other signs". */
  function sgFamilies(){
    var seen={}, fams=SGFAM.map(function(f){
      var keys=f.keys.filter(function(k){if(SIGNS[k]){seen[k]=1;return true;}return false;});
      return {id:f.id,label:L(f),keys:keys};
    }).filter(function(f){return f.keys.length;});
    var rest=Object.keys(SIGNS).filter(function(k){return !seen[k];});
    if(rest.length)fams.push({id:"other",label:t("sgOther"),keys:rest});
    return fams;
  }

  /* One-line meaning per sign, taken from the question that teaches it. */
  var _sgMeanCache=null;
  function sgMeanings(){
    if(_sgMeanCache)return _sgMeanCache;
    var m={};
    QUESTIONS.forEach(function(q){
      if(q.cat!=="signs"||!q.sign||m[q.sign])return;
      var ex=_firstSent(L(q.ex));
      if(ex)m[q.sign]=ex;
    });
    return (_sgMeanCache=m);
  }

  var _sgQ="", _sgFam="all";
  window.sgSetFam=function(id){_sgFam=id;renderSigns();};
  window.sgSearch=function(v){
    _sgQ=String(v||"").toLowerCase().trim();
    var box=document.getElementById("sgrid");
    if(box){box.innerHTML=sgGridHtml();localizeDigits();}
  };

  function sgMatch(k){
    if(!_sgQ)return true;
    var mean=sgMeanings()[k]||"";
    var hay=[k,SIGNS[k].en,SIGNS[k].ar||"",KU_SIGNS[k]||"",mean].join(" ").toLowerCase();
    return hay.indexOf(_sgQ)>=0;
  }

  function sgCardHtml(k){
    var mean=sgMeanings()[k];
    return '<div class="sc">'+SIGNS[k].svg+'<div class="nm">'+esc(signLabel(k))+'</div>'+
      (mean?'<div class="mn">'+esc(mean)+'</div>':'')+'</div>';
  }

  function sgGridHtml(){
    var fams=sgFamilies(), out="", total=0;
    fams.forEach(function(f){
      if(_sgFam!=="all"&&_sgFam!==f.id)return;
      var keys=f.keys.filter(sgMatch);
      if(!keys.length)return;
      total+=keys.length;
      out+='<div class="sghead">'+esc(f.label)+'<span class="n">'+keys.length+'</span></div><div class="grid">';
      keys.forEach(function(k){out+=sgCardHtml(k);});
      out+='</div>';
    });
    return total?out:'<div class="sgnone">'+esc(t("sgNone"))+'</div>';
  }

  function renderSigns(){
    var fams=sgFamilies(), all=0;
    fams.forEach(function(f){all+=f.keys.length;});
    if(_sgFam!=="all"&&!fams.some(function(f){return f.id===_sgFam;}))_sgFam="all";

    var chips='<div class="sgchips"><button class="sgchip'+(_sgFam==="all"?" on":"")+'" onclick="sgSetFam(\'all\')">'+
      esc(t("sgAll"))+'<span class="n">'+all+'</span></button>';
    fams.forEach(function(f){
      chips+='<button class="sgchip'+(_sgFam===f.id?" on":"")+'" onclick="sgSetFam(\''+f.id+'\')">'+
        esc(f.label)+'<span class="n">'+f.keys.length+'</span></button>';
    });
    chips+='</div>';

    view.innerHTML='<div><h1>'+esc(t("signsB"))+'</h1><p class="sub">'+esc(t("signsBD"))+'</p></div>'+
      '<div class="sqbtns"><button class="btn" onclick="startFlash()">'+esc(t("flashB"))+'</button>'+
      '<button class="btn" onclick="startSignQuiz()">'+esc(t("signQuizB"))+'</button></div>'+
      '<div class="sgtools"><input id="sgq" type="search" autocomplete="off" placeholder="'+esc(t("sgSearch"))+
        '" value="'+esc(_sgQ)+'" oninput="sgSearch(this.value)" aria-label="'+esc(t("sgSearch"))+'">'+chips+'</div>'+
      '<div id="sgrid">'+sgGridHtml()+'</div>'+
      '<button class="btn ghost" onclick="Go(\'home\')">'+esc(t("back"))+'</button>';
  }


  /* ---------- language ---------- */
  window.setLang=function(l){
    S.lang=l;
    document.getElementById("enB").setAttribute("aria-pressed",l==="en");
    document.getElementById("kuB").setAttribute("aria-pressed",l==="ku");
    document.getElementById("app").setAttribute("dir",l==="ku"?"rtl":"ltr");
    document.getElementById("brandSub").textContent=UI[l].brand;
    render();
  };

  setLang("ku");
  try{if(localStorage.getItem("tareeq_big")){document.getElementById("app").classList.add("big");document.getElementById("szB").setAttribute("aria-pressed","true");}}catch(e){}
})();
</script>
