      "The raised white cane — white with a red band — is a formal signal that the person is about to cross, and every driver must stop for it. Never use the horn near a blind pedestrian: they navigate by sound, and a horn takes that away exactly when they need it.","","پیادەیەکی نابینا گۆچانی سپی بەرز دەکاتەوە بۆ پەڕینەوەی ڕێگا. شۆفێرەکان دەبێت چی بکەن؟","گۆچانی سپیی بەرزکراوە — سپی بە خەتێکی سوورەوە — ئاماژەیەکی فەرمییە کە کەسەکە خەریکە دەپەڕێتەوە، و هەموو شۆفێرێک دەبێت بۆی بوەستێت. هەرگیز بۆڕی لێمەدە لەلای پیادەی نابینا: بە دەنگ ڕێگای خۆیان دەدۆزنەوە، و بۆڕی ئەوەیان لێدەسەنێتەوە هەر لەو کاتەدا کە پێویستیانە."),
    Q("rules",null,"You are pushing a bicycle along the road on foot. What are you counted as?","",
      [O("A pedestrian","","پیادە"),O("A cyclist","","پاسکیلسوار"),O("A driver of a vehicle","","شۆفێری سوارڕۆیەک")],0,
      "Walking beside a bicycle, scooter or motorcycle and pushing it makes you a pedestrian, so you use the pavement and crossings. The same applies to someone using a wheelchair on a pavement or crossing.","","بە پێ پاسکیلێک لەتەنیشت خۆتەوە پاڵ دەنێیت. بە چی دادەنرێیت؟","ڕۆیشتن لەتەنیشت پاسکیل، سکوتەر یان ماتۆڕسکیل و پاڵنانی پیادەت لێدەکات، بۆیە شۆستە و خەتی پەڕینەوە بەکاردەهێنیت. هەمان شت بۆ ئەو کەسەش کە کورسی عەرەبانە لەسەر شۆستە یان خەتی پەڕینەوە بەکاردەهێنێت."),
    Q("rules",null,"There is no marked crossing. What is the correct way for a pedestrian to cross?","",
      [O("Stop at the kerb, look left, look right, look left again, then cross quickly","","لە لێواری شۆستە بوەستە، سەیری چەپ بکە، سەیری ڕاست بکە، دووبارە سەیری چەپ بکە، پاشان بەخێرایی بپەڕەوە"),O("Cross immediately in front of a stopped car so it shields you","","یەکسەر لەبەردەم ئۆتۆمبیلێکی وەستاو بپەڕەوە تا بتپارێزێت"),O("Run across without stopping","","بێ وەستان بە ڕاکردن بپەڕەوە")],0,
      "Left, right, left again — the last look catches anything that arrived while you were checking the other way. Where there is a central island, cross to it first, then look right and left again. Never step out from in front of a stopped vehicle: the drivers behind it cannot see you.","","هیچ خەتی پەڕینەوەیەک نییە. ڕێگای دروستی پەڕینەوەی پیادە چییە؟","چەپ، ڕاست، دووبارە چەپ — سەیرکردنی کۆتایی ئەوە دەگرێت کە لە کاتی سەیرکردنی لای ترەوە هاتووە. لەو شوێنانەی دوورگەی ناوەڕاست هەیە، سەرەتا بۆ ئەوێ بپەڕەوە، پاشان دووبارە سەیری ڕاست و چەپ بکە. هەرگیز لەبەردەم ئۆتۆمبیلێکی وەستاوەوە دەرمەچۆ: ئەو شۆفێرانەی لە پشتییەوەن ناتتبینن."),
    Q("rules",null,"Where must a child under 13 travel in a car?","",
      [O("In the rear seat, in a child seat matched to their weight and age","","لە کورسی دواوە، لە کورسییەکی منداڵدا کە لەگەڵ کێش و تەمەنیدا بگونجێت"),O("In the front seat, so the driver can watch them","","لە کورسی پێشەوە، تا شۆفێر چاودێریان بکات"),O("Anywhere, as long as they wear the adult seat belt","","لە هەر شوێنێک، بەمەرجێک پشتێنی گەورەکان ببەستێت")],0,
      "Below 13 the child sits in the back, in a seat chosen by weight: rear-facing up to about 13 kg, then forward-facing, then a booster up to 36 kg. An adult belt alone does not fit a small body and can injure them in a crash.","","منداڵی خوار ١٣ ساڵ دەبێت لە کوێی ئۆتۆمبیلدا دابنیشێت؟","لە خوار ١٣ ساڵ منداڵ لە دواوە دادەنیشێت، لە کورسییەکدا کە بەپێی کێش هەڵبژێردراوە: ڕوو لە دواوە تا نزیکەی ١٣ کگم، پاشان ڕوو لە پێشەوە، پاشان پاڵپشتێک (Booster) تا ٣٦ کگم. پشتێنی گەورەکان بە تەنها لەگەڵ لەشی بچووکدا ناگونجێت و لە ڕووداودا دەتوانێت بریندارییان بکات."),
    Q("rules",null,"When must a rear-facing child seat NEVER be used in the front passenger seat?","",
      [O("When the passenger airbag is active","","کاتێک بالۆنی هەوایی سەرنشین چالاک بێت"),O("When the journey is longer than an hour","","کاتێک گەشتەکە لە کاتژمێرێک زیاتر بێت"),O("When it is raining","","کاتێک باران دەبارێت")],0,
      "An airbag inflates with enough force to be lethal against the back of a rear-facing seat, which sits right in front of it. If the seat must go there at all, the airbag has to be switched off first — otherwise the safety device becomes the danger.","","کەی نابێت کورسی منداڵی ڕوو لە دواوە لە کورسی پێشەوەدا بەکاربهێنرێت؟","بالۆنی هەوایی بەو هێزە دەکرێتەوە کە دەتوانێت بکوژ بێت بەرامبەر پشتی کورسییەکی ڕوو لە دواوە، کە ڕاست لەبەردەمیدایە. ئەگەر پێویست بێت کورسییەکە لەوێ دابنرێت، سەرەتا دەبێت بالۆنەکە بکوژێنرێتەوە — ئەگەرنا ئامێری سەلامەتی خۆی دەبێتە مەترسییەکە."),
    Q("rules",null,"You have just got off a bus and need to cross the road. What should you do?","",
      [O("Wait until the bus has moved away, so you can see the road clearly","","چاوەڕێ بکە تا پاسەکە دوور دەکەوێتەوە، تا بتوانیت ڕێگاکە بە ڕوونی ببینیت"),O("Cross immediately in front of the bus","","یەکسەر لەبەردەم پاسەکەدا بپەڕەوە"),O("Cross behind the bus while it is still stopped","","لە پشت پاسەکەوە بپەڕەوە کاتێک هێشتا وەستاوە")],0,
      "A stopped bus hides you from every driver approaching it, and hides them from you. Waiting the few seconds until it pulls away turns a blind crossing into a clear one.","","تازە لە پاسێک دابەزیویت و دەتەوێت ڕێگاکە بپەڕیتەوە. دەبێت چی بکەیت؟","پاسێکی وەستاو تۆ لە هەموو شۆفێرێک دەشارێتەوە کە لێی نزیک دەبێتەوە، و ئەوانیش لە تۆ دەشارێتەوە. چاوەڕێکردنی چەند چرکەیەک تا دوور دەکەوێتەوە پەڕینەوەیەکی کوێرانە دەکاتە پەڕینەوەیەکی ڕوون."),
    Q("rules",null,"Which licence category covers buses?","",
      [O("D1, D1E, D and DE","","D1، D1E، D و DE"),O("C1, C1E, C and CE","","C1، C1E، C و CE"),O("B and BE","","B و BE")],0,
      "The categories run A for motorcycles, B/BE for private cars, C for lorries, D for buses and T for agricultural and construction machinery. The letter E on any of them means it also covers a heavier trailer.","","کام پۆلی مۆڵەت پاسەکان دەگرێتەوە؟","پۆلەکان بەم شێوەیەن: A بۆ ماتۆڕسکیل، B/BE بۆ ئۆتۆمبیلی تایبەت، C بۆ بارهەڵگر، D بۆ پاس و T بۆ ئامێری کشتوکاڵی و بیناسازی. پیتی E لەگەڵ هەریەکێکیان واتای ئەوەیە کە کەرەفانەیەکی قورسترینیش دەگرێتەوە."),
    Q("rules",null,"A D1 licence lets you drive a bus with how many passengers, and up to what length?","",
      [O("Up to 16 passengers excluding the driver, and up to 8 metres long","","تا ١٦ سەرنشین بێجگە لە شۆفێر، و تا ٨ مەتر درێژی"),O("Up to 30 passengers, any length","","تا ٣٠ سەرنشین، بە هەر درێژییەک"),O("Up to 8 passengers, up to 16 metres long","","تا ٨ سەرنشین، تا ١٦ مەتر درێژی")],0,
      "D1 is the small-bus category: a maximum of 16 passengers besides the driver, no more than 8 m long, and a trailer no heavier than 750 kg. Beyond any of those you need the full D, and for a heavier trailer, D1E or DE.","","مۆڵەتی D1 ڕێگەت پێدەدات پاسێک لێبخوڕیت بە چەند سەرنشین، و تا چ درێژییەک؟","D1 پۆلی پاسی بچووکە: زۆرترین ١٦ سەرنشین بێجگە لە شۆفێر، درێژی زیاتر لە ٨ مەتر نەبێت، و کەرەفانەیەک کە لە ٧٥٠ کگم قورستر نەبێت. لە هەریەکێکیان تێپەڕیت پێویستت بە D ی تەواوە، و بۆ کەرەفانەی قورستر، D1E یان DE."),
    Q("rules",null,"A category T licence covers which speeds of machine?","",
      [O("Agricultural machines up to 40 km/h and construction machines up to 60 km/h","","ئامێری کشتوکاڵی تا ٤٠ کم/کاتژمێر و ئامێری بیناسازی تا ٦٠ کم/کاتژمێر"),O("Any machine at any speed","","هەر ئامێرێک بە هەر خێراییەک"),O("Only machines that cannot exceed 20 km/h","","تەنها ئەو ئامێرانەی لە ٢٠ کم/کاتژمێر تێناپەڕن")],0,
      "Category T is defined by the machine's top speed, not its size: 40 km/h for agricultural machines, 60 km/h for construction plant. A T licence also allows pulling a trailer.","","مۆڵەتی پۆلی T کام خێراییەکانی ئامێر دەگرێتەوە؟","پۆلی T بە زۆرترین خێرایی ئامێرەکە پێناسە دەکرێت، نەک بە قەبارەی: ٤٠ کم/کاتژمێر بۆ ئامێری کشتوکاڵی، ٦٠ کم/کاتژمێر بۆ ئامێری بیناسازی. مۆڵەتی T ڕێگە بە ڕاکێشانی کەرەفانەش دەدات."),
    Q("rules",null,"You hold a category B licence and want to drive a taxi. What is required?","",
      [O("No new theory or practical test — complete the taxi lodge procedures and the licence is converted","","هیچ تاقیکردنەوەیەکی نوێی تیۆری یان پراکتیکی نییە — ڕێکارەکانی لۆژەی تاکسی تەواو بکە و مۆڵەتەکە دەگۆڕدرێت"),O("You must pass the full theory and practical test again","","دەبێت دووبارە تاقیکردنەوەی تەواوی تیۆری و پراکتیکی بدەیتەوە"),O("You must first hold the licence for ten years","","دەبێت سەرەتا دە ساڵ مۆڵەتەکەت هەبێت")],0,
      "Converting a B licence to a taxi licence does not require sitting the theory and practical tests again. Once the taxi lodge procedures are completed, the existing licence is changed to a taxi licence.","","مۆڵەتی پۆلی B ت هەیە و دەتەوێت تاکسی لێبخوڕیت. چی پێویستە؟","گۆڕینی مۆڵەتی B بۆ مۆڵەتی تاکسی پێویستی بە دانەوەی تاقیکردنەوەی تیۆری و پراکتیکی نییە. کاتێک ڕێکارەکانی لۆژەی تاکسی تەواو بوون، مۆڵەتە هەبووەکە دەگۆڕدرێت بۆ مۆڵەتی تاکسی."),
    Q("rules",null,"What is the penalty for causing a death by breaking the traffic law?","",
      [O("Five to seven years imprisonment and a fine","","پێنج بۆ حەوت ساڵ زیندانیکردن و غەرامە"),O("A fine only","","تەنها غەرامە"),O("A written warning and licence points","","ئاگادارکردنەوەیەکی نووسراو و خاڵ لەسەر مۆڵەت")],0,
      "Causing a death by breaking the law carries five to seven years. If the driver was under the influence, fled the scene or refused to help, or if more than one person died, the sentence rises steeply — up to twenty years.","","سزای بوونە هۆکاری مردنی کەسێک بە شکاندنی یاسای هاتوچۆ چییە؟","بوونە هۆکاری مردن بە شکاندنی یاسا پێنج بۆ حەوت ساڵی لێدەکەوێتەوە. ئەگەر شۆفێرەکە لە ژێر کاریگەری ماددە بووبێت، لە شوێنی ڕووداوەکە ڕایکردبێت یان یارمەتی ڕەت کردبێتەوە، یان زیاتر لە یەک کەس مردبێت، سزاکە بە توندی بەرز دەبێتەوە — تا بیست ساڵ."),
    Q("rules",null,"A court withdraws a driver\u2019s licence. What happens to someone convicted who does not hold a licence at all?","",
      [O("They are barred from obtaining a licence for three years","","سێ ساڵ لە بەدەستهێنانی مۆڵەت بێبەش دەکرێن"),O("Nothing — the penalty cannot apply to them","","هیچ — سزاکە بۆیان جێبەجێ نابێت"),O("They may apply for a licence immediately","","دەتوانن یەکسەر داوای مۆڵەت بکەن")],0,
      "Withdrawal runs from one to three years, and not holding a licence is no escape: the convicted person is barred from getting one for three years from the sentence. Where two laws both cover an act, the harsher penalty is the one applied.","","دادگا مۆڵەتی شۆفێرێک لێدەسەنێتەوە. ئەو تاوانبارەی هیچ مۆڵەتێکی نییە چی بەسەردێت؟","لێسەندنەوە لە یەک بۆ سێ ساڵە، و نەبوونی مۆڵەت ڕێگەی دەرباز بوون نییە: تاوانبارەکە سێ ساڵ لە بەدەستهێنانی مۆڵەت بێبەش دەکرێت لە بەرواری بڕیارەکەوە. لەو حاڵەتانەی دوو یاسا هەمان کردار دەگرنەوە، توندترین سزا جێبەجێ دەکرێت."),
    Q("signs","officer_stop","A traffic officer faces you with one arm raised straight up. What does it mean?","",
      [O("Stop","","بوەستە"),O("Drive on","","بەردەوامبە لە لێخوڕین"),O("Turn right","","بەرەو ڕاست بسووڕێوە")],0,
      "The raised arm is the order to stop. Under Article 17 of the traffic law an officer\u2019s signal has priority over every other device on the road — you obey the officer even when the traffic light is green or a sign says otherwise.","","ئەفسەرێکی هاتوچۆ ڕووی لە تۆیە و یەک باڵی ڕاست بەرزکردووەتەوە. چی دەگەیەنێت؟","باڵی بەرزکراوە فەرمانی وەستانە. بەپێی بەشی ١٧ی یاسای هاتوچۆ، ئاماژەی ئەفسەر پێشڕەوی هەیە بەسەر هەموو ئامێرێکی تری سەر ڕێگا — گوێڕایەڵی ئەفسەر دەبیت تەنانەت ئەگەر چرای هاتوچۆ سەوزیش بێت یان هێمایەک شتێکی تر بڵێت."),
    Q("signs","officer_both","A traffic officer stands with both arms stretched out sideways. What does this mean for you?","",
      [O("Traffic in front of and behind the officer must stop","","هاتوچۆی بەردەم و پشتی ئەفسەرەکە دەبێت بوەستێت"),O("Everyone may proceed","","هەموان دەتوانن بەردەوام بن"),O("Only lorries must stop","","تەنها بارهەڵگرەکان دەبێت بوەستن")],0,
      "Arms out to both sides holds the traffic approaching the officer\u2019s front and back, while the roads to their left and right are released. Read the officer\u2019s body, not just the arms: you are held when you face their chest or their back.","","ئەفسەرێکی هاتوچۆ هەردوو باڵی بەرەو دوو لاوە ڕاکێشاوە. ئەمە بۆ تۆ چی دەگەیەنێت؟","باڵ بۆ هەردوو لا ئەو هاتوچۆیە دەگرێت کە لە بەردەم و پشتی ئەفسەرەکەوە دێت، لە کاتێکدا ڕێگاکانی لای چەپ و ڕاستی ئازاد دەکرێن. لەشی ئەفسەرەکە بخوێنەوە، نەک تەنها باڵەکان: تۆ ڕاگیراویت کاتێک ڕووبەڕووی سنگ یان پشتییەتی."),
    Q("rules",null,"The pedestrian light turns to amber while you are already on the crossing. What should you do?","",
      [O("Carry on and finish crossing to the other side","","بەردەوام بە و پەڕینەوەکە تەواو بکە بۆ ئەوبەر"),O("Stop where you are and wait","","لە شوێنی خۆت بوەستە و چاوەڕێ بکە"),O("Turn round and go back","","بگەڕێوە و بڕۆوە دواوە")],0,
      "Amber means nobody new may start crossing, but anyone already on the crossing keeps going and clears it. Stopping in the middle of the road is the one thing that puts you in danger.","","چرای پیادە دەبێتە زەرد لە کاتێکدا تۆ لەسەر خەتی پەڕینەوەیت. دەبێت چی بکەیت؟","زەرد واتای ئەوەیە کەسی نوێ دەست بە پەڕینەوە ناکات، بەڵام هەرکەسێک لەسەر خەتەکە بێت بەردەوام دەبێت و بەجێی دەهێڵێت. وەستان لە ناوەڕاستی ڕێگادا تەنها شتێکە کە دەتخاتە مەترسییەوە."),
    Q("rules",null,"How are the lamps of a traffic light always arranged?","",
      [O("Vertically, with red at the top and green at the bottom","","بە شێوەی ستوونی، سوور لە سەرەوە و سەوز لە خوارەوە"),O("Green at the top and red at the bottom","","سەوز لە سەرەوە و سوور لە خوارەوە"),O("In no fixed order","","بە هیچ ڕیزبەندییەکی جێگیر نییە")],0,
      "Red is always the top lamp and green always the bottom one. That fixed order is what lets a driver who cannot distinguish the colours — or is looking at a sun-washed lamp — still read the signal by position.","","چراکانی ترافیک لایت هەمیشە چۆن ڕیز دەکرێن؟","سوور هەمیشە چرای سەرەوەیە و سەوز هەمیشە ئەوەی خوارەوە. ئەم ڕیزبەندییە جێگیرە وا دەکات شۆفێرێک کە ناتوانێت ڕەنگەکان جیا بکاتەوە — یان سەیری چرایەک دەکات کە خۆر لێی داوە — هێشتا بتوانێت بە شوێنەکەی ئاماژەکە بخوێنێتەوە."),
    Q("rules",null,"Why do some pedestrian crossing lights make a sound?","",
      [O("To help blind and partially sighted people cross safely","","بۆ یارمەتیدانی کەسانی نابینا و کەم‌بینا بۆ پەڕینەوەی سەلامەت"),O("To warn drivers that the light has changed","","بۆ ئاگادارکردنەوەی شۆفێران کە چراکە گۆڕا"),O("To count how many people cross","","بۆ ژماردنی ئەو کەسانەی دەپەڕنەوە")],0,
      "The sound tells a blind pedestrian when the green phase has begun, since they cannot read the lamp. Countdown displays serve the same purpose for everyone else — they show how much crossing time is left.","","بۆچی هەندێک لە چراکانی پەڕینەوەی پیادە دەنگ دەردەکەن؟","دەنگەکە بە پیادەی نابینا دەڵێت کەی قۆناغی سەوز دەستی پێکردووە، چونکە ناتوانن چراکە ببینن. پیشاندەری ژماردنەوەش هەمان ئەرک بۆ ئەوانی تر دەبینێت — ئەوە پیشان دەدەن چەند کاتی پەڕینەوە ماوە."),
    Q("signs","speed_kurdistan","This blue panel shows the general speed limits in Kurdistan. What are they?","",
      [O("60 in built-up areas, 80 outside them, 110 on motorways","","٦٠ لە ناوچەی نیشتەجێبوون، ٨٠ لە دەرەوەی، ١١٠ لەسەر ڕێگای خێرا"),O("60 everywhere unless a sign says otherwise","","٦٠ لە هەموو شوێنێک مەگەر هێمایەک شتێکی تر بڵێت"),O("110 on every road outside a city","","١١٠ لەسەر هەموو ڕێگایەک لە دەرەوەی شار")],0,
      "Read the pictogram beside each figure: the town symbol means inside a built-up area (60), the town symbol crossed out means outside it (80), and the motorway symbol means a motorway (110). These are the defaults — a posted sign always overrides them.","","ئەم پانێڵە شینە سنووری خێراییی گشتیی کوردستان پیشان دەدات. چین؟","سەیری وێنۆچکەی تەنیشت هەر ژمارەیەک بکە: هێمای شار واتە لە ناو ناوچەی نیشتەجێبوون (٦٠)، هێمای شاری خەتلێدراو واتە لە دەرەوەی (٨٠)، و هێمای ڕێگای خێرا واتە ڕێگای خێرا (١١٠). ئەمانە بنەڕەتین — هێمایەکی دانراو هەمیشە لەسەریان دەڕوات."),
    Q("rules",null,"On direction signs, what does a GREEN background mean?","",
      [O("A main-road destination outside the built-up area","","ئامانجێکی ڕێگای سەرەکی لە دەرەوەی ناوچەی نیشتەجێبوون"),O("A motorway destination","","ئامانجێکی ڕێگای خێرا"),O("A tourist attraction","","شوێنێکی گەشتیاری")],0,
      "The colours code the kind of destination: blue for the motorway, green for a main road outside town, white for a main road inside town, brown for tourist places and black for an industrial zone. Reading the colour tells you what kind of road you are being sent onto before you read a single word.","","لەسەر تابلۆی ڕێپیشاندان، پاشبنەمای سەوز چی دەگەیەنێت؟","ڕەنگەکان جۆری ئامانجەکە کۆد دەکەن: شین بۆ ڕێگای خێرا، سەوز بۆ ڕێگای سەرەکی لە دەرەوەی شار، سپی بۆ ڕێگای سەرەکی لە ناو شار، قاوەیی بۆ شوێنە گەشتیارییەکان و ڕەش بۆ ناوچەی پیشەسازی. خوێندنەوەی ڕەنگەکە پێت دەڵێت بەرەو چ جۆرە ڕێگایەک دەنێردرێیت پێش ئەوەی یەک وشە بخوێنیتەوە."),
    Q("rules",null,"A sign has a word or the word ZONE on a plate beneath it. What does that mean?","",
      [O("The rule applies to every street inside the whole marked area, not just this one","","یاساکە بۆ هەموو شەقامێکی ناو ئەو ناوچە دیاریکراوە جێبەجێ دەبێت، نەک تەنها ئەمە"),O("The rule applies only for the next 100 metres","","یاساکە تەنها بۆ ١٠٠ مەتری داهاتوو جێبەجێ دەبێت"),O("The sign is only advisory","","هێماکە تەنها ئامۆژگارییە")],0,
      "A zone sign covers an entire area — a 30 zone, a pedestrian zone, a no-parking zone — and it keeps applying on every street inside it until you meet the sign that ends the zone. You will not see it repeated at each corner.","","هێمایەک وشەیەک یان وشەی ZONE ی لەسەر پانێڵێکی ژێرەوەیە. ئەمە چی دەگەیەنێت؟","هێمای زۆن هەموو ناوچەیەک دەگرێتەوە — زۆنی ٣٠، زۆنی پیادە، زۆنی قەدەغەی پارککردن — و لەسەر هەموو شەقامێکی ناوەوەی جێبەجێ دەبێت هەتا ئەو هێمایە دەبینیت کە کۆتایی بە زۆنەکە دەهێنێت. لە هەر گۆشەیەکدا دووبارە نابێتەوە."),
    Q("rules",null,"How far before a turn should you signal inside a built-up area?","",
      [O("At least as many metres as your speed in km/h — at 20 km/h, 20 m before","","بەلایەنی کەم بەو ژمارە مەترەی خێراییەکەت بە کم/کاتژمێر — لە ٢٠ کم/کاتژمێر، ٢٠ مەتر پێشتر"),O("Exactly three seconds before, whatever the speed","","تەواو سێ چرکە پێشتر، خێراییەکە هەرچی بێت"),O("Only once you have started to turn","","تەنها کاتێک دەستت بە سووڕانەوە کرد")],0,
      "Inside a built-up area the rule of thumb is one metre per km/h. Outside a built-up area you double it — at 80 km/h that means signalling about 160 m before the turn, because other drivers need far longer to react at speed.","","لە ناو ناوچەی نیشتەجێبووندا چەند پێش سووڕانەوە دەبێت ئاماژە بدەیت؟","لە ناو ناوچەی نیشتەجێبووندا بنەمای گشتی یەک مەترە بۆ هەر کم/کاتژمێرێک. لە دەرەوەی ناوچەی نیشتەجێبوون دوو ئەوەندەی دەکەیت — لە ٨٠ کم/کاتژمێردا واتە نزیکەی ١٦٠ مەتر پێش سووڕانەوە ئاماژە بدەیت، چونکە شۆفێرانی تر لە خێرایی بەرزدا کاتێکی زۆر زیاتریان دەوێت بۆ کاردانەوە."),
    Q("signs",null,"A vehicle carries a red reflective triangle on the back. What does it tell you?","",
      [O("It cannot go faster than 30 km/h","","ناتوانێت لە ٣٠ کم/کاتژمێر خێراتر بڕوات"),O("It is carrying dangerous goods","","باری مەترسیدار هەڵدەگرێت"),O("It is a learner driver","","شۆفێرێکی فێرخوازە")],0,
      "The reflective triangle marks a slow vehicle — a tractor or harvester that cannot exceed 30 km/h. You close on it far faster than you expect, so start planning to overtake as soon as you see it. A plain orange rectangular plate means something different: dangerous goods.","","سوارڕۆیەک سێگۆشەیەکی سووری تیشکدەرەوەی لە دواوەیە. چیت پێدەڵێت؟","سێگۆشەی تیشکدەرەوە نیشانەی سوارڕۆیەکی هێواشە — تراکتۆر یان دەڕاسەیەک کە ناتوانێت لە ٣٠ کم/کاتژمێر تێپەڕێت. زۆر خێراتر لەوەی چاوەڕێی دەکەیت لێی نزیک دەبیتەوە، بۆیە هەر کە بینیت پلان بۆ تێپەڕاندن دابنێ. پانێڵێکی چوارگۆشەی نارنجی سادە شتێکی تر دەگەیەنێت: باری مەترسیدار."),
    Q("mech",null,"At roughly what speeds should you change up to 3rd, 4th and 5th gear?","",
      [O("3rd at about 30 km/h, 4th at about 40, 5th at about 50","","سێیەم لە نزیکەی ٣٠ کم/کاتژمێر، چوارەم لە نزیکەی ٤٠، پێنجەم لە نزیکەی ٥٠"),O("3rd at 60, 4th at 80, 5th at 100","","سێیەم لە ٦٠، چوارەم لە ٨٠، پێنجەم لە ١٠٠"),O("Only when the engine starts to struggle","","تەنها کاتێک بزوێنەرەکە دەست بە زەحمەت دەکات")],0,
      "Roughly 30, 40 and 50 km/h for third, fourth and fifth, changing while the engine is between about 1200 and 2500 rpm. Staying in too low a gear wastes fuel and wears the engine; too high a gear makes it labour.","","لە چ خێراییەکدا دەبێت بۆ گێری سێیەم، چوارەم و پێنجەم بگۆڕیت؟","نزیکەی ٣٠، ٤٠ و ٥٠ کم/کاتژمێر بۆ سێیەم، چوارەم و پێنجەم، بە گۆڕین لە کاتێکدا بزوێنەرەکە لە نێوان نزیکەی ١٢٠٠ و ٢٥٠٠ خولانەوەدایە. مانەوە لە گێرێکی زۆر نزمدا سووتەمەنی بەفیڕۆ دەدات و بزوێنەر دەفەوتێنێت؛ گێرێکی زۆر بەرزیش زەحمەتی پێدەدات."),
    Q("mech",null,"In an automatic car, which position must the lever be in to start the engine?","",
      [O("P or N","","P یان N"),O("D","","D"),O("R","","R")],0,
      "An automatic will only start in Park or Neutral — a safety interlock that stops the car lurching away as it fires. Never shift into Neutral to coast while moving either: you lose engine braking and the control that comes with it.","","لە ئۆتۆمبیلی گێر-خۆڕدا، دەستەکە دەبێت لەسەر چ شوێنێک بێت بۆ پێکردنی بزوێنەر؟","ئۆتۆمبیلی گێر-خۆڕ تەنها لەسەر P یان N پێدەکرێت — قوفڵێکی سەلامەتییە کە ڕێگە دەگرێت لەوەی ئۆتۆمبیلەکە لە کاتی پێکردندا بجووڵێت. هەروەها هەرگیز لە کاتی ڕۆیشتندا مەیخە سەر N بۆ خلیسکان: برێکی بزوێنەر و ئەو کۆنترۆڵەی لەگەڵیدایە لەدەست دەدەیت."),
    Q("mech",null,"Where should your hands rest on the steering wheel?","",
      [O("At the 9 and 3 clock positions","","لە شوێنی کاتژمێرەکانی ٩ و ٣"),O("Both hands together at the top","","هەردوو دەست پێکەوە لە سەرەوە"),O("One hand at the bottom of the wheel","","یەک دەست لە خوارەوەی سوکانەکە")],0,
      "Nine and three gives the most control and keeps your arms clear of the airbag. Ten and two suits older cars and large steering wheels. Free play in the wheel should never exceed about 5 cm — more than that needs checking.","","دەستەکانت دەبێت لە کوێی سوکانەکە بن؟","نۆ و سێ زۆرترین کۆنترۆڵ دەدات و باڵەکانت لە ڕێگای بالۆنی هەوایی دوور دەخاتەوە. دە و دوو لەگەڵ ئۆتۆمبیلە کۆنەکان و سوکانە گەورەکاندا دەگونجێت. بۆشایی لە سوکانەکەدا هەرگیز نابێت لە نزیکەی ٥ سم زیاتر بێت — لەوە زیاتر پێویستی بە پشکنینە."),
    Q("mech",null,"A tyre is marked \"DOT ... 0321\". What does 0321 tell you?","",
      [O("It was made in week 03 of 2021","","لە هەفتەی ٠٣ی ساڵی ٢٠٢١ دروستکراوە"),O("It fits a 3 cm by 21 cm rim","","بۆ ویلێکی ٣ سم لە ٢١ سم دەگونجێت"),O("Its maximum pressure is 32.1","","زۆرترین پەستانی ٣٢٫١ ـە")],0,
      "The last four digits of the DOT code are the week and year of manufacture — 03 21 means the third week of 2021. Age matters as much as tread: rubber hardens with time, and a tyre should generally not be more than a couple of years old when fitted.","","تایەیەک بە \"DOT ... 0321\" نیشانە کراوە. ٠٣٢١ چیت پێدەڵێت؟","چوار ژمارەی کۆتایی کۆدی DOT هەفتە و ساڵی بەرهەمهێنانن — ٠٣ ٢١ واتە هەفتەی سێیەمی ساڵی ٢٠٢١. تەمەن هێندەی نەخشی تایە گرنگە: لاستیک بە تێپەڕبوونی کات ڕەق دەبێت، و تایە بە گشتی نابێت لە کاتی دانانیدا لە چەند ساڵێک زیاتر بەسەری هاتبێت."),
    Q("mech",null,"On a tyre marked 205/65 R 15 94 H, what does the letter H mean?","",
      [O("The tyre\u2019s speed rating","","پلەی خێراییی تایەکە"),O("The tyre is for hot climates","","تایەکە بۆ کەشوهەوای گەرمە"),O("The tyre height in inches","","بەرزی تایە بە ئینچ")],0,
      "The final letter is the speed code and the number before it is the load index. Fitting a tyre with a lower speed rating than the car requires is unsafe — but a high rating does not license you to drive fast, since the road and conditions still set the limit.","","لەسەر تایەیەکی نیشانەکراو بە 205/65 R 15 94 H، پیتی H چی دەگەیەنێت؟","پیتی کۆتایی کۆدی خێراییە و ئەو ژمارەیەی پێشی نیشاندەری بارهەڵگرتنە. دانانی تایەیەک بە پلەی خێراییی نزمتر لەوەی ئۆتۆمبیلەکە پێویستی پێیەتی سەلامەت نییە — بەڵام پلەیەکی بەرزیش مۆڵەتت نادات بە خێرایی لێبخوڕیت، چونکە ڕێگا و بارودۆخەکە هێشتا سنوورەکە دیاری دەکەن."),
    Q("rules",null,"When does leaving your car at the kerb legally count as parking?","",
      [O("When it stands there more than 5 minutes, other than to load or set down people or goods","","کاتێک زیاتر لە ٥ خولەک لەوێ دەمێنێتەوە، بێجگە لە بارکردن یان دابەزاندنی کەس یان کاڵا"),O("Only overnight","","تەنها بە درێژایی شەو"),O("Any time the engine is switched off","","هەر کاتێک بزوێنەرەکە بکوژێنرێتەوە")],0,
      "Beyond five minutes, and not for loading or setting down, it is parking. Park within about 30 cm of the kerb with the engine off and the doors closed — further out and you narrow the lane for everyone behind you.","","کەی بەجێهێشتنی ئۆتۆمبیلەکەت لەلای شۆستە بە یاسایی بە پارککردن دادەنرێت؟","زیاتر لە پێنج خولەک، و نەک بۆ بارکردن یان دابەزاندن، ئەوە پارککردنە. لە ماوەی نزیکەی ٣٠ سم لە شۆستەوە پارک بکە بە بزوێنەری کوژاوە و دەرگا داخراو — دوورتر لەوە ڕێڕەوەکە تەسک دەکەیتەوە بۆ هەموو ئەوانەی لە دواتەوەن."),
    Q("rules",null,"You have parked facing DOWNHILL next to a kerb. What should you do?","",
      [O("Apply the handbrake and turn the wheels toward the kerb","","برێکی دەستی دابگرە و تایەکان بەرەو شۆستە بسووڕێنە"),O("Leave it in neutral with the engine running","","لەسەر بۆش بەجێی بهێڵە بە بزوێنەری کارا"),O("Leave the key in it so it can be moved","","کلیلەکەی تێدا بهێڵە تا بتوانرێت بجووڵێنرێت")],0,
      "The handbrake plus wheels turned into the kerb means that if the brake fails the kerb stops the car instead of the traffic below. Never leave the key in it, the engine running, or valuables on a seat.","","ڕوو لە نشێو لەتەنیشت شۆستەیەک پارکت کردووە. دەبێت چی بکەیت؟","برێکی دەستی لەگەڵ تایەی بەرەو شۆستە سووڕاوە واتە ئەگەر برێکەکە شکستی هێنا شۆستەکە ئۆتۆمبیلەکە ڕادەگرێت نەک ئەو هاتوچۆیەی خوارەوە. هەرگیز کلیلەکە تێیدا مەهێڵە، بزوێنەرەکەش مەهێڵە کار بکات، و شتی بەنرخیش لەسەر کورسی دامەنێ."),
    Q("rules",null,"What makes an intersection a \"controlled\" one?","",
      [O("Traffic police, traffic lights, a priority sign, a STOP or give-way sign or line, or a bridge","","پۆلیسی هاتوچۆ، ترافیک لایت، تابلۆی پێشڕەوی، تابلۆ یان هێڵی STOP یان ڕێگەدان، یان پرد"),O("Any junction inside a city","","هەر یەکتربڕێک لە ناو شار"),O("Only a junction with traffic lights","","تەنها ئەو یەکتربڕەی ترافیک لایتی هەیە")],0,
      "Any one of those devices makes the junction controlled and tells you who goes first. If none of them is present the junction is uncontrolled, and the right-hand rule decides it.","","چی وا دەکات یەکتربڕێک ببێتە یەکێکی «کۆنترۆڵکراو»؟","هەر یەکێک لەو ئامێرانە یەکتربڕەکە دەکاتە کۆنترۆڵکراو و پێت دەڵێت کێ یەکەم دەڕوات. ئەگەر هیچیان نەبوو یەکتربڕەکە کۆنترۆڵنەکراوە، و یاسای دەستی ڕاست بڕیاری لەسەر دەدات."),
    Q("rules",null,"What exactly is a U-turn?","",
      [O("Turning 180 degrees in the road to drive back the way you came","","سووڕانەوەی ١٨٠ پلە لە ڕێگادا بۆ گەڕانەوە بەو ڕێگایەی هاتوویت"),O("Turning left at a junction","","سووڕانەوە بۆ چەپ لە یەکتربڕێکدا"),O("Reversing into a parking space","","بە دواوە چوونە ناو شوێنی پارککردن")],0,
      "A U-turn reverses your direction through 180 degrees, so it crosses the path of traffic in both directions at once. Check it is permitted, signal early, move to the left lane — and give way to everyone.","","یوتێرن بە دروستی چییە؟","یوتێرن ئاراستەکەت بە ١٨٠ پلە دەگۆڕێت، بۆیە لە هەمان کاتدا ڕێگای هاتوچۆی هەردوو ئاراستە دەبڕێت. دڵنیابە ڕێگەپێدراوە، زوو ئاماژە بدە، بڕۆ سەر ڕێڕەوی چەپ — و ڕێگە بە هەموان بدە."),
    Q("mech",null,"A traffic officer inspects your car. What does black or blue smoke from the exhaust mean?","",
      [O("The vehicle fails the roadworthiness requirements","","ئۆتۆمبیلەکە لە مەرجەکانی تووندۆتۆڵ دەرناچێت"),O("The engine is simply cold","","بزوێنەرەکە تەنها سارد بووە"),O("It is normal for a diesel","","بۆ دیزەڵ ئاساییە")],0,
      "An engine must not emit black or blue smoke — it fails inspection. An officer may stop and check any vehicle, and the check also covers brakes, lights, horn, mirrors, wipers, glass, tyres and tread.","","ئەفسەرێکی هاتوچۆ ئۆتۆمبیلەکەت دەپشکنێت. دووکەڵی ڕەش یان شین لە ئەگزۆزەوە چی دەگەیەنێت؟","بزوێنەر نابێت دووکەڵی ڕەش یان شین دەربکات — لە پشکنین دەرناچێت. ئەفسەر دەتوانێت هەر ئۆتۆمبیلێک ڕابگرێت و بیپشکنێت، و پشکنینەکە برێک، لایت، هۆڕن، ئاوێنە، فلچە، جام، تایە و نەخشی تایەش دەگرێتەوە."),
    Q("mech",null,"Which of these must be in the car to pass the roadworthiness check?","",
      [O("A fire extinguisher that is still in date, a reflective warning triangle, and a spare tyre with jack and spanner","","ئاگرکوژێنەرەوەیەک کە ماوەی بەسەرنەچووبێت، سێگۆشەی ئاگادارکەرەوەی فسفۆری، و تایەی سپێر لەگەڵ جەک و سپانە"),O("Only a spare tyre","","تەنها تایەی سپێر"),O("Nothing — only the vehicle itself is checked","","هیچ — تەنها خودی ئۆتۆمبیلەکە دەپشکنرێت")],0,
      "The check is not only mechanical. An in-date extinguisher, a reflective triangle and a spare tyre with the tools to fit it must all be aboard — the triangle in particular is what protects you after a breakdown.","","کام لەمانە دەبێت لە ئۆتۆمبیلەکەدا بێت بۆ دەرچوون لە پشکنینی تووندۆتۆڵ؟","پشکنینەکە تەنها میکانیکی نییە. ئاگرکوژێنەرەوەیەکی ماوە ماوە، سێگۆشەیەکی فسفۆری و تایەیەکی سپێر لەگەڵ ئامرازەکانی دانانی هەموویان دەبێت لەگەڵت بن — بەتایبەتی سێگۆشەکە ئەوەیە کە دوای پەککەوتن دەتپارێزێت."),
    Q("rules",null,"Why is it especially dangerous to sit beside a lorry for a long time?","",
      [O("A lorry has much larger blind spots than a car, so the driver may not see you at all","","بارهەڵگر ناوچەی مردووی زۆر گەورەتری هەیە لە ئۆتۆمبیل، بۆیە لەوانەیە شۆفێرەکە هیچ نەتبینێت"),O("Lorries cannot brake at all","","بارهەڵگرەکان هیچ ناتوانن برێک بگرن"),O("It is not dangerous if you are in your own lane","","مەترسیدار نییە ئەگەر لە ڕێڕەوی خۆتدا بیت")],0,
      "Sitting higher does not mean seeing more: a lorry\u2019s blind spots are wider and longer than a car\u2019s. If you cannot see the driver\u2019s mirrors, assume they cannot see you — drop back or pass through decisively.","","بۆچی زۆر مەترسیدارە ماوەیەکی درێژ لەتەنیشت بارهەڵگرێکدا بیت؟","بەرزتر دانیشتن واتای زیاتر بینین نییە: ناوچە مردووەکانی بارهەڵگر پانتر و درێژترن لە هی ئۆتۆمبیل. ئەگەر نەتوانیت ئاوێنەکانی شۆفێرەکە ببینیت، وابزانە ئەویش ناتبینێت — دواکەوە یان بە بڕیارەوە تێپەڕە."),
    Q("rules",null,"In which direction does traffic travel around a roundabout?","",
      [O("Anti-clockwise","","بە پێچەوانەی میلی کاتژمێر"),O("Clockwise","","بە ئاراستەی میلی کاتژمێر"),O("Whichever way is shorter to your exit","","بەو لایەی بۆ دەرچوونەکەت کورتترە")],0,
      "Traffic circulates anti-clockwise, and vehicles already on the roundabout have priority. Roundabouts exist because they cut the severity of junction collisions, hold speeds down, and keep traffic flowing instead of idling.","","هاتوچۆ بە کام ئاراستەدا بەدەوری فلکەدا دەسووڕێتەوە؟","هاتوچۆ بە پێچەوانەی میلی کاتژمێر دەسووڕێتەوە، و ئەو سوارڕۆیانەی پێشتر لەسەر فلکەکەن پێشڕەوییان هەیە. فلکە بۆ ئەوە هەیە کە توندی پێکدادانەکانی یەکتربڕ کەم بکاتەوە، خێرایی داببەزێنێت، و هاتوچۆ بەردەوام بکات لەبری وەستان."),
    Q("rules",null,"You are turning left at a junction on a street with three lanes. Which lane should you take?","",
      [O("The middle lane","","ڕێڕەوی ناوەڕاست"),O("The right-hand lane","","ڕێڕەوی لای ڕاست"),O("Any lane, as long as you signal","","هەر ڕێڕەوێک، بەمەرجێک ئاماژە بدەیت")],0,
      "On a three-lane street the middle lane is the one for turning left; on a two-lane street it is the left lane. Get into position early — moving across at the last moment is what turns a left turn into a collision.","","لە یەکتربڕێکدا بەرەو چەپ دەسووڕێیتەوە لە شەقامێکی سێ ڕێڕەو. کام ڕێڕەو بگریتە بەر؟","لە شەقامێکی سێ ڕێڕەودا ڕێڕەوی ناوەڕاست ئەوەیە بۆ سووڕانەوە بەرەو چەپ؛ لە شەقامێکی دوو ڕێڕەودا ڕێڕەوی چەپە. زوو خۆت لە شوێنی خۆت دابنێ — گواستنەوە لە دواین ساتدا ئەوەیە کە سووڕانەوەیەکی چەپ دەکاتە پێکدادان."),
    Q("signs",null,"What is the difference between a GIVE WAY sign and a STOP sign?","",
      [O("Give way means let others pass and go on if clear; STOP means you must halt completely at the line first","","ڕێگە بدە واتە ڕێگە بە ئەوانی تر بدە و ئەگەر ڕوون بوو بڕۆ؛ STOP واتە دەبێت سەرەتا بە تەواوی لەلای هێڵەکە بوەستیت"),O("They mean exactly the same thing","","هەردووکیان هەمان واتا دەگەیەنن"),O("Stop applies only to lorries","","STOP تەنها بۆ بارهەڵگرەکانە")],0,
      "Give way lets you roll through if the road is genuinely clear. STOP does not: the wheels must stop turning at the line, and only then do you look right, left and right again before moving off.","","جیاوازی نێوان هێمای ڕێگە بدە و هێمای STOP چییە؟","ڕێگە بدە ڕێگەت پێدەدات بڕۆیت ئەگەر ڕێگاکە بەڕاستی ڕوون بێت. STOP ئەوە ناکات: دەبێت تایەکان لەلای هێڵەکە لە سووڕان بوەستن، و تەنها ئینجا سەیری ڕاست، چەپ و دووبارە ڕاست دەکەیت پێش ڕۆیشتن."),
    Q("signs","officer_side","A traffic officer holds one arm straight out to the side. What is happening?","",
      [O("One side of the junction is being held while the other is let through","","لایەکی یەکتربڕەکە ڕاگیراوە و لایەکەی تر ڕێگەی پێدەدرێت"),O("Everyone must stop at once","","هەموان دەبێت یەکسەر بوەستن"),O("The officer is asking for help","","ئەفسەرەکە داوای یارمەتی دەکات")],0,
      "A single extended arm splits the junction: the traffic it points across is stopped while the other direction moves. Watch the officer continuously — the arms change, and the last signal is the one that counts.","","ئەفسەرێکی هاتوچۆ یەک باڵی ڕاست بۆ لایەک ڕاکێشاوە. چی ڕوودەدات؟","یەک باڵی ڕاکێشراو یەکتربڕەکە دابەش دەکات: ئەو هاتوچۆیەی ئاماژەی بۆ دەکات ڕادەگیرێت لە کاتێکدا ئاراستەکەی تر دەجووڵێت. بەردەوام سەیری ئەفسەرەکە بکە — باڵەکان دەگۆڕێن، و ئاماژەی کۆتایی ئەوەیە کە بەکاردێت."),Q("rules",null,"Two vehicles meet on a narrow mountain road, one climbing and one descending. Who has priority?","",
      [O("The one going uphill","","ئەوەی بە هەورازدا سەردەکەوێت"),O("The one coming downhill","","ئەوەی بە نشێوەکەدا دێتە خوارەوە"),O("Whoever arrived first","","ئەوەی یەکەم گەیشتووە")],0,
      "The climbing vehicle has priority, because stopping on a slope and restarting is far harder — and a heavy vehicle that loses momentum uphill may not get going again. The descending driver has gravity and a clearer view, so they give way.","","دوو سوارڕۆ لە ڕێگایەکی تەسکی چیایی یەکتر دەبینن، یەکێک سەردەکەوێت و یەکێک دادەبەزێت. پێشڕەوی بۆ کێیە؟","ئەوەی سەردەکەوێت پێشڕەوی هەیە، چونکە وەستان لەسەر لێژایی و دەستپێکردنەوە زۆر سەختترە — و سوارڕۆیەکی قورس کە لە هەورازدا هێزی لەدەست بدات لەوانەیە نەتوانێت دووبارە بجووڵێت. ئەوەی دادەبەزێت هێزی ڕاکێشان و دیدێکی ڕوونتری هەیە، بۆیە ڕێگە دەدات."),
    Q("rules",null,"A tram or other rail vehicle is crossing your path. Who goes first?","",
      [O("The rail vehicle — it has priority over all other traffic","","سوارڕۆی سەر هێڵ — پێشڕەوی هەیە بەسەر هەموو هاتوچۆیەکی تردا"),O("Whoever is on the main road","","ئەوەی لەسەر ڕێگای سەرەکییە"),O("You do, if you are already moving","","تۆ، ئەگەر پێشتر دەجووڵێیت")],0,
      "Rail vehicles have priority over every other vehicle, for a simple reason: they cannot steer around you and need a very long distance to stop.","","تراموای یان سوارڕۆیەکی تری سەر هێڵ ڕێگاکەت دەبڕێت. کێ یەکەم دەڕوات؟","سوارڕۆی سەر هێڵ پێشڕەوی هەیە بەسەر هەموو سوارڕۆیەکی تردا، بۆ هۆکارێکی سادە: ناتوانن بەلای تۆدا لابدەن و دوورییەکی زۆر درێژیان دەوێت بۆ وەستان."),
    Q("rules",null,"Which number do you call for an ambulance in the Kurdistan Region?","",
      [O("122","","١٢٢"),O("115","","١١٥"),O("104","","١٠٤")],0,
      "122 is the ambulance. The full official list is 115 fire, 440 traffic police, 104 emergency police and 122 ambulance — and the handbook tells you to call 911 for any sudden emergency.","","بۆ ئەمبولانس لە هەرێمی کوردستان پەیوەندی بە چ ژمارەیەکەوە دەکەیت؟","١٢٢ ئەمبولانسە. لیستە فەرمییە تەواوەکە بریتییە لە ١١٥ ئاگرکوژێنەوە، ٤٤٠ پۆلیسی هاتوچۆ، ١٠٤ پۆلیسی فریاکەوتن و ١٢٢ فریاگوزاری — و کتێبەکە داوات لێ دەکات لە هەر بارودۆخێکی کتوپڕدا پەیوەندی بە ٩١١ ەوە بکەیت."),
    Q("rules",null,"Which number do you call for the fire brigade?","",
      [O("115","","١١٥"),O("104","","١٠٤"),O("122","","١٢٢")],0,
      "115 is the fire brigade. Learn the set as a group — 115 fire, 440 traffic police, 104 emergency police, 122 ambulance, 911 for any sudden emergency — because at a crash scene you may need more than one of them.","","بۆ ئاگرکوژێنەوە پەیوەندی بە چ ژمارەیەکەوە دەکەیت؟","١١٥ ئاگرکوژێنەوەیە. کۆمەڵەکە پێکەوە فێربە — ١١٥ ئاگرکوژێنەوە، ٤٤٠ پۆلیسی هاتوچۆ، ١٠٤ پۆلیسی فریاکەوتن، ١٢٢ فریاگوزاری، ٩١١ بۆ هەر بارودۆخێکی کتوپڕ — چونکە لە شوێنی ڕووداودا لەوانەیە پێویستت بە زیاتر لە یەکێکیان بێت."),
    Q("rules",null,"What was the first traffic law in Iraq?","",
      [O("Law No. 50 of 1935","","یاسای ژمارە ٥٠ی ساڵی ١٩٣٥"),O("Law No. 86 of 2004","","یاسای ژمارە ٨٦ی ساڵی ٢٠٠٤"),O("Law No. 48 of 1971","","یاسای ژمارە ٤٨ی ساڵی ١٩٧١")],0,
      "The line runs 50 of 1935, then 48 of 1971, then 86 of 2004 — the last of which is still the law applied in the Kurdistan Region and is made up of 38 parts.","","یەکەم یاسای هاتوچۆ لە عێراقدا چی بوو؟","زنجیرەکە بەم شێوەیەیە: ٥٠ی ١٩٣٥، پاشان ٤٨ی ١٩٧١، پاشان ٨٦ی ٢٠٠٤ — کە دواییان هێشتا ئەو یاسایەیە لە هەرێمی کوردستاندا جێبەجێ دەکرێت و لە ٣٨ بەش پێکهاتووە."),
    Q("rules",null,"A category B licence covers a vehicle up to what weight, with what trailer?","",
      [O("Up to 3500 kg, with a trailer up to 750 kg","","تا ٣٥٠٠ کگم، لەگەڵ کەرەفانەیەک تا ٧٥٠ کگم"),O("Up to 7500 kg, with any trailer","","تا ٧٥٠٠ کگم، لەگەڵ هەر کەرەفانەیەک"),O("Any weight, as long as it is a private car","","هەر کێشێک، بەمەرجێک ئۆتۆمبیلی تایبەت بێت")],0,
      "B covers a vehicle up to 3500 kg pulling a trailer up to 750 kg, with the two together not exceeding 3500 kg. A heavier trailer needs BE; a lorry from 3500 to 7500 kg needs C1, and above that, C.","","مۆڵەتی پۆلی B تا چ کێشێکی سوارڕۆ دەگرێتەوە، لەگەڵ چ کەرەفانەیەک؟","B سوارڕۆیەک تا ٣٥٠٠ کگم دەگرێتەوە کە کەرەفانەیەک تا ٧٥٠ کگم ڕادەکێشێت، بەمەرجێک هەردووکیان پێکەوە لە ٣٥٠٠ کگم تێنەپەڕن. کەرەفانەی قورستر پێویستی بە BE هەیە؛ بارهەڵگری ٣٥٠٠ بۆ ٧٥٠٠ کگم پێویستی بە C1 هەیە، و لەوە بەرزتر، C."),
    Q("rules",null,"What is the penalty for driving without a licence?","",
      [O("A fine of 250,000 to 1,000,000 dinars — and the owner who allowed it faces the same","","غەرامەی ٢٥٠٬٠٠٠ بۆ ١٬٠٠٠٬٠٠٠ دینار — و ئەو خاوەنەی ڕێگەی داوە هەمان سزای بۆ هەیە"),O("Only a verbal warning the first time","","تەنها ئاگادارکردنەوەیەکی زارەکی بۆ جاری یەکەم"),O("Immediate imprisonment for one year","","یەکسەر یەک ساڵ زیندانیکردن")],0,
      "The fine runs from 250,000 to 1,000,000 dinars, and crucially it falls on the vehicle owner or keeper too if they let an unlicensed person drive. Repeating the offence adds one to three months imprisonment.","","سزای لێخوڕین بەبێ مۆڵەت چییە؟","غەرامەکە لە ٢٥٠٬٠٠٠ بۆ ١٬٠٠٠٬٠٠٠ دینارە، و گرنگتر لەوە، لەسەر خاوەن یان بەدەستەی سوارڕۆکەش دەکەوێت ئەگەر ڕێگە بدەن کەسێکی بێ مۆڵەت لێیبخوڕێت. دووبارەکردنەوەی تاوانەکە یەک بۆ سێ مانگ زیندانیکردنی بۆ زیاد دەکرێت."),
    Q("rules",null,"What happens to someone convicted of drink or drug driving?","",
      [O("Three to six months in prison or a fine, plus the licence withdrawn for up to three months","","سێ بۆ شەش مانگ زیندانیکردن یان غەرامە، لەگەڵ لێسەندنەوەی مۆڵەت بۆ ماوەی سێ مانگ"),O("Only the licence is taken, with no other penalty","","تەنها مۆڵەتەکە دەسەنرێتەوە، بێ هیچ سزایەکی تر"),O("Nothing, if nobody was hurt","","هیچ، ئەگەر کەس بریندار نەبووبێت")],0,
      "Three to six months, or a fine of 500,000 to 1,500,000 dinars, with the licence withdrawn for up to three months. Do it again and it rises to six months to a year; more than twice, and the licence can go for three years.","","ئەو کەسەی بە سەرخۆشی یان لە ژێر کاریگەری ماددە هۆشبەرەکاندا لێدەخوڕێت چی بەسەردێت؟","سێ بۆ شەش مانگ، یان غەرامەی ٥٠٠٬٠٠٠ بۆ ١٬٥٠٠٬٠٠٠ دینار، لەگەڵ لێسەندنەوەی مۆڵەت بۆ ماوەی سێ مانگ. دووبارەی بکەیتەوە دەبێتە شەش مانگ بۆ یەک ساڵ؛ زیاتر لە دوو جار، مۆڵەتەکە دەکرێت بۆ سێ ساڵ بسەنرێتەوە."),
    Q("rules",null,"What is the penalty for insulting or obstructing a traffic officer on duty?","",
      [O("Imprisonment for up to two years","","زیندانیکردن بۆ ماوەیەک کە لە دوو ساڵ زیاتر نەبێت"),O("A small fine only","","تەنها غەرامەیەکی بچووک"),O("Nothing — it is not an offence","","هیچ — تاوان نییە")],0,
      "Insulting or obstructing an officer carries up to two years. Assaulting one carries up to three years, and if the assault causes injury, up to five.","","سزای سووکایەتیکردن یان بەربەستکردنی ئەفسەرێکی هاتوچۆ لە کاتی ئەرکدا چییە؟","سووکایەتیکردن یان بەربەستکردنی ئەفسەر تا دوو ساڵی لێدەکەوێتەوە. هێرشکردنە سەریان تا سێ ساڵ، و ئەگەر هێرشەکە ببێتە هۆی برینداربوون، تا پێنج ساڵ."),
    Q("firstaid",null,"You are carrying a passenger who feels sick in the car. What helps most?","",
      [O("Sitting them where they can see the road ahead, and keeping a sick bag in the car","","لەو شوێنە دایاننیشێنە کە ڕێگای پێشەوە ببینن، و کیسەیەکی ڕشانەوە لە ئۆتۆمبیلەکەدا بهێڵەوە"),O("Asking them to close their eyes and read something","","داوایان لێبکە چاویان دابخەن و شتێک بخوێننەوە"),O("Driving faster so the journey ends sooner","","خێراتر لێبخوڕە تا گەشتەکە زووتر تەواو بێت")],0,
      "Motion sickness comes from a mismatch between what the eyes see and what the body feels, so a clear view forward settles it. Smooth, gentle driving helps more than speed; always carry a bag, and help a sick or elderly passenger with the seat belt.","","سەرنشینێکت لەگەڵدایە کە لە ئۆتۆمبیلەکەدا هەست بە نەخۆشی دەکات. چی زۆرترین یارمەتی دەدات؟","نەخۆشیی جووڵە لە نەگونجانی نێوان ئەوەی چاو دەیبینێت و ئەوەی لەش هەستی پێدەکات دێت، بۆیە دیدێکی ڕوونی پێشەوە دایدەمرکێنێتەوە. لێخوڕینی نەرم و هێمن زیاتر یارمەتی دەدات لە خێرایی؛ هەمیشە کیسەیەک لەگەڵ خۆت هەڵگرە، و یارمەتی سەرنشینی نەخۆش یان بەساڵاچوو بدە بۆ بەستنی پشتێن."),Q("rules",null,"The light is green but the junction ahead is blocked with traffic. What must you do?","",
      [O("Wait behind the line until your exit is clear","","لە پشت هێڵەکە بوەستە هەتا دەرچوونەکەت ڕوون دەبێتەوە"),O("Drive in anyway, since the light is green","","بەهەرحاڵ بڕۆ ژوورەوە، چونکە چراکە سەوزە"),O("Sound the horn until the way clears","","بۆڕی لێبدە هەتا ڕێگاکە ڕوون دەبێتەوە")],0,
      "Green permits you to go; it does not promise you room. A junction marked with a yellow criss-cross box must never be entered unless your way out is already clear, or you will block every other direction when the lights change.","","چراکە سەوزە بەڵام یەکتربڕی پێشەوە بە هاتوچۆ داخراوە. دەبێت چی بکەیت؟","سەوز ڕێگەت پێدەدات بڕۆیت؛ بەڵیێنی شوێنت پێنادات. ئەو یەکتربڕەی بە بۆکسێکی زەردی خاچەڕێ نیشانە کراوە هەرگیز نابێت بچیتە ناوی مەگەر دەرچوونەکەت پێشتر ڕوون بێت، ئەگەرنا کاتێک چراکان دەگۆڕێن هەموو ئاراستەکانی تر دەبەستیت."),
    Q("rules",null,"A traffic light shows a green ARROW rather than a round green lamp. Who may go?","",
      [O("Only the traffic travelling in the direction the arrow points","","تەنها ئەو هاتوچۆیەی بەو ئاراستەدا دەڕوات کە تیرەکە پیشانی دەدات"),O("Everyone at the junction","","هەموو ئەوانەی لە یەکتربڕەکەن"),O("Only lorries and buses","","تەنها بارهەڵگر و پاسەکان")],0,
      "A round lamp speaks to every driver at the junction; an arrow speaks only to one direction or one lane. An arrow pointing down applies just to the lane beneath it, so read which lamp is actually yours before moving.","","چرایەکی هاتوچۆ تیرێکی سەوز پیشان دەدات نەک چرایەکی سەوزی خڕ. کێ دەتوانێت بڕوات؟","چرای خڕ قسە لەگەڵ هەموو شۆفێرێکی یەکتربڕەکە دەکات؛ تیر تەنها لەگەڵ یەک ئاراستە یان یەک ڕێڕەو دەدوێت. تیرێکی ڕوو لە خوارەوە تەنها بۆ ئەو ڕێڕەوەیە کە لەژێریدایە، بۆیە پێش جووڵان بزانە کام چرا هی تۆیە."),
    Q("rules",null,"Two red lamps flash alternately side by side at the same height. What do they mean?","",
      [O("You must not pass — stop and wait","","نابێت تێبپەڕیت — بوەستە و چاوەڕێ بکە"),O("Pass slowly with care","","بەهێواشی و بەوریاییەوە تێبپەڕە"),O("They mark a pedestrian crossing only","","تەنها خەتی پەڕینەوەی پیادە دیاری دەکەن")],0,
      "Alternating flashing red means stop: it guards level crossings, opening bridges, quaysides, fire station exits and places where aircraft fly low. A single flashing amber is different — there you may pass, but with great care.","","دوو چرای سووری یەک لەدوای یەک لە هەمان بەرزیدا دەتروسکێنەوە. چی دەگەیەنن؟","سووری تروسکاوەی یەک لەدوای یەک واتای وەستانە: پەڕینگەی شەمەندەفەر، پردی هەڵدانەوە، کەناری ئاو، دەرچەی بنکەی ئاگرکوژێنەوە و ئەو شوێنانەی فڕۆکە بە نزمی دەفڕن دەپارێزێت. زەردی تروسکاوەی تاک جیاوازە — لەوێ دەتوانیت تێبپەڕیت، بەڵام بە وریایییەکی زۆرەوە."),
    Q("signs",null,"Beside a railway you see a post with three red stripes, then one with two, then one with a single stripe. What do they count?","",
      [O("The distance to the level crossing: 300 m, 200 m and 100 m","","دووری بۆ پەڕینگەکە: ٣٠٠، ٢٠٠ و ١٠٠ مەتر"),O("The number of tracks you will cross","","ژمارەی ئەو هێڵانەی دەیانبڕیت"),O("How many trains use the line each hour","","چەند شەمەندەفەر لە هەر کاتژمێرێکدا هێڵەکە بەکاردەهێنن")],0,
      "They are a countdown to the level crossing — three stripes at 300 m, two at 200 m, one at 100 m. By the single stripe you should already be at a speed from which you can stop.","","لەتەنیشت هێڵی شەمەندەفەر کۆڵەکەیەک بە سێ خەتی سوور دەبینیت، پاشان یەکێک بە دوو، پاشان یەکێک بە یەک خەت. چی دەژمێرن؟","ژماردنەوەیەکن بۆ پەڕینگەکە — سێ خەت لە ٣٠٠ مەتر، دوو لە ٢٠٠ مەتر، یەک لە ١٠٠ مەتر. لەلای خەتە تاکەکە دەبێت پێشتر لەو خێراییەدا بیت کە بتوانیت بوەستیت."),
    Q("signs",null,"A warning triangle has a YELLOW background instead of a white one. What does that tell you?","",
      [O("It is a temporary warning — roadworks or another short-term hazard","","ئاگادارکردنەوەیەکی کاتییە — کارکردن لەسەر ڕێگا یان مەترسییەکی کاتیی تر"),O("It is a more serious permanent hazard","","مەترسییەکی هەمیشەیی و توندترە"),O("It applies only at night","","تەنها بە شەو جێبەجێ دەبێت")],0,
      "Yellow marks a warning put up for a limited time while work is going on in or beside the road. Treat it exactly as seriously as a permanent one — the hazard is real now, and the layout may not match what you remember of the road.","","سێگۆشەیەکی ئاگادارکەرەوە پاشبنەمای زەردی هەیە لەبری سپی. ئەمە چیت پێدەڵێت؟","زەرد ئەو ئاگادارکردنەوەیە دیاری دەکات کە بۆ ماوەیەکی سنووردار دانراوە لە کاتی کارکردن لە ڕێگا یان لەتەنیشتی. بە هەمان توندی ئەوەی هەمیشەیی وەری بگرە — مەترسییەکە ئێستا ڕاستەقینەیە، و لەوانەیە شێوەی ڕێگاکە لەگەڵ ئەوەی لەبیرتە نەگونجێت."),
    Q("signs",null,"A red-ringed sign shows two lorries and \"70 m\". What does it require?","",
      [O("Lorries must keep at least 70 m apart","","بارهەڵگرەکان دەبێت بەلایەنی کەم ٧٠ مەتر لە یەکتر دوور بن"),O("Lorries may not travel more than 70 m along this road","","بارهەڵگرەکان نابێت زیاتر لە ٧٠ مەتر بەم ڕێگایەدا بڕۆن"),O("The bridge ahead is 70 m long","","پردی پێشەوە ٧٠ مەتر درێژە")],0,
      "It sets a minimum gap between heavy vehicles, usually on a long descent, in a tunnel or on a weight-limited bridge. Spacing them out keeps the load on the structure down and leaves room to stop.","","هێمایەکی بازنە سوور دوو بارهەڵگر و «٧٠ م» پیشان دەدات. داوای چی دەکات؟","کەمترین بۆشایی نێوان سوارڕۆ قورسەکان دیاری دەکات، زۆرجار لەسەر نشێوێکی درێژ، لە تونێل یان لەسەر پردێکی سنووردار بە کێش. دوورخستنەوەیان بارگرانی لەسەر بیناکە کەم دەکاتەوە و بۆشایی بۆ وەستان دەهێڵێتەوە."),
    Q("rules",null,"You stop at the kerb for two minutes to wait for someone, staying in the car. Is that allowed where a \"no stopping\" sign is posted?","",
      [O("No — no stopping forbids even a brief halt","","نەخێر — قەدەغەی وەستان تەنانەت وەستانێکی کورتیش قەدەغە دەکات"),O("Yes, because it is under five minutes","","بەڵێ، چونکە کەمتر لە پێنج خولەکە"),O("Yes, as long as you stay in the driver’s seat","","بەڵێ، بەمەرجێک لە کورسی شۆفێردا بمێنیتەوە")],0,
      "The blue disc with a red cross forbids stopping as well as parking, so even a short wait is an offence. The single-diagonal disc forbids only parking, which still leaves you a brief halt to set someone down.","","بۆ دوو خولەک لەلای شۆستە دەوەستیت بۆ چاوەڕوانی کەسێک و لە ئۆتۆمبیلەکە دەمێنیتەوە. لەو شوێنەی هێمای «قەدەغەی وەستان» دانراوە ئایا ڕێگەپێدراوە؟","بازنە شینەکە بە خاچی سوورەوە هەم وەستان هەم پارککردن قەدەغە دەکات، بۆیە تەنانەت چاوەڕوانییەکی کورتیش تاوانە. بازنەکەی بە یەک هێڵی لار تەنها پارککردن قەدەغە دەکات، کە هێشتا ڕێگەت پێدەدات بۆ ماوەیەکی کورت بوەستیت بۆ دابەزاندنی کەسێک."),Q("rules",null,"What is the difference between a Freeway sign (green) and a Highway sign (blue)?","",
      [O("A freeway has no junctions or stop signs; a highway may have junctions and traffic lights","","ڕێگای خێرا هیچ یەکتربڕ و هێمای وەستانی نییە؛ ڕێگای سەرەکی لەوانەیە یەکتربڕ و ترافیک لایتی هەبێت"),O("They are the same road, drawn in two colours","","هەمان ڕێگان، بە دوو ڕەنگ کێشراون"),O("Green means the road is closed","","سەوز واتە ڕێگاکە داخراوە")],0,
      "The green freeway sign marks a road with no stops and no crossings, which is why it is faster and safer. The blue highway sign allows junctions and lights, so speeds are lower. Each sign also marks where its special rules begin and end.","","جیاوازی نێوان هێمای ڕێگای خێرا (سەوز) و ڕێگای سەرەکی (شین) چییە؟","هێمای سەوزی ڕێگای خێرا ئەو ڕێگایە دیاری دەکات کە هیچ وەستان و بڕینەوەیەکی نییە، بۆیە خێراتر و سەلامەتترە. هێمای شینی ڕێگای سەرەکی ڕێگە بە یەکتربڕ و چرا دەدات، بۆیە خێراییەکان نزمترن. هەر هێمایەکیش ئەو شوێنە دیاری دەکات کە یاسا تایبەتەکانی لێی دەست پێدەکەن و کۆتایی دێن."),
    Q("rules",null,"A sign shows a town name with a row of buildings, and later the same sign with a red diagonal line. What do they mark?","",
      [O("The start and the end of the built-up area","","دەستپێک و کۆتایی ناوچەی نیشتەجێبوون"),O("A tourist attraction and its exit","","شوێنێکی گەشتیاری و دەرچەکەی"),O("The start and end of roadworks","","دەستپێک و کۆتایی کارکردن لەسەر ڕێگا")],0,
      "These mark where the built-up area begins and ends — which matters because the general speed limit changes there: 60 inside, 80 outside. The red diagonal always means \"end of\".","","هێمایەک ناوی شارێک لەگەڵ ڕیزێک بینا پیشان دەدات، و دواتر هەمان هێما بە هێڵێکی سووری لار. چی دیاری دەکەن؟","ئەمانە ئەو شوێنە دیاری دەکەن کە ناوچەی نیشتەجێبوون لێی دەست پێدەکات و کۆتایی دێت — کە گرنگە چونکە سنووری خێراییی گشتی لەوێدا دەگۆڕێت: ٦٠ لە ناوەوە، ٨٠ لە دەرەوە. هێڵی سووری لار هەمیشە واتای «کۆتایی» دەگەیەنێت."),
    Q("signs",null,"A blue square sign carries a large white letter H. What does it show?","",
      [O("A hospital","","نەخۆشخانە"),O("A hotel","","هوتێل"),O("A helicopter landing area","","شوێنی نیشتنەوەی هێلیکۆپتەر")],0,
      "H marks a hospital. In the same blue information family, P marks parking and a P drawn under a roof marks a covered or multi-storey car park.","","هێمایەکی شینی چوارگۆشە پیتێکی گەورەی سپیی H هەڵدەگرێت. چی پیشان دەدات؟","H نەخۆشخانە دیاری دەکات. لە هەمان خێزانی زانیاریی شیندا، P پارککردن دیاری دەکات و P ی لەژێر سەقفێکدا کێشراو گەراجی پارککردنی بنمیچدار دیاری دەکات."),
    Q("signs",null,"One blue sign shows a person walking UP steps, another shows a person walking DOWN steps. What is the difference?","",
      [O("Up steps is a pedestrian footbridge; down steps is a pedestrian underpass","","سەرکەوتن بە پلەکاندا پردی پەڕینەوەی پیادەیە؛ دابەزین ڕێگای ژێرزەمینییە"),O("They both mean the same crossing","","هەردووکیان هەمان پەڕینەوە دەگەیەنن"),O("One is for cyclists only","","یەکێکیان تەنها بۆ پاسکیلسوارانە")],0,
      "The direction of the steps tells you whether you cross over the road or under it. Both keep pedestrians off the carriageway, and where one is provided it should be used rather than crossing the road itself.","","هێمایەکی شین کەسێک پیشان دەدات کە بە پلەکاندا سەردەکەوێت، ئەوی تر کەسێک کە دادەبەزێت. جیاوازییەکە چییە؟","ئاراستەی پلەکان پێت دەڵێت ئایا بەسەر ڕێگاکەدا دەپەڕیتەوە یان لەژێریدا. هەردووکیان پیادە لە ڕێگاکە دوور دەخەنەوە، و لەو شوێنەی یەکێکیان هەیە دەبێت بەکاربهێنرێت لەبری پەڕینەوەی خودی ڕێگاکە."),
    Q("signs",null,"Beneath a warning sign there is a small white plate reading \"200 m\". What does it add?","",
      [O("The hazard is 200 m ahead","","مەترسییەکە ٢٠٠ مەتر لە پێشەوەیە"),O("The hazard lasts for 200 m","","مەترسییەکە بۆ ٢٠٠ مەتر بەردەوامە"),O("You must drive at 200 m per minute","","دەبێت بە ٢٠٠ مەتر لە خولەکێکدا لێبخوڕیت")],0,
      "Supplementary plates qualify the sign above them. A plain distance is how far ahead the hazard lies; an arrow with a distance shows how far the restriction extends; a length in kilometres shows how long it continues.","","لەژێر هێمایەکی ئاگادارکەرەوەدا پانێڵێکی بچووکی سپی هەیە کە «٢٠٠ م» دەنووسێت. چی زیاد دەکات؟","پانێڵی زیادە واتای ئەو هێمایە دیاری دەکات کە لەسەریانە. دوورییەکی سادە واتە مەترسییەکە چەند لە پێشەوەیە؛ تیرێک لەگەڵ دووری پیشان دەدات سنوورەکە چەند درێژ دەبێتەوە؛ درێژییەک بە کیلۆمەتر پیشان دەدات چەند بەردەوام دەبێت."),
    Q("signs",null,"A supplementary plate under a slippery-road sign shows two snowflakes. What does it mean?","",
      [O("The warning applies when there is ice or snow","","ئاگادارکردنەوەکە کاتێک جێبەجێ دەبێت کە بەستەڵەک یان بەفر هەبێت"),O("The road is closed in winter","","ڕێگاکە لە زستاندا داخراوە"),O("Snow chains are forbidden","","زنجیری بەفر قەدەغەیە")],0,
      "The plate narrows when the warning applies — snowflakes for ice and snow, a rain symbol for wet weather. Outside those conditions the hazard above is much less likely, but the sign stays in place all year.","","پانێڵێکی زیادە لەژێر هێمای ڕێگای خلیسکدا دوو نەقشی بەفر پیشان دەدات. چی دەگەیەنێت؟","پانێڵەکە دیاری دەکات کەی ئاگادارکردنەوەکە جێبەجێ دەبێت — نەقشی بەفر بۆ بەستەڵەک و بەفر، هێمای باران بۆ کەشوهەوای تەڕ. لە دەرەوەی ئەو بارودۆخانە مەترسییەکەی سەرەوە زۆر کەمترە، بەڵام هێماکە بە درێژایی ساڵ لە شوێنی خۆی دەمێنێتەوە."),
    Q("signs",null,"A road is blocked by a striped barrier board. How do you know which way to pass?","",
      [O("Diagonal stripes lean toward the side you should pass; vertical stripes mean the road is closed","","خەتە لارەکان بەرەو ئەو لایە دەچەمێنەوە کە دەبێت لێیەوە تێبپەڕیت؛ خەتە ستوونییەکان واتە ڕێگاکە داخراوە"),O("You always pass on the right","","هەمیشە بەلای ڕاستدا تێدەپەڕیت"),O("The board only marks the edge of the road","","تەختەکە تەنها لێواری ڕێگاکە دیاری دەکات")],0,
      "Read the lean of the stripes: they point to the open side. Upright stripes mean there is no way through at all. The same logic runs through chevron boards on a bend — the more chevrons, the tighter the turn.","","ڕێگایەک بە تەختەیەکی بەربەستی خەتدار داخراوە. چۆن دەزانیت بە کام لادا تێبپەڕیت؟","سەیری چەمانەوەی خەتەکان بکە: ئاماژە بەو لایە دەکەن کە کراوەیە. خەتی ڕاوەستاو واتە هیچ ڕێگایەکی تێپەڕبوون نییە. هەمان لۆژیک لە تەختەکانی پێچدا هەیە — چەند نیشانەکان زیاتر بن، پێچەکە توندترە."),Q("signs",null,"The centre of the road has a solid line on your side and a broken line on the other. What may you do?","",
      [O("You must not cross — each driver obeys the line on their own side","","نابێت بیبڕیت — هەر شۆفێرێک گوێڕایەڵی ئەو هێڵەیە کە لەلای خۆیەتی"),O("You may cross, because one of the lines is broken","","دەتوانیت بیبڕیت، چونکە یەکێک لە هێڵەکان پچڕپچڕە"),O("Neither driver may cross","","هیچ کام لە شۆفێرەکان ناتوانن بیبڕن")],0,
      "Read the line nearest to you. Solid on your side means no crossing and no overtaking; the driver on the broken side may cross toward you. A double solid line bars both directions.","","ناوەڕاستی ڕێگاکە هێڵێکی بەردەوامی لەلای تۆیە و پچڕپچڕ لەلای ئەوی تر. چیت بۆ هەیە بیکەیت؟","سەیری ئەو هێڵە بکە کە لە تۆ نزیکترە. بەردەوام لەلای تۆ واتە نە بڕین و نە تێپەڕاندن؛ ئەو شۆفێرەی لەلای پچڕپچڕەکەیە دەتوانێت بەرەو تۆ بیبڕێت. هێڵی دووانەی بەردەوام هەردوو ئاراستە دەبەستێت."),
    Q("signs",null,"A yellow or white ZIGZAG line runs along the side of the road. What does it mean?","",
      [O("Stopping and parking are forbidden along its whole length","","وەستان و پارککردن بە درێژایی هەمووی قەدەغەیە"),O("It marks a cycle lane","","ڕێڕەوی پاسکیل دیاری دەکات"),O("It warns of a bend ahead","","ئاگادارت دەکاتەوە لە پێچێک لە پێشەوە")],0,
      "Zigzag lines are painted outside schools, hospitals, police and fire stations and other places where the view must stay clear. Where the word BUS appears with them, they mark a bus stop.","","هێڵێکی پێچاوپێچی زەرد یان سپی بەلای ڕێگاکەدا دەڕوات. چی دەگەیەنێت؟","هێڵی پێچاوپێچ لە بەردەم قوتابخانە، نەخۆشخانە، بنکەی پۆلیس و ئاگرکوژێنەوە و ئەو شوێنانەی دەبێت دید ڕوون بمێنێتەوە دەکێشرێت. لەو شوێنەی وشەی BUS لەگەڵیاندا دەردەکەوێت، شوێنی وەستانی پاس دیاری دەکەن."),
    Q("signs",null,"A row of white triangles is painted across your lane, pointing at you. What do they mean?","",
      [O("Give way — you do not have priority here","","ڕێگە بدە — لێرە پێشڕەویت نییە"),O("A pedestrian crossing begins","","خەتی پەڕینەوەی پیادە دەست پێدەکات"),O("You must stop completely","","دەبێت بە تەواوی بوەستیت")],0,
      "The triangles — often called shark’s teeth — are the painted form of the give-way sign. Unlike a stop line, you need not halt if the way is genuinely clear, but the traffic you are joining goes first.","","ڕیزێک سێگۆشەی سپی بەسەر ڕێڕەوەکەتدا کێشراوە و ئاراستەی تۆن. چی دەگەیەنن؟","سێگۆشەکان شێوەی کێشراوی هێمای ڕێگەدانن. بەپێچەوانەی هێڵی وەستان، پێویست ناکات بوەستیت ئەگەر ڕێگاکە بەڕاستی ڕوون بێت، بەڵام ئەو هاتوچۆیەی پێی دەگەیت یەکەم دەڕوات."),
    Q("rules",null,"In Iraq and the Kurdistan Region, what does the colour painted on a kerb tell you about parking?","",
      [O("Nothing officially — kerb colour is not a traffic sign; only signs and the law decide","","هیچ بە فەرمی — ڕەنگی لێواری شۆستە هێمای هاتوچۆ نییە؛ تەنها هێما و یاسا بڕیار دەدەن"),O("Red kerb always means no parking","","لێواری سوور هەمیشە واتای قەدەغەی پارککردنە"),O("Yellow kerb always means parking allowed","","لێواری زەرد هەمیشە واتای ڕێگەپێدانی پارککردنە")],0,
      "Kerb paint is decoration and street maintenance, not a legal instruction — a point many drivers get wrong. Where stopping and parking are forbidden is set by the signs and by the traffic law itself, not by the colour of the kerb.","","لە عێراق و هەرێمی کوردستاندا، ئەو ڕەنگەی لەسەر لێواری شۆستە کێشراوە چیت پێدەڵێت دەربارەی پارککردن؟","ڕەنگی لێوار جوانکاری و چاککردنەوەی شەقامە، نەک ڕێنمایییەکی یاسایی — خاڵێک کە زۆر شۆفێر هەڵەی تێدا دەکەن. ئەو شوێنانەی وەستان و پارککردن قەدەغەیە لەلایەن هێماکان و خودی یاسای هاتوچۆوە دیاری دەکرێن، نەک بە ڕەنگی لێوارەکە."),
    Q("signs",null,"During roadworks you see two sets of lane lines in different colours. Which do you follow?","",
      [O("The temporary ones — they are painted a different colour on purpose","","کاتییەکان — بە ئەنقەست بە ڕەنگێکی جیاواز کێشراون"),O("The permanent white ones","","هەمیشەییە سپییەکان"),O("Whichever is easier to follow","","هەرکامیان ئاسانتر بێت بۆ پەیڕەوکردن")],0,
      "Permanent markings are white or yellow; temporary ones must be painted in a different colour precisely so you can tell them apart. While the works last, the temporary lines are the ones in force.","","لە کاتی کارکردن لەسەر ڕێگادا دوو دەستە هێڵی ڕێڕەو بە ڕەنگی جیاواز دەبینیت. کامیان پەیڕەو دەکەیت؟","نیشانە هەمیشەییەکان سپی یان زەردن؛ کاتییەکان دەبێت بە ڕەنگێکی جیاواز بکێشرێن هەر بۆ ئەوەی بتوانیت جیایان بکەیتەوە. تا کارەکە بەردەوامە، هێڵە کاتییەکان ئەوانەن کە جێبەجێ دەکرێن."),
    Q("rules",null,"A direction sign has a BROWN background. What kind of destination is it?","",
      [O("A tourist or leisure destination, such as a park","","ئامانجێکی گەشتیاری یان پشوودان، وەک پارک"),O("An industrial zone","","ناوچەی پیشەسازی"),O("A motorway exit","","دەرچەی ڕێگای خێرا")],0,
      "Brown marks tourist and leisure places. Black with yellow lettering marks an industrial zone, white marks a destination inside the built-up area, green a highway destination outside it, and blue a freeway destination.","","تابلۆیەکی ڕێپیشاندان پاشبنەمای قاوەیی هەیە. چ جۆرە ئامانجێکە؟","قاوەیی شوێنە گەشتیاری و پشوودانەکان دیاری دەکات. ڕەش بە نووسینی زەرد ناوچەی پیشەسازی دیاری دەکات، سپی ئامانجێک لە ناو ناوچەی نیشتەجێبوون، سەوز ئامانجێکی ڕێگای سەرەکی لە دەرەوەی، و شین ئامانجێکی ڕێگای خێرا."),
    Q("signs",null,"A lorry displays an orange diamond plate with an exploding symbol and the number 1. What is it carrying?","",
      [O("Explosives","","ماددەی تەقەمەنی"),O("Flammable liquid","","شلەمەنیی گڕگرتوو"),O("Oxidising material","","ماددەی ئۆکسان")],0,
      "Dangerous goods are split into nine classes, each with its own colour: orange for explosives, red for flammable gas or liquid, green for non-flammable gas, a white plate with a skull for toxic gas, blue for material dangerous when wet, and yellow for oxidisers.","","بارهەڵگرێک پلێتێکی لۆچی نارنجی بە هێمای تەقینەوە و ژمارە ١ پیشان دەدات. چی هەڵدەگرێت؟","بارە مەترسیدارەکان بەسەر نۆ پۆلدا دابەش دەکرێن، هەریەکەیان ڕەنگی خۆی هەیە: نارنجی بۆ تەقەمەنی، سوور بۆ گازی گڕگرتوو یان شلەمەنی، سەوز بۆ گازی ناگڕگرتوو، پلێتی سپی بە کاسەسەرەوە بۆ گازی ژەهراوی، شین بۆ ئەو ماددەیەی کاتێک تەڕ دەبێت مەترسیدارە، و زەرد بۆ ئۆکسانەکان."),
    Q("signs",null,"Direction arrows painted on the road must be at least how long?","",
      [O("Two metres","","دوو مەتر"),O("Half a metre","","نیو مەتر"),O("Ten metres","","دە مەتر")],0,
      "An arrow shorter than two metres cannot be read in time from a moving car. Where the road is wide enough each lane gets its own arrow, and they are repeated on the approach to a junction.","","تیرەکانی ئاراستە کە لەسەر ڕێگا دەکێشرێن دەبێت بەلایەنی کەم چەند درێژ بن؟","تیرێکی کورتتر لە دوو مەتر لە ئۆتۆمبیلێکی جووڵاوەوە لە کاتی خۆیدا ناخوێنرێتەوە. لەو شوێنانەی ڕێگاکە بەرفراوانە هەر ڕێڕەوێک تیری خۆی هەیە، و لە نزیکبوونەوەی یەکتربڕدا دووبارە دەکرێنەوە."),Q("mech",null,"What does the crankshaft do in an engine?","",
      [O("It turns the pistons’ up-and-down movement into rotation","","جوڵەی سەرەوە-خوارەوەی پستنەکان دەگۆڕێت بۆ سووڕانەوە"),O("It cools the engine","","بزوێنەرەکە سارد دەکاتەوە"),O("It filters the oil","","رۆنەکە دەپاڵێوێت")],0,
      "The piston is pushed down by the burning fuel, the connecting rod passes that push to the crankshaft, and the crankshaft converts the straight-line motion into the rotation that eventually turns the wheels. The flywheel then carries that motion on to the clutch.","","کرینک شەفت لە بزوێنەردا چی دەکات؟","پستن بە سووتانی سووتەمەنی بەرەو خوارەوە پاڵ دەدرێت، ڕۆدی بەیەکەوەبەستن ئەو پاڵنانە دەگوازێتەوە بۆ کرینک شەفت، و کرینک شەفتیش جوڵەی هێڵی ڕاست دەگۆڕێت بۆ ئەو سووڕانەوەیەی لە کۆتاییدا ویلەکان دەسووڕێنێت. پاشان فلای ویل ئەو جوڵەیە دەباتە کلاچەوە."),
    Q("mech",null,"What is the job of the piston rings?","",
      [O("They seal the piston so liquid cannot get into the cylinder","","پستنەکە دەبەستن تا شلە نەچێتە ناو سلندەرەوە"),O("They hold the wheels onto the axle","","ویلەکان بە تەوەرەکەوە دەگرن"),O("They connect the battery to the starter","","باتری بە ستارتەرەوە دەبەستنەوە")],0,
      "The rings are metal bands around the piston that keep the seal inside the cylinder. The gasket does a similar job higher up, sealing the join between the cylinder and the cylinder head so nothing leaks in or out.","","ئەرکی ڕینگەکانی پستن چییە؟","ڕینگەکان بازنەی کانزاین بەدەوری پستنەکەدا کە بەستنەکە لە ناو سلندەردا دەپارێزن. گاسکێتیش ئەرکێکی هاوشێوە لە سەرەوەتردا دەبینێت، بەستنی نێوان سلندەر و دەپۆشەری سلندەر دەگرێت تا هیچ نەچێتە ژوورەوە و دەرەوە."),
    Q("mech",null,"You are climbing a steep hill. Why should you select a LOW gear?","",
      [O("A low gear gives more power, a high gear gives more speed but less power","","گێری نزم هێزی زیاتر دەدات، گێری بەرز خێراییی زیاتر بەڵام هێزی کەمتر"),O("A low gear saves the brakes","","گێری نزم برێکەکان دەپارێزێت"),O("It makes no difference on a hill","","لەسەر گردێک هیچ جیاوازییەکی نییە")],0,
      "The higher the gear number, the greater the speed but the weaker the pull. A climb needs pull, not speed, so change down before the hill rather than half-way up when the engine is already labouring.","","بە هەورازێکی توندا سەردەکەویت. بۆچی دەبێت گێرێکی نزم هەڵبژێریت؟","چەند ژمارەی گێر بەرزتر بێت، خێرایی زیاتر بەڵام ڕاکێشان لاوازترە. سەرکەوتن پێویستی بە ڕاکێشانە نەک خێرایی، بۆیە پێش گردەکە گێر دابەزێنە نەک لە نیوەڕێدا کاتێک بزوێنەرەکە پێشتر زەحمەتی دەبینێت."),
    Q("mech",null,"On an automatic gear lever, what do the letters P R N D mean?","",
      [O("Park, Reverse, Neutral, Drive","","پارککردن، بەک، بۆش، لێخوڕین"),O("Power, Rapid, Normal, Downhill","","هێز، خێرا، ئاسایی، نشێو"),O("Petrol, Reserve, None, Diesel","","بەنزین، یەدەگ، هیچ، دیزەڵ")],0,
      "Park locks the transmission, Reverse backs the car, Neutral disconnects the drive and Drive moves it forward. The gearbox then chooses the ratios itself according to speed, engine revs and load.","","لەسەر دەستەی گێری خۆگەڕ، پیتەکانی P R N D چی دەگەیەنن؟","پارککردن گێرەکە قوفڵ دەکات، بەک ئۆتۆمبیلەکە بەرەو دواوە دەبات، بۆش پەیوەندی جوڵە دەبڕێت و لێخوڕین بەرەو پێشەوەی دەبات. پاشان سندووقی گێر خۆی پلەکان هەڵدەبژێرێت بەپێی خێرایی، خولانەوەی بزوێنەر و بار."),
    Q("mech",null,"What is an advantage of a manual gearbox over an automatic?","",
      [O("More power, cheaper repairs, and better control on descents and slippery roads","","هێزی زیاتر، چاککردنەوەی هەرزانتر، و کۆنترۆڵی باشتر لە نشێو و ڕێگای خلیسکدا"),O("It is easier to learn to drive","","فێربوونی لێخوڕینی ئاسانترە"),O("It is less tiring in heavy traffic","","لە قەرەباڵغیدا کەمتر ماندووکەرە")],0,
      "A manual gives more power to the wheels, is simpler and cheaper to fix, and is safer on a descent or a slippery road because engine braking is under your control. The trade-offs are that it is harder to learn and tiring in stop-start traffic.","","سوودی سندووقی گێری دەستی بەراورد بە خۆگەڕ چییە؟","گێری دەستی هێزی زیاتر دەداتە ویلەکان، سادەتر و هەرزانترە بۆ چاککردنەوە، و لە نشێو یان ڕێگای خلیسکدا سەلامەتترە چونکە برێکی بزوێنەر لەژێر کۆنترۆڵی تۆدایە. بەرامبەرەکەی ئەوەیە کە فێربوونی سەختترە و لە هاتوچۆی وەستان-ڕۆیشتندا ماندووکەرە."),
    Q("signs",null,"A lorry carries a yellow and white diamond plate with a radiation symbol and the number 7. What is inside?","",
      [O("Radioactive material","","ماددەی تیشکدەری ناوکی"),O("Corrosive acid","","ترشی ڕەنگهەڵێنەر"),O("Compressed oxygen","","ئۆکسجینی پەستێنراو")],0,
      "Class 7 is radioactive material, on a yellow and white diamond. Class 8, corrosive, is a black and white diamond showing liquid burning a hand, and class 9, miscellaneous dangerous goods, is black and white striped.","","بارهەڵگرێک پلێتێکی لۆچی زەرد و سپی بە هێمای تیشک و ژمارە ٧ هەڵدەگرێت. چی لە ناویدایە؟","پۆلی ٧ ماددەی تیشکدەری ناوکییە، لەسەر لۆچێکی زەرد و سپی. پۆلی ٨، ڕەنگهەڵێنەر، لۆچێکی ڕەش و سپییە کە شلەیەک پیشان دەدات دەستێک دەسووتێنێت، و پۆلی ٩، بارە مەترسیدارە هەمەجۆرەکان، ڕەش و سپیی خەتدارە."),Q("mech",null,"What is the minimum legal tread depth on a tyre?","",
      [O("1.6 mm","","١٫٦ ملم"),O("0.5 mm","","٠٫٥ ملم"),O("5 mm","","٥ ملم")],0,
      "Below 1.6 mm the grooves can no longer clear water and the tyre starts to float on a wet road. Most tyres carry moulded wear bars that become flush with the tread at exactly that depth, so you can check without a gauge.","","کەمترین قووڵایی نەخشی تایە بەپێی یاسا چەندە؟","لە خوار ١٫٦ ملم بۆڵەکان چیتر ناتوانن ئاو دەربکەن و تایەکە لەسەر ڕێگای تەڕدا دەست دەکات بە مەلەکردن. زۆربەی تایەکان هێڵی سووانەوەیان هەیە کە لەو قووڵاییەدا لەگەڵ نەخشەکە یەکسان دەبن، بۆیە بەبێ پێوەر دەتوانیت بیپشکنیت."),
    Q("mech",null,"You have fitted the space-saver spare wheel. What should you do next?","",
      [O("Drive gently to the nearest repair shop and have the proper tyre fitted","","بەهێواشی بڕۆ بۆ نزیکترین شوێنی چاککردنەوە و تایەی ڕاستەقینە دابنێ"),O("Carry on with your journey as normal","","بە ئاسایی گەشتەکەت تەواو بکە"),O("Keep it on until it wears out","","لەسەری بهێڵەوە هەتا دەسووێت")],0,
      "A space-saver is built to get you to help, not to be driven on. It is narrower, weaker and speed-limited, and it changes how the car handles and brakes.","","تایەی یەدەگی بچووکت داناوە. دواتر دەبێت چی بکەیت؟","تایەی یەدەگی بچووک بۆ ئەوە دروستکراوە کە بتگەیەنێتە یارمەتی، نەک بۆ لێخوڕینی بەردەوام. تەسکتر و لاوازترە و سنووری خێراییی هەیە، و شێوازی جووڵان و برێکگرتنی ئۆتۆمبیلەکە دەگۆڕێت."),
    Q("mech",null,"What must be true of the tyres fitted to your car?","",
      [O("They should all be the same type — at minimum the two front alike and the two rear alike","","دەبێت هەموویان یەک جۆر بن — بەلایەنی کەم دوانەی پێشەوە وەک یەک و دوانەی دواوە وەک یەک"),O("Any mix of tyres is fine if they are the right size","","هەر تێکەڵەیەک باشە ئەگەر قەبارەکەیان ڕاست بێت"),O("Only the front tyres matter","","تەنها تایەکانی پێشەوە گرنگن")],0,
      "Mixing tyre types changes how much grip each end of the car has, so it can grip well at one end and let go at the other in a corner or an emergency stop. Pressures must be checked with a gauge and kept equal.","","دەبێت چی لە تایەکانی ئۆتۆمبیلەکەتدا ڕاست بێت؟","تێکەڵکردنی جۆری تایە ئەوە دەگۆڕێت کە هەر کۆتاییەکی ئۆتۆمبیلەکە چەند دەنووسێت، بۆیە دەتوانێت لە لایەکەوە باش بنووسێت و لەوی ترەوە بەردەدات لە پێچ یان وەستانی لەناکاودا. پەستان دەبێت بە پێوەر بپشکنرێت و یەکسان بمێنێتەوە."),
    Q("mech",null,"What does ABS do when you brake hard?","",
      [O("It stops the wheels locking, so you keep steering control","","ڕێگە دەگرێت لە قوفڵبوونی ویلەکان، بۆیە کۆنترۆڵی سوکان دەپارێزیت"),O("It shortens the stopping distance on every surface","","لەسەر هەموو ڕوویەکدا دووری وەستان کورت دەکاتەوە"),O("It applies the handbrake automatically","","بە خۆکاری برێکی دەستی دادەگرێت")],0,
      "Locked wheels cannot steer. ABS releases and reapplies the brakes rapidly so the wheels keep turning and you can still steer round the hazard. On dry or wet tarmac it also shortens the stop — but on gravel or snow the distance actually gets longer, because a locked wheel would have built a wedge of loose material in front of it.","","ABS کاتێک بە توندی برێک دەگریت چی دەکات؟","ویلی قوفڵبوو ناتوانێت ئاراستە بگۆڕێت. ABS بە خێرایی برێکەکە بەردەدات و دووبارە دایدەگرێت تا ویلەکان بەردەوام بسووڕێن و بتوانیت هێشتا بەدەوری مەترسییەکەدا بسووڕێیتەوە. لەسەر قیری وشک یان تەڕ وەستانەکەش کورت دەکاتەوە — بەڵام لەسەر بەرد یان بەفر دوورییەکە درێژتر دەبێت، چونکە ویلی قوفڵبوو تەپەیەکی ماددەی سست لەبەردەم خۆیدا دروست دەکرد."),
    Q("mech",null,"An amber ABS symbol lights up on the dashboard. What does it mean?","",
      [O("The ABS has a fault — the normal brakes still work, but get it checked","","ABS کێشەی هەیە — برێکە ئاساییەکان هێشتا کاردەکەن، بەڵام بیپشکنە"),O("The brakes have completely failed","","برێکەکان بە تەواوی شکستیان هێناوە"),O("The handbrake is on","","برێکی دەستی داگیراوە")],0,
      "The car still stops, but without the anti-lock help — so in an emergency the wheels can lock and you lose steering. Treat it as a fault to fix soon, not an emergency to stop for.","","هێمای زەردباوی ABS لەسەر داشبۆرد داگیرسا. چی دەگەیەنێت؟","ئۆتۆمبیلەکە هێشتا دەوەستێت، بەڵام بێ یارمەتیی دژە قوفڵبوون — بۆیە لە کاتی لەناکاودا ویلەکان دەتوانن قوفڵ بن و کۆنترۆڵی سوکان لەدەست دەدەیت. وەک کێشەیەکی بزانە کە بەزوویی دەبێت چاک بکرێت، نەک بارودۆخێکی لەناکاو کە بۆی بوەستیت."),
    Q("mech",null,"Why is it dangerous to rest your hand on the airbag cover or the dashboard while driving?","",
      [O("If the airbag fires it throws your hand back into your own face with great force","","ئەگەر بالۆنەکە بتەقێت دەستەکەت بە هێزێکی زۆرەوە دەداتەوە ڕووی خۆت"),O("It sets off the alarm","","ئاگادارکەرەوەکە دەخاتە کار"),O("It drains the battery","","باتری کۆتایی دەهێنێت")],0,
      "An airbag inflates in milliseconds with enormous force, and anything resting on it becomes a projectile. The same applies to a leg propped on the dashboard. Holding the wheel with one hand causes a quieter problem: your hand hides the dashboard warning lights.","","بۆچی مەترسیدارە لە کاتی لێخوڕیندا دەستت لەسەر دەپۆشەری بالۆنی هەوایی یان داشبۆرد دابنێیت؟","بالۆنی هەوایی لە چەند میلی چرکەیەکدا بە هێزێکی زۆرەوە دەکرێتەوە، و هەر شتێک لەسەری دانرابێت دەبێتە بەردێکی فڕێدراو. هەمان شت بۆ قاچێک کە لەسەر داشبۆرد دانراوە. گرتنی سوکان بە یەک دەست کێشەیەکی هێمنتر دروست دەکات: دەستەکەت چراکانی ئاگادارکردنەوەی داشبۆرد دەشارێتەوە."),
    Q("mech",null,"What is the job of the catalytic converter in the exhaust system?","",
      [O("It cleans the exhaust gases and cuts the toxic ones","","گازەکانی ئەگزۆز پاک دەکاتەوە و ژەهراوییەکان کەم دەکاتەوە"),O("It makes the engine louder","","بزوێنەرەکە دەنگ بەرزتر دەکات"),O("It cools the engine oil","","ڕۆنی بزوێنەر سارد دەکاتەوە")],0,
      "The exhaust runs manifold, pipe, catalytic converter, silencer. The converter reduces the poisonous gases and the silencer reduces the noise — which is why a car must not make a loud exhaust noise to pass inspection.","","ئەرکی کاتالیتیک کۆنڤێرتەر لە سیستەمی دەرکردنی دووکەڵدا چییە؟","ئەگزۆز بەم شێوەیەیە: کۆکەرەوە، لوولە، کاتالیتیک کۆنڤێرتەر، سایلەنسەر. کۆنڤێرتەرەکە گازە ژەهراوییەکان کەم دەکاتەوە و سایلەنسەرەکە دەنگەکە کەم دەکاتەوە — بۆیە ئۆتۆمبیل نابێت دەنگی بەرزی ئەگزۆزی هەبێت بۆ دەرچوون لە پشکنین."),
    Q("mech",null,"Which part raises the battery voltage high enough to fire the engine?","",
      [O("The coil","","کۆیل"),O("The radiator","","ڕادیێتەر"),O("The oil pump","","پەمپی ڕۆن")],0,
      "The electrical system runs battery, starter, coil, alternator, distributor and plugs. The coil steps the battery voltage up so the plugs can spark; the alternator then keeps the battery charged once the engine is running.","","کام بەش ڤۆڵتی باتری بەرز دەکاتەوە تا بزوێنەرەکە پێبکات؟","سیستەمی کارەبایی لە باتری، سلف، کۆیل، داینەمۆ، دیلکۆ و پلاکەکان پێکدێت. کۆیل ڤۆڵتی باتری بەرز دەکاتەوە تا پلاکەکان بتوانن بتروسکێنن؛ پاشان داینەمۆ باتری بارگاوی ڕادەگرێت کاتێک بزوێنەرەکە کاردەکات."),Q("mech",null,"You are jump-starting a car. Where does the last (black) clamp go?","",
      [O("On a bare metal part of the dead car, not on its battery terminal","","لەسەر بەشێکی کانزایی ڕووتی ئۆتۆمبیلە مردووەکە، نەک لەسەر جەمسەری باتری"),O("On the negative terminal of the dead battery","","لەسەر جەمسەری نێگەتیڤی باتریی مردوو"),O("On the positive terminal of the dead battery","","لەسەر جەمسەری پۆزەتیڤی باتریی مردوو")],0,
      "Red to positive on both, black to negative on the good battery, then the last black clamp to bare metal on the dead car — away from the battery, because a charging battery gives off gas and the final connection can spark. Make sure the two cars are not touching.","","خەریکی دانەگیرساندنی ئۆتۆمبیلێکیت. دوایین کێلبەی ڕەش لە کوێ دەبەستێت؟","سوور بۆ پۆزەتیڤی هەردووکیان، ڕەش بۆ نێگەتیڤی باتریە باشەکە، پاشان دوایین کێلبەی ڕەش بۆ کانزای ڕووتی ئۆتۆمبیلە مردووەکە — دوور لە باتری، چونکە باتریی بارگاوی گاز دەردەکات و پەیوەندیی کۆتایی دەتوانێت بتروسکێت. دڵنیابە هەردوو ئۆتۆمبیلەکە بەریەک نەکەوتوون."),
    Q("mech",null,"You will not use the car for more than 15 days. What should you do with the battery?","",
      [O("Disconnect the terminals","","جەمسەرەکانی لێ بکەرەوە"),O("Leave it — it makes no difference","","وازی لێبهێنە — هیچ جیاوازییەکی نییە"),O("Fill it with water","","بە ئاو پڕی بکە")],0,
      "A parked car keeps drawing a trickle of current, so over a couple of weeks the battery can flatten. Handle it carefully in any case: the liquid inside is a strong, poisonous acid — wash it off skin at once.","","زیاتر لە ١٥ ڕۆژ ئۆتۆمبیلەکە بەکارناهێنیت. دەبێت چی بە باتری بکەیت؟","ئۆتۆمبیلی پارککراو بەردەوام کارەبای کەم ڕادەکێشێت، بۆیە لە ماوەی چەند هەفتەیەکدا باتری دەتوانێت بەتاڵ بێت. لە هەر حاڵەتێکدا بەوریایییەوە مامەڵەی لەگەڵ بکە: ئەو شلەیەی ناویدایە ترشێکی بەهێز و ژەهراوییە — یەکسەر لە پێستەوە بیشۆرەوە."),
    Q("mech",null,"When changing a wheel, when should you loosen the wheel nuts?","",
      [O("Before raising the car with the jack","","پێش بەرزکردنەوەی ئۆتۆمبیلەکە بە جەک"),O("After the wheel is off the ground","","دوای ئەوەی ویلەکە لە زەوی جیا دەبێتەوە"),O("It does not matter","","گرنگ نییە")],0,
      "Loosen them while the tyre still grips the ground, or the wheel simply spins. Then park level, apply the handbrake, chock the wheels, and once the spare is on, lay the removed wheel under the car beside the jack — if the jack drops, the car lands on that instead of on you.","","لە کاتی گۆڕینی ویلدا، کەی دەبێت بورغووەکان شل بکەیت؟","پێش بەرزکردنەوەی ئۆتۆمبیلەکە بە جەک. شلیان بکە کاتێک تایەکە هێشتا زەوی دەگرێت، ئەگەرنا ویلەکە تەنها دەسووڕێتەوە. پاشان لە شوێنێکی تەخت پارک بکە، برێکی دەستی دابگرە، ویلەکان ببەستە، و کاتێک تایەی یەدەگ دانرا، ویلە دەرهێنراوەکە لەژێر ئۆتۆمبیلەکە لەتەنیشت جەکەکە دابنێ — ئەگەر جەکەکە بکەوێت، ئۆتۆمبیلەکە لەسەر ئەو دەکەوێت نەک لەسەر تۆ."),
    Q("rules",null,"When may you use main beam (full beam) headlights at night?","",
      [O("Only when there is no vehicle ahead of you or oncoming within about 200 m","","تەنها کاتێک هیچ سوارڕۆیەک لە پێشتەوە یان بەرامبەرت نییە لە ماوەی نزیکەی ٢٠٠ مەتر"),O("At all times after dark","","لە هەموو کاتێکدا دوای تاریکبوون"),O("Only in fog","","تەنها لە تەمدا")],0,
      "Main beam blinds anyone it reaches, so it goes off once a vehicle is within roughly 200 m ahead or coming toward you. A brief flash of it is also the accepted way to warn another driver.","","کەی دەتوانیت بە شەو لایتی بەرز (فوول) بەکاربهێنیت؟","لایتی بەرز هەرکەسێک بگاتێ کوێری دەکات، بۆیە دەکوژێتەوە کاتێک سوارڕۆیەک لە نزیکەی ٢٠٠ مەتری پێشەوە یان بەرامبەرتەوە بێت. تروسکاندنێکی کورتیشی ڕێگەی پەسەندکراوە بۆ ئاگادارکردنەوەی شۆفێرێکی تر."),
    Q("rules",null,"When should the hazard warning lights (four-way flashers) be switched on?","",
      [O("When you stop unexpectedly, when there is danger, or when you break down","","کاتێک بەلەناکاو دەوەستیت، کاتێک مەترسی هەیە، یان کاتێک پەککەوتوویت"),O("Whenever you park anywhere","","هەر کاتێک لە هەر شوێنێک پارک دەکەیت"),O("To thank another driver","","بۆ سوپاسکردنی شۆفێرێکی تر")],0,
      "They mark your car as a hazard others must react to. Use them for an unexpected stop, a danger ahead or a breakdown — not as an excuse to park where you should not.","","کەی دەبێت لایتی ئاگادارکردنەوەی چوارلایەنە (فلاش) دابگیرسێنرێت؟","ئۆتۆمبیلەکەت وەک مەترسییەک دیاری دەکەن کە ئەوانی تر دەبێت کاردانەوەیان هەبێت. بۆ وەستانی لەناکاو، مەترسییەک لە پێشەوە یان پەککەوتن بەکاریان بهێنە — نەک وەک بیانوویەک بۆ پارککردن لەو شوێنەی نابێت."),
    Q("rules",null,"Your car has broken down on an expressway. Where do you place the warning triangle?","",
      [O("At least 50 m behind the car","","بەلایەنی کەم ٥٠ مەتر لە پشت ئۆتۆمبیلەکەوە"),O("Directly behind the bumper","","ڕاست لە پشت بەمپەرەکەوە"),O("On the roof of the car","","لەسەر سەقفی ئۆتۆمبیلەکە")],0,
      "On an expressway or outside a built-up area the triangle goes not less than 50 m back, so traffic has time to react; in town a shorter suitable distance will do. Use the car’s remaining momentum to roll it off the carriageway first, and switch on the hazard lights.","","ئۆتۆمبیلەکەت لەسەر ڕێگای خێرا پەککەوتووە. سێگۆشەی ئاگادارکردنەوە لە کوێ دادەنێیت؟","لەسەر ڕێگای خێرا یان لە دەرەوەی ناوچەی نیشتەجێبوون سێگۆشەکە لانیکەم ٥٠ مەتر لە دواوە دادەنرێت، تا هاتوچۆ کاتی کاردانەوەی هەبێت؛ لە ناو شاردا دوورییەکی گونجاوی کورتتر بەسە. سەرەتا بە جوڵەی ماوەی ئۆتۆمبیلەکە لە ڕێگاکە دەریبهێنە، و لایتی ئاگادارکردنەوە دابگیرسێنە."),
    Q("rules",null,"You are towing another car with a rope. What is the maximum speed?","",
      [O("30 km/h","","٣٠ کم/کاتژمێر"),O("50 km/h","","٥٠ کم/کاتژمێر"),O("The normal limit for the road","","سنووری ئاساییی ڕێگاکە")],0,
      "Towing on a rope is limited to 30 km/h. Both drivers must hold licences, the rope must be a suitable length with a marker tied in the middle so others can see it, and the hazard lights must be on. Outside a built-up area a broken-down vehicle should go on a recovery truck instead.","","بە گوریس ئۆتۆمبیلێکی تر ڕادەکێشیت. زۆرترین خێرایی چەندە؟","ڕاکێشان بە گوریس بە ٣٠ کم/کاتژمێر سنووردارە. هەردوو شۆفێر دەبێت مۆڵەتیان هەبێت، گوریسەکە دەبێت درێژییەکی گونجاوی هەبێت لەگەڵ نیشانەیەک لە ناوەڕاستیدا تا ئەوانی تر بیبینن، و لایتی ئاگادارکردنەوە دەبێت داگیرسێنرێت. لە دەرەوەی ناوچەی نیشتەجێبوون دەبێت سوارڕۆی پەککەوتوو بە ئۆتۆمبیلی هەڵگرتن ببردرێت."),
    Q("mech",null,"What do the colours of the dashboard warning lights tell you?","",
      [O("Green or blue is information, amber needs checking soon, red means stop as soon as it is safe","","سەوز یان شین زانیارییە، زەرد بەزوویی پێویستی بە پشکنینە، سوور واتە هەرکە سەلامەت بوو بوەستە"),O("They are all equally urgent","","هەموویان بە یەک ئەندازە پەلەن"),O("Only red lights matter at all","","تەنها چرا سوورەکان گرنگن")],0,
