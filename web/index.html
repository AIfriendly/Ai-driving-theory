      [O("On the front passenger seat","","لەسەر کورسی پێشەوەی سەرنشین"),O("In a secured crate in the boot","","لە سندووقێکی بەستراو لە پشتەوە"),O("On the back seat in a harness","","لەسەر کورسی دواوە بە قایشێکی تایبەت")],0,
      "A loose animal beside you can distract or physically block you, and in a crash it becomes a projectile. Use a proper crate secured in the boot, or a harness on the back seat, and never leave it in the car in the heat.","","لە ئۆتۆمبیلدا ئاژەڵ هەرگیز نابێت لەکوێ بگوازرێتەوە؟","ئاژەڵێکی بێبەست لە تەنیشتت دەتوانێت سەرقاڵت بکات یان بەربەستت بۆ دروست بکات، و لە ڕوودانێکدا دەبێت بە پەڕتەوازە. سندووقێکی گونجاوی بەستراو لە پشتەوە بەکاربهێنە، یان قایشێکی تایبەت لەسەر کورسی دواوە، و هەرگیز لە گەرمادا لە ئۆتۆمبیلدا بەجێی مەهێڵە."),
    Q("rules",null,"How much sleep does the textbook say a driver needs each night?","",
      [O("7 to 9 hours","","٧ بۆ ٩ کاتژمێر"),O("4 to 5 hours","","٤ بۆ ٥ کاتژمێر"),O("Sleep does not affect driving","","خەو کاریگەری لەسەر لێخوڕین نییە")],0,
      "It appears in the list of what makes someone fit to drive at all, alongside seeing and hearing well, judging several hazards at once, and being in a normal state of mind.","","بەپێی کتێبەکە، شۆفێر هەموو شەوێک چەند خەوی پێویستە؟","ئەمە لە لیستی ئەو شتانەدا دێت کە کەسێک بە تەواوی شیاوی لێخوڕین دەکەن، لەگەڵ باش بینین و بیستن، هەڵسەنگاندنی چەند مەترسییەک لە یەک کاتدا، و بارودۆخێکی دەروونیی ئاسایی."),
    Q("rules",null,"Which of these reduces the risk of fatigue on a long drive?","",
      [O("Keeping the car cool and well ventilated","","ئۆتۆمبیلەکە فێنک و باش هەوادار ڕابگریت"),O("Turning the heating up","","گەرمکەرەوە بەرز بکەیتەوە"),O("Eating a large meal before setting off","","پێش بەڕێکەوتن ژەمێکی گەورە بخۆیت")],0,
      "A warm, stuffy cabin makes you drowsy, and so does a heavy meal. The textbook's list is: rest beforehand, no drowsy medication, no alcohol or drugs, keep the car cool and aired, use sunglasses against glare, and stop for a break.","","کامیان مەترسی ماندووبوون لە گەشتێکی درێژدا کەم دەکاتەوە؟","کابینەیەکی گەرم و بێهەوا خەواڵووت دەکات، ژەمێکی قورسیش هەروەها. لیستی کتێبەکە ئەمانەیە: پێشوەخت پشوو، دەرمانی خەواڵووکەر نا، مەی و ماددەی هۆشبەر نا، ئۆتۆمبیلەکە فێنک و هەوادار ڕابگرە، چاویلکەی خۆر بەکاربهێنە دژی تیشک، و بۆ پشوو بوەستە."),
    // ---- Part 1 re-audit (book pages 22-79): gaps found on a second pass ----
    Q("rules",null,"What are the minimum ages for a motorcycle, a car and a lorry licence?","",
      [O("16 for a motorcycle, 18 for a car, 20 for a lorry","","١٦ بۆ ماتۆڕسکیل، ١٨ بۆ ئۆتۆمبیل، ٢٠ بۆ بارهەڵگر"),O("18 for all three","","١٨ بۆ هەر سێکیان"),O("16 for all three","","١٦ بۆ هەر سێکیان")],0,
      "The textbook prints the three ages together as 16 / 18 / 20. On top of the age you must also have no court conviction for a driving offence and pass the medical examination.","","کەمترین تەمەن بۆ مۆڵەتی ماتۆڕسکیل، ئۆتۆمبیل و بارهەڵگر چەندە؟","کتێبەکە هەر سێ تەمەنەکە پێکەوە چاپ دەکات: ١٦ / ١٨ / ٢٠. جگە لە تەمەن، دەبێت هیچ حوکمێکی دادگات لەسەر نەبێت بە تاوانێکی لێخوڕین و لە پشکنینی پزیشکی دەربچیت."),
    Q("rules",null,"What do the yellow criss-cross markings painted across a junction mean?","",
      [O("Do not enter unless your exit is clear","","مەچۆ ناوی مەگەر دەرچوونەکەت بەتاڵ بێت"),O("You may park inside them","","دەتوانیت لە ناویاندا پارک بکەیت"),O("They mark a pedestrian crossing","","شوێنی پەڕینەوەی پیادە دەستنیشان دەکەن")],0,
      "The box exists to stop the junction being blocked. Even on a green light you must not move into it if the traffic ahead means you would have to stop inside — the exception in most codes is when you are waiting to turn and only oncoming traffic is holding you up.","","ئەو هێڵە زەردە خاچەکێشکراوانەی بەسەر یەکتربڕدا کێشراون چی دەگەیەنن؟","سندووقەکە بۆ ئەوە هەیە کە ڕێگە لە بەستنی یەکتربڕەکە بگرێت. تەنانەت لە چرای سەوزیشدا نابێت بچیتە ناوی ئەگەر هاتوچۆی پێشەوە واتای ئەوە بێت کە دەبێت لە ناویدا بوەستیت — لە زۆربەی یاساکاندا تەنها ئەو کاتە نەبێت کە چاوەڕێی سووڕانەوەیت و تەنها هاتوچۆی بەرامبەر ڕایگرتوویت."),
    Q("rules",null,"On a set of traffic lights, which lamp is always at the top?","",
      [O("The red one — green is always at the bottom","","سوورەکە — سەوز هەمیشە لە خوارەوەیە"),O("The green one","","سەوزەکە"),O("It varies from junction to junction","","لە یەکتربڕێکەوە بۆ یەکێکی تر دەگۆڕێت")],0,
      "The order is fixed so the lights can still be read by someone who cannot distinguish the colours, and so a driver knows which lamp is lit from its position alone. On pedestrian lights the red is a standing figure and the green a walking one.","","لە کۆمەڵە چرایەکی هاتوچۆدا، کام چرا هەمیشە لە سەرەوەیە؟","ڕیزبەندییەکە جێگیرە تا ئەو کەسەش بتوانێت چراکان بخوێنێتەوە کە ناتوانێت ڕەنگەکان لێک جیا بکاتەوە، و تا شۆفێر تەنها لە جێگاکەیەوە بزانێت کام چرا داگیرساوە. لە چرای پیادەدا سوورەکە کەسێکی وەستاوە و سەوزەکە کەسێکی ڕۆیشتووە."),
    Q("rules",null,"Why do some pedestrian crossings make a sound when the light changes?","",
      [O("So blind pedestrians know when it is safe to cross","","تا پیادەی نابینا بزانێت کەی پەڕینەوە سەلامەتە"),O("To warn drivers to stop","","تا شۆفێران ئاگادار بکاتەوە بوەستن"),O("To tell pedestrians to hurry","","تا بە پیادە بڵێت پەلە بکات")],0,
      "The tone carries the same information as the green figure to someone who cannot see it. Never block a crossing or hurry someone who is relying on it.","","بۆچی هەندێک شوێنی پەڕینەوەی پیادە کاتێک چراکە دەگۆڕێت دەنگ دەردەکات؟","دەنگەکە هەمان زانیاری وێنەی سەوز دەگەیەنێت بەو کەسەی ناتوانێت بیبینێت. هەرگیز شوێنی پەڕینەوە مەبەستە و پەلە مەکە لەو کەسەی پشتی پێی بەستووە."),
    Q("rules",null,"A deaf pedestrian is about to step into the road. Why is this a particular risk?","",
      [O("They may not hear your horn or your engine","","لەوانەیە بۆری یان دەنگی بزوێنەرەکەت نەبیستن"),O("They cross faster than others","","خێراتر لە کەسانی تر دەپەڕنەوە"),O("They always have a companion","","هەمیشە هاوڕێیەکیان لەگەڵدایە")],0,
      "Sounding the horn achieves nothing, so you must slow down and be ready to stop instead. The same section lists wheelchair users, whose lower eye level means they may not see you either.","","پیادەیەکی کەڕ خەریکە پێ بنێتە سەر ڕێگا. بۆچی ئەمە مەترسییەکی تایبەتە؟","بۆری لێدان هیچ سوودێکی نییە، بۆیە دەبێت لەبری ئەوە خێرایی کەم بکەیتەوە و ئامادە بیت بۆ وەستان. هەمان بەش باسی بەکارهێنەرانی کورسی چەرخدارە دەکات، کە بەهۆی نزمی ئاستی چاویانەوە لەوانەیە ئەوانیش نەتبینن."),
    Q("rules",null,"May a passenger give hand signals to other traffic on the driver's behalf?","",
      [O("No — signalling is the driver's job alone","","نەخێر — ئاماژەدان تەنها ئەرکی شۆفێرە"),O("Yes, if the driver is busy","","بەڵێ، ئەگەر شۆفێر سەرقاڵ بێت"),O("Yes, when turning right","","بەڵێ، لە کاتی سووڕانەوە بۆ لای ڕاست")],0,
      "Two people signalling gives other road users contradictory information about what the car will do. The same list bans leaning any part of the body out, distracting the driver with conversation, and blocking the driver's view with luggage.","","ئایا بۆ سەرنشین هەیە لە جیاتی شۆفێر ئاماژە بە دەست بۆ هاتوچۆی تر بکات؟","دوو کەس کە ئاماژە بدەن زانیاری پێچەوانە دەدەنە بەکارهێنەرانی تری ڕێگا سەبارەت بەوەی ئۆتۆمبیلەکە چی دەکات. هەمان لیست قەدەغە دەکات هیچ بەشێکی جەستە بخرێتە دەرەوە، شۆفێر بە قسەکردن سەرقاڵ بکرێت، یان دیمەنی شۆفێر بە کەلوپەل داپۆشرێت."),
    Q("signs",null,"Traffic signs are grouped into lettered families A to H. What does family A cover?","",
      [O("Warning signs","","هێمای وریاکردنەوە"),O("Prohibition signs","","هێمای قەدەغەکردن"),O("Information and service signs","","هێمای زانیاری و خزمەتگوزاری")],0,
      "A warning, B priority, C prohibition or restriction, D mandatory and direction, E special regulation, F information and services, G direction and place, H supplementary plates. Iraq and the Kurdistan Region follow the international convention, which is why these shapes look the same abroad.","","هێماکانی هاتوچۆ لە خێزانی پیتداری A بۆ H دابەش کراون. خێزانی A چی لەخۆدەگرێت؟","A وریاکردنەوە، B پێشڕەوی، C قەدەغەکردن یان سنووردارکردن، D ناچارکردن و ئاراستە، E ڕێکخستنی تایبەت، F زانیاری و خزمەتگوزاری، G ئاراستە و شوێن، H تابلۆی ژێر هێما. عێراق و هەرێمی کوردستان پابەندن بە ڕێککەوتننامە نێودەوڵەتییەکە، بۆیە ئەم شێوانە لە دەرەوەش وەک یەک دەبن."),
    Q("rules",null,"You have just got off a bus and need to cross behind it. What should you do?","",
      [O("Wait until the bus has moved away so you can see the road","","چاوەڕێ بکە تا پاسەکە دوور دەکەوێتەوە تا بتوانیت ڕێگاکە ببینیت"),O("Cross quickly behind the bus","","بە خێرایی لە پشت پاسەکەوە بپەڕەوە"),O("Cross in front of the bus","","لە بەردەم پاسەکەوە بپەڕەوە")],0,
      "A stationary bus hides you from every driver on the road and hides the road from you. The same rule says never to board or alight until the vehicle has come to a complete stop.","","تازە لە پاسێک دابەزیویت و پێویستە لە پشتیەوە بپەڕیتەوە. چی دەکەیت؟","پاسێکی وەستاو تۆ لە هەموو شۆفێرێکی سەر ڕێگا دەشارێتەوە و ڕێگاکەش لە تۆ دەشارێتەوە. هەمان یاسا دەڵێت هەرگیز سەرمەکەوە و دامەبەزە پێش ئەوەی ئۆتۆمبیلەکە بە تەواوی بوەستێت."),
    Q("rules",null,"The broken white line down the middle of the road suddenly has much longer dashes. What does that mean?","",
      [O("It is a warning line — a hazard is coming up","","هێڵی ئاگادارکردنەوەیە — مەترسییەک لە پێشەوەیە"),O("Overtaking is now compulsory","","ئێستا تێپەڕاندن پێویستە"),O("The road is about to become one-way","","ڕێگاکە خەریکە یەک ئاراستە بێت")],0,
      "Ordinary short dashes mean you may overtake and change lane. When the painted sections lengthen and the gaps shorten, the line is telling you a hazard is near — a bend, a junction or a crest — so it is the wrong place to start an overtake even though crossing it is not yet forbidden.","","هێڵە سپییە پچڕپچڕەکەی ناوەڕاستی ڕێگا لەناکاو پچڕەکانی زۆر درێژتر دەبن. ئەمە چی دەگەیەنێت؟","پچڕە کورتە ئاساییەکان واتای ئەوەیە دەتوانیت تێپەڕێنیت و لەین بگۆڕیت. کاتێک بەشە بۆیاخکراوەکان درێژتر و بۆشاییەکان کورتتر دەبن، هێڵەکە پێت دەڵێت مەترسییەک نزیکە — پێچێک، یەکتربڕێک یان بەرزاییەک — بۆیە شوێنێکی هەڵەیە بۆ دەستپێکردنی تێپەڕاندن هەرچەندە بەزاندنی هێشتا قەدەغە نەکراوە."),
    Q("rules",null,"Which way do you travel round a roundabout, and who has priority?","",
      [O("Anticlockwise, and traffic already on the roundabout has priority","","بە پێچەوانەی میلی کاتژمێر، و ئەو هاتوچۆیەی پێشتر لەسەر فەلەکەیە پێشڕەوی هەیە"),O("Clockwise, and the vehicle entering has priority","","بە ئاراستەی میلی کاتژمێر، و ئەوەی دەچێتە ناوی پێشڕەوی هەیە"),O("Either way, whichever is shorter","","هەر لایەک، کامیان کورتترە")],0,
      "The textbook lists five reasons roundabouts exist: fewer head-on collisions than a crossroads, less risk from speeding, less fuel used, less pollution, and easier, faster flow. All of that depends on everyone circulating the same way and yielding to those already on it.","","بە کام ئاراستەدا بە فەلەکەدا دەسووڕێیتەوە، و پێشڕەوی بۆ کێیە؟","کتێبەکە پێنج هۆکار بۆ بوونی فەلەکە دەژمێرێت: پێکدادانی ڕووبەڕووی کەمتر لە چوارڕیانێک، مەترسی کەمتر لە خێرایی زۆر، سووتەمەنی کەمتر، پیسبوونی کەمتر، و هاتوچۆیەکی ئاسانتر و خێراتر. هەموو ئەمانە بەوەوە بەندە کە هەموو کەس بە هەمان ئاراستە بسووڕێتەوە و ڕێگە بەوانە بدات کە پێشتر لەسەرین."),
    Q("rules",null,"You are turning left at a junction with three lanes. Which lane do you take?","",
      [O("The middle lane","","لەینی ناوەڕاست"),O("The right-hand lane","","لەینی لای ڕاست"),O("Any lane you like","","هەر لەینێک کە حەزت لێیە")],0,
      "With three lanes the middle one is the left-turn lane; with only two, you take the left-hand lane. Where the road carries no lane markings at all, judge your position from the width of the road and keep to the left — but never cross an unbroken line to do it.","","لە یەکتربڕێکی سێ لەینیدا بۆ لای چەپ دەپێچیتەوە. کام لەین دەگریت؟","لەگەڵ سێ لەیندا ئەوەی ناوەڕاست لەینی پێچانەوەیە بۆ چەپ؛ لەگەڵ دوو لەین، لەینی لای چەپ دەگریت. لەو ڕێگایانەی هیچ هێڵکاری لەین نییە، بەپێی پانی ڕێگاکە شوێنی خۆت هەڵسەنگێنە و بدە بە لای چەپ — بەڵام هەرگیز بۆ ئەمە هێڵی نەپچڕاو مەبەزێنە."),
    Q("rules",null,"There is no stop line painted at the junction. Where do you stop?","",
      [O("Before the pedestrian crossing lines — or far enough back for people to cross","","پێش هێڵەکانی پەڕینەوەی پیادە — یان بەقەدەر پێویست دواوە تا خەڵک بتوانن بپەڕنەوە"),O("As far forward as you can see","","تا ئەو شوێنەی دەتوانیت ببینیت"),O("In the middle of the junction","","لە ناوەڕاستی یەکتربڕەکەدا")],0,
      "There is an order to it: stop at the marked stop line; if there is none, stop before the crossing markings; if there is neither, stop a sensible distance back so pedestrians still have room to cross.","","هیچ هێڵی وەستانێک لە یەکتربڕەکەدا نەکێشراوە. لەکوێ دەوەستیت؟","ڕیزبەندییەکی هەیە: لەسەر هێڵی وەستانی دیاریکراو بوەستە؛ ئەگەر نەبوو، پێش هێڵەکانی پەڕینەوە بوەستە؛ ئەگەر هیچیان نەبوو، مەودایەکی گونجاو دواوە بوەستە تا هێشتا شوێن بۆ پیادەکان بمێنێتەوە بۆ پەڕینەوە."),
    Q("rules",null,"You have stopped at a STOP sign. What is the correct order of looking?","",
      [O("Right, then left, then right again","","ڕاست، پاشان چەپ، پاشان دیسان ڕاست"),O("Only straight ahead","","تەنها ڕاست بەرەو پێشەوە"),O("Left only","","تەنها چەپ")],0,
      "A STOP sign means a complete halt, not a roll-through — and the last look goes back to the right because that is the direction the nearest danger will come from. GIVE WAY is different: you need not stop if the road is genuinely clear.","","لەبەردەم هێمای STOP وەستاویت. ڕیزبەندی دروستی سەیرکردن چییە؟","هێمای STOP واتای وەستانێکی تەواوە، نەک بەسەریدا ڕۆیشتن — و دوا سەیرکردن دەگەڕێتەوە بۆ لای ڕاست چونکە نزیکترین مەترسی لەو لاوە دێت. GIVE WAY جیاوازە: ئەگەر ڕێگاکە بەڕاستی بەتاڵ بێت پێویست ناکات بوەستیت."),
    Q("rules",null,"Where is parking specifically forbidden, according to the textbook's list?","",
      [O("Within 10 m of a junction corner and within 5 m before a crossing","","لە ماوەی ١٠ مەتری گۆشەی یەکتربڕ و لە ماوەی ٥ مەتر پێش شوێنی پەڕینەوە"),O("Only where a no-parking sign is displayed","","تەنها لەو شوێنانەی هێمای قەدەغەی پارککردن هەیە"),O("Only on main roads","","تەنها لەسەر ڕێگا سەرەکییەکان")],0,
      "The list runs to twenty places and also bans parking on the left-hand side of the road, alongside another parked car, in front of schools and mosques, at dropped kerbs, in disabled bays and anywhere that hides a sign. In a tunnel, stopping is only ever for a breakdown.","","بەپێی لیستی کتێبەکە، لەکوێ پارککردن بە تایبەتی قەدەغەیە؟","لیستەکە بیست شوێن دەگرێتەوە و هەروەها پارککردن لە لای چەپی ڕێگا، لەتەنیشت ئۆتۆمبیلێکی تری پارککراو، لەبەردەم قوتابخانە و مزگەوت، لەسەر لێواری نزمکراوە، لە شوێنی تایبەت بە کەمئەندامان و هەر شوێنێک کە هێمایەک دەشارێتەوە قەدەغە دەکات. لە تونێلدا وەستان تەنها بۆ پەککەوتنە."),
    Q("rules",null,"How far from the kerb should your car be when you finish parking?","",
      [O("No more than 30 cm","","زیاتر لە ٣٠ سم نەبێت"),O("About one metre","","نزیکەی یەک مەتر"),O("It does not matter","","گرنگ نییە")],0,
      "The same 30 cm applies whether you park parallel, at 45 degrees or at 90 degrees. Parking further out narrows the road for everyone else and leaves your car exposed to passing traffic.","","کاتێک پارککردن تەواو دەکەیت، دەبێت ئۆتۆمبیلەکەت چەند لە لێوارەوە دوور بێت؟","هەمان ٣٠ سم جێبەجێ دەبێت جا بە هێڵی هاوتەریب پارک بکەیت، بە گۆشەی ٤٥ یان بە گۆشەی ٩٠. پارککردنی دوورتر ڕێگاکە بۆ هەموو کەسێکی تر تەسک دەکاتەوە و ئۆتۆمبیلەکەت لەبەردەم هاتوچۆی تێپەڕیودا بەجێدەهێڵێت."),
    Q("rules",null,"When may you NOT overtake?","",
      [O("When the driver behind has already started to overtake you","","کاتێک شۆفێری دواوە پێشتر دەستی کردووە بە تێپەڕاندنی تۆ"),O("Whenever the road ahead is straight","","هەر کاتێک ڕێگای پێشەوە ڕاست بێت"),O("Only when a sign forbids it","","تەنها کاتێک هێمایەک قەدەغەی دەکات")],0,
      "The textbook's list is long: not near crossings or junctions, not on bends, crests, dips, bridges or level crossings, not at a solid line, not when it would force another driver to change speed or direction, not when the car ahead is already overtaking, not if you would have to break the speed limit, and not when visibility is poor.","","کەی نابێت تێپەڕاندن بکەیت؟","لیستی کتێبەکە درێژە: نزیک شوێنی پەڕینەوە و یەکتربڕ نا، لەسەر پێچ، بەرزایی، نشێو، پرد و پەڕینەوەی شەمەندەفەر نا، لەلای هێڵی نەپچڕاو نا، کاتێک شۆفێرێکی تر ناچار دەکات خێرایی یان ئاراستەی بگۆڕێت نا، کاتێک ئۆتۆمبیلی پێشەوە خۆی خەریکی تێپەڕاندنە نا، ئەگەر ناچار بیت سنووری خێرایی ببەزێنیت نا، و کاتێک ڕوونی خراپە نا."),
    Q("rules",null,"You are reversing in a straight line. What is the correct technique?","",
      [O("Left hand on the wheel, turn and look back through the rear window","","دەستی چەپ لەسەر سوکان، بسووڕێوە و لە جامی دواوەوە سەیری دواوە بکە"),O("Rely only on the mirrors","","تەنها پشت بە ئاوێنەکان ببەستە"),O("Reverse quickly to spend less time","","بە خێرایی بگەڕێوە تا کاتی کەمتر بەسەربەریت")],0,
      "Turn in your seat with your right arm over the passenger seat back and look out of the rear window, glancing at both mirrors as you go. Move slowly, and look forward every so often — the front of the car swings out as you steer.","","بە هێڵێکی ڕاست بە دواوە دەگەڕێیتەوە. شێوازی دروست چییە؟","لەسەر کورسییەکە بسووڕێوە، باڵی ڕاستت بخە سەر پشتی کورسی سەرنشین و لە جامی دواوەوە سەیر بکە، لە هەمان کاتدا چاو بە هەردوو ئاوێنەدا بخشێنە. بە هێواشی بجوڵێ، و هەر لە ماوەیەکدا سەیری پێشەوە بکە — پێشەوەی ئۆتۆمبیلەکە بە ئاراستەکردن دەردەچێت."),
    Q("rules",null,"You are reversing a car with a trailer attached. What must you avoid?","",
      [O("Turning the wheel more than a quarter to a half turn","","سوکانەکە زیاتر لە چارەکێک تا نیوێک بسووڕێنیت"),O("Having someone guide you","","کەسێک ڕێنماییت بکات"),O("Going slowly","","بە هێواشی بڕۆیت")],0,
      "A large steering input folds the trailer against the car — the jack-knife — and once it starts you cannot correct it by steering more. Never reverse faster than walking pace, and have someone stand where they can see and signal to you.","","بە ئۆتۆمبیلێکی کەرەفانەی پێوەبەستراوەوە بە دواوە دەگەڕێیتەوە. لە چی دەبێت خۆت بپارێزیت؟","سووڕاندنێکی گەورەی سوکان کەرەفانەکە دەلکێنێت بە ئۆتۆمبیلەکەوە — مەقەس — و کاتێک دەست پێدەکات بە زیاتر ئاراستەکردن ناتوانیت چاکی بکەیتەوە. هەرگیز خێراتر لە خێرایی ڕۆیشتنی پیادە بە دواوە مەگەڕێوە، و کەسێک لەو شوێنە ڕابگرە کە دەتوانێت ببینێت و ئاماژەت پێبدات."),
    Q("rules",null,"Why does the textbook say a driver crossing a border must check the local speed limits?","",
      [O("There is no international agreement — every country sets its own","","هیچ ڕێککەوتنێکی نێودەوڵەتی نییە — هەر وڵاتێک هی خۆی دیاری دەکات"),O("Speed limits are the same everywhere","","سنووری خێرایی لە هەموو شوێنێک وەک یەکە"),O("Only motorway limits differ","","تەنها سنووری ڕێگای خێرا جیاوازە")],0,
      "Geography, weather and the state of the roads differ, so the limits do too. The one thing agreed internationally is the board at each country's border that sets out its limits for visitors — which is exactly what the KURDISTAN panel does.","","بۆچی کتێبەکە دەڵێت شۆفێرێک کە سنوور دەبڕێت دەبێت سنووری خێرایی ناوخۆیی بپشکنێت؟","جوگرافیا، کەشوهەوا و دۆخی ڕێگاکان جیاوازن، بۆیە سنوورەکانیش. تەنها شتێک کە بە نێودەوڵەتی ڕێککەوتراوە ئەو تابلۆیەیە لە سنووری هەر وڵاتێکدا کە سنوورەکانی بۆ سەردانکەران ڕوون دەکاتەوە — کە هەر ئەوەیە پانێڵی KURDISTAN دەیکات."),
    Q("mech",null,"How old should a tyre be when you fit it?","",
      [O("Not more than two years old","","زیاتر لە دوو ساڵ نەبێت"),O("Age does not matter if the tread is deep","","تەمەن گرنگ نییە ئەگەر نەخشەکە قووڵ بێت"),O("Up to ten years old","","تا دە ساڵ")],0,
      "Rubber hardens and cracks with age even on a tyre that has never been used, so a deep tread on an old tyre still grips poorly. The DOT code gives the week and year — 0321 means week 3 of 2021. Buses and lorries are held to a tighter limit of about 20 months.","","تایە دەبێت چەند تەمەنی بێت کاتێک دایدەنێیت؟","لاستیک بە تێپەڕبوونی کات ڕەق دەبێت و دەشکێت تەنانەت لە تایەیەکیشدا کە هەرگیز بەکارنەهاتووە، بۆیە نەخشێکی قووڵ لەسەر تایەیەکی کۆن هێشتا خراپ دەگرێت. کۆدی DOT هەفتە و ساڵ دەدات — ٠٣٢١ واتە هەفتەی ٣ی ٢٠٢١. پاس و بارهەڵگر بە سنوورێکی توندتری نزیکەی ٢٠ مانگەوە بەستراون."),
    Q("mech",null,"You are changing a wheel at the roadside. What should you do before raising the jack?","",
      [O("Loosen the wheel nuts while the tyre is still on the ground","","بۆڵۆنەکانی تایە شل بکە لە کاتێکدا تایەکە هێشتا لەسەر زەوییە"),O("Remove the nuts completely","","بۆڵۆنەکان بە تەواوی لابەرە"),O("Start the engine","","بزوێنەر خاو بکەرەوە")],0,
      "A wheel in the air simply turns when you push on the wrench. Chock the wheels, empty the boot before you jack, and lay the spare under the car beside the jack — if the jack gives way, the car lands on the spare and not on you.","","لە لێواری ڕێگادا تایە دەگۆڕیت. پێش بەرزکردنەوەی جەک چی دەکەیت؟","تایەیەک کە لە هەوادا بێت کاتێک فشار دەخەیتە سەر دەسکەکە بە سادەیی دەسووڕێتەوە. تایەکان ببەستە، پێش جەک سندووقەکە بەتاڵ بکە، و تایەی یەدەگ بخە ژێر ئۆتۆمبیلەکە لەتەنیشت جەکەکە — ئەگەر جەکەکە شکا، ئۆتۆمبیلەکە دەکەوێتە سەر تایە یەدەگەکە نەک بەسەر تۆدا."),
    // ---- Part 2 full re-audit (book 164-224): gaps found on the second pass ----
    Q("rules",null,"A dust storm closes in while you are driving. What does the textbook tell you to do?","",
      [O("Slow down, put the hazard lights on and stop somewhere safe","","خێرایی کەم بکەرەوە، هێمای وریاکردنەوە دابگیرسێنە و لە شوێنێکی سەلامەت بوەستە"),O("Speed up to get through it","","خێرایی زیاد بکە تا لێی دەربازبیت"),O("Carry on at the same speed with the windows open","","بە هەمان خێرایی بەردەوام بە و پەنجەرەکان بکەرەوە")],0,
      "Dust storms are commonest in late summer and autumn. Once stopped, close the doors and windows, expect the strong wind that usually comes with the dust, and wait until visibility is genuinely back to normal before moving off. Better still, check the forecast and arrive before it hits.","","لە کاتی لێخوڕیندا ڕەشەبای تۆز دێت. کتێبەکە دەڵێت چی بکەیت؟","ڕەشەبای تۆز زۆرتر لە کۆتایی هاوین و پاییزدا ڕوودەدات. دوای وەستان، دەرگا و پەنجەرەکان دابخە، چاوەڕێی ئەو بای بەهێزە بە کە بەزۆری لەگەڵ تۆزەکەدا دێت، و چاوەڕێ بکە تا ڕوونی بەڕاستی دەگەڕێتەوە پێش ئەوەی بەڕێکەویت. لەوەش باشتر، هەواسەنجی بپشکنە و پێش هاتنی بگە."),
    Q("rules",null,"What does extreme summer heat do to the road surface?","",
      [O("It softens the asphalt and makes it slippery","","قیرەکە نەرم دەکات و خلیسک دەبێت"),O("It makes the surface grip better","","وا دەکات ڕووی ڕێگا باشتر بگرێت"),O("It has no effect on the road","","هیچ کاریگەرییەکی لەسەر ڕێگا نییە")],0,
      "Softened asphalt is a real hazard in the hottest part of the year. Glare is the other summer danger — if the sun is straight in your eyes, slow down or stop, and keep sunglasses in the car.","","گەرمای زۆری هاوین چی بە ڕووی ڕێگا دەکات؟","قیری نەرمبوو لە گەرمترین بەشی ساڵدا مەترسییەکی ڕاستەقینەیە. تیشکی خۆر مەترسی هاوینەی تریشە — ئەگەر خۆر ڕاستەوخۆ لە چاوتدایە، خێرایی کەم بکەرەوە یان بوەستە، و چاویلکەی خۆر لە ئۆتۆمبیلدا هەڵبگرە."),
    Q("rules",null,"An ambulance is coming up behind you on a multi-lane road. Which lane should you clear?","",
      [O("The left-hand lane","","لەینی لای چەپ"),O("The right-hand lane","","لەینی لای ڕاست"),O("Stop wherever you are","","لە هەر شوێنێک بیت بوەستە")],0,
      "Emergency vehicles run down the left-hand lane, so that is the one to get out of. Stopping dead in the middle of the road helps nobody — move over and keep going until it is safe to let them past.","","ئەمبولانسێک لە دواتەوە دێت لەسەر ڕێگایەکی چەند لەینی. کام لەین چۆڵ دەکەیت؟","ئۆتۆمبیلی فریاکەوتن بە لەینی لای چەپدا دەڕۆن، بۆیە ئەوەیە کە دەبێت لێی دەربچیت. وەستانێکی لەناکاو لە ناوەڕاستی ڕێگادا یارمەتی کەس نادات — بدە بەلاوە و بەردەوام بە تا سەلامەت دەبێت ڕێگەیان پێبدەیت."),
    Q("rules",null,"You crash and can smell petrol or burning. What do you do?","",
      [O("Get out of the car immediately","","دەستبەجێ لە ئۆتۆمبیلەکە وەرە دەرەوە"),O("Stay in the car until help arrives","","لە ئۆتۆمبیلەکەدا بمێنەوە تا یارمەتی دێت"),O("Open the bonnet to look","","بۆنیت بکەرەوە و سەیر بکە")],0,
      "Normally the advice is to stay in the car if it is safe, but the smell of fuel or burning cancels that at once. Get everyone out and well clear before you do anything else.","","تووشی ڕوودان دەبیت و بۆنی بەنزین یان سووتان دەکەیت. چی دەکەیت؟","بەئاسایی ئامۆژگاری ئەوەیە لە ئۆتۆمبیلەکەدا بمێنیتەوە ئەگەر سەلامەت بێت، بەڵام بۆنی سووتەمەنی یان سووتان دەستبەجێ ئەوە هەڵدەوەشێنێتەوە. پێش هەموو شتێک هەموو کەسێک بێنە دەرەوە و باش دووریان بخەرەوە."),
    Q("firstaid",null,"You are calling the emergency services from a crash. What should you say first?","",
      [O("Who you are, then the location, the type of crash and the number of casualties","","خۆت بناسێنە، پاشان شوێنەکە، جۆری ڕوودانەکە و ژمارەی بریندارەکان"),O("Just ask them to hurry","","تەنها داوایان لێبکە پەلە بکەن"),O("Describe each injury in detail first","","سەرەتا هەر برینێک بە وردی باس بکە")],0,
      "Look at the scene before you dial — how many vehicles, how many people hurt — so you can give it in one go. Mention any fire risk. If others are there, ask one of them to call as well.","","لە شوێنی ڕوودانێکەوە پەیوەندی بە فریاکەوتنەوە دەکەیت. سەرەتا چی دەڵێیت؟","پێش پەیوەندیکردن سەیری شوێنەکە بکە — چەند ئۆتۆمبیل، چەند کەس بریندار — تا بە یەک جار بیڵێیت. باسی هەر مەترسییەکی ئاگر بکە. ئەگەر کەسانی تر لەوێن، داوا لە یەکێکیان بکە ئەویش پەیوەندی بکات."),
    Q("firstaid",null,"A casualty is lying on the road. How can your own car help?","",
      [O("Park it as a barrier between them and oncoming traffic","","وەک بەربەستێک لە نێوان ئەوان و هاتوچۆی بەرامبەردا پارکی بکە"),O("Use it to carry them straight to hospital","","بەکاری بهێنە بۆ گواستنەوەیان ڕاستەوخۆ بۆ نەخۆشخانە"),O("Park it well out of the way","","باش لە ڕێگا دووری بخەرەوە")],0,
      "Standing over someone on live carriageway is how first-aiders become casualties. Positioned correctly, with the hazard lights on, the car shields the scene while you work.","","بریندارێک لەسەر ڕێگا کەوتووە. ئۆتۆمبیلەکەی خۆت چۆن یارمەتی دەدات؟","وەستان بەسەر کەسێکدا لەسەر ڕێگایەکی کراوە هەر ئەوەیە کە فریاگوزار دەکاتە قوربانی. بە جێگیرکردنی دروست و کردنەوەی هێمای وریاکردنەوە، ئۆتۆمبیلەکە شوێنەکە دەپارێزێت لە کاتی کارکردنتدا."),
    Q("firstaid",null,"A crowd is gathering around an injured person. What should you do?","",
      [O("Try to move them back","","هەوڵبدە دووریان بخەیتەوە"),O("Let them stay — more help is better","","بیانهێڵە — یارمەتی زیاتر باشترە"),O("Ask them to lift the casualty","","داوایان لێبکە برینداری هەڵبگرن")],0,
      "A crowd frightens the casualty and blocks the paramedics when they arrive. And once the medical team is there, step back yourself and let the people who are trained get on with it.","","خەڵکێک لە دەوری کەسێکی بریندار کۆدەبنەوە. چی دەکەیت؟","کۆمەڵێک خەڵک برینداری دەتۆقێنێت و ڕێگا لە تیمی فریاگوزاری دەگرێت کاتێک دەگەن. و کاتێک تیمی پزیشکی گەیشت، خۆشت بکشێرەوە دواوە و با ئەوانەی ڕاهێنراون کارەکە بکەن."),
    Q("firstaid",null,"Someone has heavy bleeding from an arm or a leg. What helps?","",
      [O("Raise the limb so less blood flows to it","","ئەندامەکە بەرز بکەرەوە تا خوێنی کەمتری بۆ دەڕوات"),O("Lower it below the body","","لە ئاستی جەستە نزمتری بکەرەوە"),O("Rub the limb to warm it","","ئەندامەکە بخوڕە تا گەرم بێت")],0,
      "Raising the limb reduces the blood reaching it while you press on the wound. Put gloves on first if you have them, and keep the casualty calm — fear and panic make bleeding worse.","","کەسێک خوێنبەربوونێکی زۆری لە باڵ یان قاچ هەیە. چی سوودی هەیە؟","بەرزکردنەوەی ئەندامەکە ئەو خوێنە کەم دەکاتەوە کە پێی دەگات لە کاتێکدا تۆ پەستان لەسەر برینەکە دەدەیت. ئەگەر هەتە سەرەتا دەستکێش بکە دەستت، و برینداری ئارام ڕابگرە — ترس و شڵەژان خوێنبەربوون خراپتر دەکەن."),
    Q("firstaid",null,"A casualty has an injured eye. What must you not do?","",
      [O("Wash or clean it — just cover it with a clean soft cloth","","بیشۆیت یان پاکی بکەیتەوە — تەنها بە پارچە قوماشێکی پاک و نەرم دایپۆشە"),O("Cover it with a clean cloth","","بە پارچە قوماشێکی پاک دایپۆشە"),O("Keep the casualty calm","","برینداری ئارام ڕابگریت")],0,
      "Washing an injured eye can drive debris deeper and damage it further. Cover it gently and leave it to the hospital.","","برینداریک چاوی بریندار بووە. چی نابێت بکەیت؟","شوشتنی چاوێکی بریندار دەتوانێت پاشماوە قووڵتر ببات و زیانی زیاتری پێبگەیەنێت. بە نەرمی دایپۆشە و بیهێڵەرەوە بۆ نەخۆشخانە."),
    Q("firstaid",null,"Blood is coming from a casualty's ear or mouth after a crash. What does that suggest?","",
      [O("Internal injury — call 122 at once","","برینداری ناوەکی — دەستبەجێ پەیوەندی بە ١٢٢ بکە"),O("A minor cut inside the mouth","","بڕینێکی سووکی ناو دەم"),O("Nothing serious","","هیچی گرنگ نییە")],0,
      "Bleeding from an orifice — nose, ear or mouth — points to damage you cannot see. Other signs of internal bleeding are swelling and blue skin, a fast heart rate, rapid breathing, thirst and dizziness.","","دوای ڕوودانێک خوێن لە گوێ یان دەمی برینداریکەوە دێت. ئەمە چی دەگەیەنێت؟","خوێنبەربوون لە کونێکەوە — لووت، گوێ یان دەم — ئاماژەیە بۆ زیانێک کە نایبینیت. نیشانەکانی تری خوێنبەربوونی ناوەکی: ئاوسان و شینبوونەوەی پێست، خێرابوونی لێدانی دڵ، هەناسەی خێرا، تینوویەتی و سەرگێژە."),
    Q("firstaid",null,"You suspect internal bleeding. How should the casualty lie?","",
      [O("On their back with the legs raised to about chest level","","لەسەر پشت و قاچەکان بەرز کراونەتەوە تا نزیکەی ئاستی سنگ"),O("Sitting upright","","بە ڕاستی دانیشتوو"),O("On their front","","لەسەر ڕوو")],0,
      "Raising the legs keeps blood going to the vital organs. Keep them calm, give absolutely nothing by mouth, and call 122 straight away.","","گومانت لە خوێنبەربوونی ناوەکی هەیە. برینداری چۆن دەبێت ڕابکشێت؟","بەرزکردنەوەی قاچەکان وا دەکات خوێن بەردەوام بێت بۆ ئەندامە گرنگەکان. ئارامیان ڕابگرە، بە هیچ شێوەیەک شتێکیان بە دەم مەدە، و دەستبەجێ پەیوەندی بە ١٢٢ بکە."),
    Q("firstaid",null,"After a snake or scorpion bite, what useful thing can you do while waiting for help?","",
      [O("Mark the bite site and how far the swelling has reached","","شوێنی پێوەدانەکە و ئەوەی ئاوسانەکە تا کوێ گەیشتووە نیشانە بکە"),O("Tie a band above the bite","","بەندێک لەسەرووی پێوەدانەکەوە ببەستە"),O("Give them hot sweet tea","","چای گەرمی شیرینیان بدەرێ")],0,
      "Marking the edge of the swelling shows the medical team how fast the venom is spreading. Never bind, cut, suck or ice the bite, and give no coffee, tea or alcohol.","","دوای پێوەدانی مار یان دووپشک، لە کاتی چاوەڕوانی یارمەتیدا چ کارێکی بەسوود دەکەیت؟","نیشانەکردنی لێواری ئاوسانەکە بە تیمی پزیشکی دەڵێت ژەهرەکە بە چ خێراییەک بڵاو دەبێتەوە. هەرگیز پێوەدانەکە مەبەستە، مەیبڕە، هەڵیمەمژە و سەهۆڵی مەخەرە سەر، و قاوە و چا و مەیی مەدەرێ."),
    Q("firstaid",null,"Someone has been burned by an electrical fault. What comes first?","",
      [O("Make sure the power is switched off before you touch them","","دڵنیابە کارەبا کوژاوەتەوە پێش ئەوەی دەستیان لێبدەیت"),O("Pour water on them immediately","","دەستبەجێ ئاویان بەسەردا بڕێژە"),O("Pull them away by the arm","","بە باڵیانەوە ڕایانبکێشە")],0,
      "Touching someone who is still in contact with a live current makes you the second casualty. Once it is safe, take off rings, watches and belts near the burn before it swells, then cool it with water for 10 to 15 minutes.","","کەسێک بەهۆی کێشەیەکی کارەباوە سووتاوە. چی لە پێشەوەیە؟","دەستلێدانی کەسێک کە هێشتا بە کارەبای زیندووەوە لکاوە تۆ دەکاتە قوربانی دووەم. کاتێک سەلامەت بوو، پێش ئاوسان ئەنگوستیلە، کاتژمێر و قایشی نزیک سووتانەکە لابەرە، پاشان بۆ ١٠ بۆ ١٥ خولەک بە ئاو ساردی بکەرەوە."),
    Q("rules",null,"You stop at a crash you did not cause. Someone approaches your car. What does the textbook warn about?","",
      [O("Staged crashes are used for theft — lock the doors and leave nothing valuable in sight","","ڕووداوی درووستکراو بۆ دزی بەکاردەهێنرێت — دەرگاکان قوفڵ بکە و هیچی بەنرخ بەدیار مەهێڵە"),O("Nothing — always leave the car open","","هیچ — هەمیشە ئۆتۆمبیلەکە کراوە بەجێبهێڵە"),O("You should never stop at a crash","","هەرگیز نابێت لە ڕوودانێکدا بوەستیت")],0,
      "The textbook says plainly that some crash scenes are staged to rob whoever stops. Helping is still the right thing to do — just lock the car, close the windows and take your valuables with you.","","لە ڕوودانێک دەوەستیت کە تۆ نەتکردووە. کەسێک لە ئۆتۆمبیلەکەت نزیک دەبێتەوە. کتێبەکە ئاگادارت دەکاتەوە لە چی؟","کتێبەکە بەڕاشکاوی دەڵێت هەندێک شوێنی ڕووداو بە دەستکرد ڕێکدەخرێن بۆ دزینی ئەو کەسەی دەوەستێت. یارمەتیدان هێشتا کاری دروستە — تەنها ئۆتۆمبیلەکە قوفڵ بکە، پەنجەرەکان دابخە و شتە بەنرخەکانت لەگەڵ خۆت ببە."),
    Q("rules",null,"Which fuel type does the textbook say is always more harmful to the environment?","",
      [O("Diesel — more toxic gases and more residue","","دیزڵ — گازی ژەهراوی زیاتر و پاشماوەی زیاتر"),O("Petrol","","بەنزین"),O("They are identical","","وەک یەکن")],0,
      "The same section warns that fuel of very low quality, or an octane rating higher than your engine needs, also increases toxic emissions. Using the right fuel matters as much as using less of it.","","کتێبەکە دەڵێت کام جۆری سووتەمەنی هەمیشە زیانی زیاتری بۆ ژینگە هەیە؟","هەمان بەش ئاگادار دەکاتەوە کە سووتەمەنی زۆر بێکوالێتی، یان ئۆکتانێکی بەرزتر لەوەی بزوێنەرەکەت پێویستی پێیەتی، ئەویش گازی ژەهراوی زیاد دەکات. بەکارهێنانی سووتەمەنی دروست بە هەمان ئەندازەی کەمکردنەوەی گرنگە."),
    Q("mech",null,"How does luggage on the roof affect your car?","",
      [O("It adds weight and drag, so the car burns more fuel","","کێش و بەربەستی هەوا زیاد دەکات، بۆیە ئۆتۆمبیلەکە سووتەمەنی زیاتر دەسووتێنێت"),O("It has no effect at all","","هیچ کاریگەرییەکی نییە"),O("It improves stability","","جێگیری باشتر دەکات")],0,
      "The textbook's advice is to strip out unnecessary weight and avoid roof loads altogether. The heavier the car, the more fuel it uses — and a roof load raises the centre of gravity too.","","بار لەسەر سەربانی ئۆتۆمبیل چ کاریگەرییەکی هەیە؟","ئامۆژگاری کتێبەکە ئەوەیە کێشی زیادە لاببەیت و بە تەواوی لە بارکردنی سەربان دووربکەویتەوە. هەرچەند ئۆتۆمبیل قورستر بێت، سووتەمەنی زیاتر بەکاردەهێنێت — و باری سەربان ناوەندی قورسایی بەرز دەکاتەوە."),
    Q("rules",null,"The textbook calls the horn a necessity but also warns about it. Why?","",
      [O("Overusing it is uncivil and adds to noise pollution","","بەکارهێنانی زۆری نەشیاوە و پیسبوونی دەنگ زیاد دەکات"),O("The horn should never be used","","هەرگیز نابێت بۆری بەکاربهێنرێت"),O("It drains the battery","","پاتری بەتاڵ دەکات")],0,
      "It exists to warn of danger, and nothing else. Noise is one of the five kinds of pollution the book lists, alongside air, water, soil and light.","","کتێبەکە بۆری بە پێویست دادەنێت بەڵام ئاگاداریشمان دەکاتەوە. بۆچی؟","بۆ ئاگادارکردنەوە لە مەترسی هەیە، و هیچی تر. دەنگ یەکێکە لەو پێنج جۆرە پیسبوونەی کتێبەکە دەیژمێرێت، لەگەڵ هەوا، ئاو، خاک و ڕووناکی."),
    Q("rules",null,"The traffic police suspect you of driving under the influence and ask you to take a test. What happens if you refuse?","",
      [O("Refusing or obstructing the test brings a heavier penalty","","ڕەتکردنەوە یان ڕێگرتن لە پشکنینەکە سزایەکی قورستر بەدواوەیە"),O("Nothing — the test is voluntary","","هیچ — پشکنینەکە بە خواستی خۆتە"),O("You are free to go","","بۆت هەیە بڕۆیت")],0,

      '<div class="sfig"><div class="sv tnum">'+_sk.best+'</div><div class="sl">'+esc(t("bestStreak"))+'</div></div></div>'+
      '<div class="goalhead"><span>'+esc(t("todayLabel"))+'</span><span class="tnum">'+_td+' / '+GOAL+(_td>=GOAL?' ✓':'')+'</span></div>'+
      '<div class="track"><i style="width:'+_gp+'%"></i></div>'+
      '<div class="week">'+weekStrip(st.daily)+'</div></div>';
    // accuracy by topic (single measure -> one hue; shortest = weakest, tagged)
    var cats=Object.keys(CATS), weakest=null, wp=101;
    cats.forEach(function(c){var d=cat[c];if(d&&d.n){var pc=d.c/d.n*100;if(pc<wp){wp=pc;weakest=c;}}});
    html+='<div class="card statcard"><div class="ct">'+esc(t("mastery"))+'</div>';
    cats.forEach(function(c){
      var d=cat[c]||{c:0,n:0}, has=d.n>0, pc=has?Math.round(d.c/d.n*100):0;
      html+='<div class="mrow"><span class="ml">'+CATS[c].ic+' '+esc(L(CATS[c]))+(c===weakest&&has?' <span class="wtag">'+esc(t("weakest"))+'</span>':'')+'</span>'+
        '<div class="track"><i style="width:'+(has?pc:0)+'%"></i></div>'+
        '<span class="mv tnum">'+(has?pc+'%':'—')+'</span></div>';
    });
    html+='</div>';
    // recent exam scores (single hue; 80% pass line reads pass/fail without colour)
    if(taken){
      var recent=ex.slice(-12);
      html+='<div class="card statcard"><div class="ct">'+esc(t("examTrend"))+'</div><div class="spark"><div class="passline"><span>'+esc(t("passline"))+'</span></div>';
      recent.forEach(function(p){html+='<div class="sb" title="'+p+'%"><i style="height:'+Math.max(3,Math.round(p*0.85))+'%"></i></div>';});
      html+='</div></div>';
    }
    html+='<div class="row"><button class="btn ghost" onclick="Go(\'home\')">'+esc(t("home"))+'</button>'+
      '<button class="btn ghost danger" onclick="resetProgress()">'+esc(t("reset"))+'</button></div>';
    view.innerHTML=html;
  }
  function kpi(v,l){return '<div class="kt"><div class="kv tnum">'+esc(String(v))+'</div><div class="kl">'+esc(l)+'</div></div>';}
  window.resetProgress=function(){if(window.confirm(t("resetConfirm"))){try{localStorage.removeItem("tareeq_v1");}catch(e){}Go("home");}};

  function renderAchv(){
    var list=achvState(), done=list.filter(function(s){return s.done;}).length, pct=Math.round(done/list.length*100);
    var C=2*Math.PI*22, off=C*(1-done/list.length);
    var html='<div><h1>'+esc(t("achvB"))+'</h1><p class="sub">'+esc(t("achvD"))+'</p></div>';
    html+='<div class="asum"><div><div class="an tnum">'+done+' / '+list.length+'</div><div class="al">'+esc(t("achvEarned"))+' · '+esc(t("achvSub"))+'</div></div>'+
      '<div class="aring"><svg viewBox="0 0 52 52" width="54" height="54" aria-hidden="true">'+
      '<circle cx="26" cy="26" r="22" fill="none" stroke="var(--line)" stroke-width="6"/>'+
      '<circle cx="26" cy="26" r="22" fill="none" stroke="var(--accent)" stroke-width="6" stroke-linecap="round" stroke-dasharray="'+C.toFixed(1)+'" stroke-dashoffset="'+off.toFixed(1)+'" transform="rotate(-90 26 26)"/>'+
      '<text x="26" y="30" text-anchor="middle" font-size="13" font-weight="800" fill="currentColor">'+pct+'%</text></svg></div></div>';
    html+='<div class="agrid">';
    list.forEach(function(s){
      var w=Math.round(Math.min(1,s.cur/s.target)*100);
      html+='<div class="abadge'+(s.done?' on':'')+'"><div class="aic">'+(s.done?s.a.ic:"🔒")+'</div>'+
        '<div class="at">'+esc(L(s.a.t))+'</div><div class="ad">'+esc(L(s.a.d))+'</div>'+
        (s.done?'':'<div class="abar"><i style="width:'+w+'%"></i></div><div class="ap tnum">'+s.cur+' / '+s.target+'</div>')+
        '</div>';
    });
    html+='</div><button class="btn ghost" onclick="Go(\'home\')">'+esc(t("back"))+'</button>';
    view.innerHTML=html;
  }

  /* ---------- study guide ---------- */
  window.guideAll=function(open){var d=document.querySelectorAll("#view .gsec");for(var i=0;i<d.length;i++){if(open)d[i].setAttribute("open","");else d[i].removeAttribute("open");}};
  function _firstSent(s){
    if(!s)return "";s=String(s).trim();
    var cut=-1,cands=[s.indexOf(". "),s.indexOf(" — "),s.indexOf("— ")];
    cands.forEach(function(p){if(p>0&&(cut<0||p<cut))cut=p;});
    if(cut>0)return (s.charAt(cut)==="."?s.slice(0,cut+1):s.slice(0,cut)).trim();
    return s;
  }
  function renderGuide(){
    var lang=S.lang, GL=function(o){if(!o)return "";var v=o[lang];return (v!=null&&v!=="")?v:(o.en||"");};
    var exBySign={};
    QUESTIONS.forEach(function(q){if(q.cat==="signs"&&q.sign&&!exBySign[q.sign])exBySign[q.sign]=q.ex;});
    var SGROUPS=[
      {en:"Warning signs (triangles)",ku:"هێما ئاگادارکەرەوەکان (سێگۆشە)",keys:["children","slippery","signals","bump","narrows","narrows_left","aircraft","two_way","bends","bend_left","level_crossing","level_crossing_gates","level_crossing_train","farm_animals","wild_animals"]},
      {en:"Priority signs",ku:"هێماکانی پێشینە",keys:["stop","yield","priority","give_way_oncoming","priority_oncoming"]},
      {en:"Prohibition signs",ku:"هێماکانی قەدەغە",keys:["no_entry","no_overtake","no_parking","no_uturn","no_left","tractor","speed50","end_no_overtake_truck"]},
      {en:"Mandatory & direction signs",ku:"هێماکانی فەرز و ئاراستە",keys:["ahead_only","turn_right","roundabout"]},
      {en:"Information & motorway signs",ku:"هێماکانی زانیاری و ڕێگای خێرا",keys:["ped","oneway","parking","motor_road","motorway","end_motorway","speed_camera"]},
      {en:"Road markings",ku:"نیشانەکانی سەر ڕێگا",keys:["broken_line","solid_line","double_line"]}
    ];
    var TOPICS=[
      {en:"Alcohol, phone & fitness to drive",ku:"کحول، مۆبایل و توانای لێخوڕین",ic:"🚫",re:/alcohol|drink|phone|mobile|tired|sleep|fatigue|seat ?belt|helmet|licen[cs]e|unlicen/},
      {en:"Pedestrians, cyclists & other road users",ku:"پیادە، پاسکیلسوار و بەکارهێنەرانی تر",ic:"🚸",re:/pedestrian|cyclist|bicycle|\bchild|school|motorcycl|moped|elderly|\bbus\b|horse|pram|wheelchair/},
      {en:"Lights, night & weather",ku:"لایت، شەو و کەشوهەوا",ic:"💡",re:/headlight|full beam|low beam|dipped|dazzl|\bfog\b|rain|snow|\bice\b|icy|night|\bwet\b|visib|indicator|hazard light/},
      {en:"Emergencies & railway crossings",ku:"فریاگوزاری و پەڕینگەی شەمەندەفەر",ic:"🚑",re:/emergency|ambulance|siren|breakdown|warning triangle|level crossing|railway|\btram\b|police|fire engine/},
      {en:"Overtaking, speed & distance",ku:"تێپەڕاندن، خێرایی و مەودا",ic:"⏱️",re:/overtak|\bspeed|km\/h|following|distance|two-second|two second|brake|braking|stopping|tailgat/},
      {en:"Parking, turning & motorways",ku:"پارککردن، گەڕانەوە و ڕێگا خێراکان",ic:"🅿️",re:/\bpark|u-turn|turn around|one-way|one way|revers|hatched|motorway|expressway|deceleration|merg|lane/},
      {en:"Right of way, junctions & roundabouts",ku:"پێشینە، چوارڕیان و بازنە",ic:"🔀",re:/priority|give way|give-way|yield|junction|roundabout|crossroad|unmarked|right of way|turn left|turning left|turn right|traffic light|red light|green light/}
    ];
    var OTHER={en:"Other rules",ku:"یاساکانی تر",ic:"🚗"};
    function section(ic,title,count,inner,open){
      return '<details class="gsec"'+(open?" open":"")+'><summary><span class="gic">'+ic+'</span><span>'+esc(title)+'</span><span class="gct">'+count+'</span><span class="gcar">▸</span></summary><div class="gbody">'+inner+'</div></details>';
    }
    function bullets(arr){
      var seen={},out='<ul class="gbul">';
      arr.forEach(function(q){var txt=GL(q.ex);if(!txt||seen[txt])return;seen[txt]=1;out+='<li>'+esc(txt)+'</li>';});
      return out+'</ul>';
    }
    function signCard(k){var mean=_firstSent(GL(exBySign[k]));return '<div class="gscard">'+SIGNS[k].svg+'<div class="gsn">'+esc(signLabel(k))+'</div>'+(mean?'<div class="gsm">'+esc(mean)+'</div>':'')+'</div>';}

    var html='<div><h1>'+esc(t("guideB"))+'</h1><p class="sub">'+esc(t("guideD"))+'</p></div>';
    html+='<div class="gnav"><button class="gchip" onclick="guideAll(1)">'+esc(t("expandAll"))+'</button><button class="gchip" onclick="guideAll(0)">'+esc(t("collapseAll"))+'</button></div>';

    // signs
    var used={},signInner="";
    SGROUPS.forEach(function(g){
      var items=g.keys.filter(function(k){return SIGNS[k];});if(!items.length)return;
      signInner+='<div class="gsub">'+esc(GL(g))+'</div><div class="gsgrid">';
      items.forEach(function(k){used[k]=1;signInner+=signCard(k);});
      signInner+='</div>';
    });
    var left=Object.keys(SIGNS).filter(function(k){return !used[k];});
    if(left.length){signInner+='<div class="gsub">'+esc(GL({en:"Other signs",ku:"هێماکانی تر"}))+'</div><div class="gsgrid">';left.forEach(function(k){signInner+=signCard(k);});signInner+='</div>';}
    html+=section("🛑",t("signsB"),Object.keys(SIGNS).length,signInner,true);

    // rules by topic
    var buckets=TOPICS.map(function(){return [];}),other=[];
    QUESTIONS.forEach(function(q){
      if(q.cat!=="rules")return;
      var hay=(((q.q&&q.q.en)||"")+" "+((q.ex&&q.ex.en)||"")).toLowerCase(),placed=false;
      for(var i=0;i<TOPICS.length;i++){if(TOPICS[i].re.test(hay)){buckets[i].push(q);placed=true;break;}}
      if(!placed)other.push(q);
    });
    TOPICS.forEach(function(tp,i){if(buckets[i].length)html+=section(tp.ic,GL(tp),buckets[i].length,bullets(buckets[i]),false);});
    if(other.length)html+=section(OTHER.ic,GL(OTHER),other.length,bullets(other),false);

    // first aid + mechanics
    var fa=QUESTIONS.filter(function(q){return q.cat==="firstaid";});
    if(fa.length)html+=section(CATS.firstaid.ic,L(CATS.firstaid),fa.length,bullets(fa),false);
    var me=QUESTIONS.filter(function(q){return q.cat==="mech";});
    if(me.length)html+=section(CATS.mech.ic,L(CATS.mech),me.length,bullets(me),false);

    html+='<button class="btn ghost" onclick="Go(\'home\')">'+esc(t("back"))+'</button>';
    view.innerHTML=html;
  }
  var SGFAM=[
    {id:"warn",en:"Warning signs",ku:"هێما ئاگادارکەرەوەکان",ar:"إشارات التحذير",keys:["children","slippery","signals","bump","narrows","narrows_left","narrows_right","aircraft","two_way","bends","bend_left","bend_right","level_crossing","level_crossing_gates","level_crossing_train","level_crossing_multi","farm_animals","wild_animals","crossroads","loose_chippings","tunnel","traffic_queue","cyclists","horse_riders","steep_descent","steep_ascent","falling_rocks","uneven_road","road_edge","roundabout_ahead","other_danger","side_wind","quayside","roadworks","side_road_left","merge","priority_crossroads"]},
    {id:"prio",en:"Priority signs",ku:"هێماکانی پێشینە",ar:"إشارات الأولوية",keys:["stop","yield","priority","end_priority","give_way_oncoming","priority_oncoming","officer_stop","officer_side","officer_both"]},
    {id:"proh",en:"Prohibition signs",ku:"هێماکانی قەدەغە",ar:"إشارات المنع",keys:["no_entry","no_overtake","no_overtake_truck","no_parking","no_stopping","no_uturn","no_left","no_right","no_vehicles","no_pedestrians","tractor","speed50","height_limit","weight_limit","width_limit","length_limit","stop_control"]},
    {id:"end",en:"End of restriction",ku:"کۆتایی سنووردانان",ar:"نهاية المنع",keys:["end_no_overtake","end_no_overtake_truck","end_speed","end_all_restrictions"]},
    {id:"mand",en:"Mandatory & direction",ku:"فەرز و ئاراستە",ar:"إشارات الإلزام والاتجاه",keys:["ahead_only","turn_right","turn_left","ahead_or_left","ahead_or_right","roundabout","keep_left","keep_right","pass_either_side","min_speed"]},
    {id:"info",en:"Information & motorway",ku:"زانیاری و ڕێگای خێرا",ar:"إشارات الإرشاد والطريق السريع",keys:["ped","oneway","parking","motor_road","motorway","end_motorway","speed_camera","speed_kurdistan","ped_route","taxi","dead_end","bus_stop","lane_route"]},
    {id:"mark",en:"Road markings",ku:"نیشانەکانی سەر ڕێگا",ar:"علامات الطريق",keys:["broken_line","solid_line","double_line"]}
  ];

  /* Any sign not listed above still shows up, under "Other signs". */
  function sgFamilies(){
    var seen={}, fams=SGFAM.map(function(f){
      var keys=f.keys.filter(function(k){if(SIGNS[k]){seen[k]=1;return true;}return false;});
      return {id:f.id,label:L(f),keys:keys};
    }).filter(function(f){return f.keys.length;});
    var rest=Object.keys(SIGNS).filter(function(k){return !seen[k];});
    if(rest.length)fams.push({id:"other",label:t("sgOther"),keys:rest});
    return fams;
  }

  /* One-line meaning per sign, taken from the question that teaches it. */
  var _sgMeanCache=null;
  function sgMeanings(){
    if(_sgMeanCache)return _sgMeanCache;
    var m={};
    QUESTIONS.forEach(function(q){
      if(q.cat!=="signs"||!q.sign||m[q.sign])return;
      var ex=_firstSent(L(q.ex));
      if(ex)m[q.sign]=ex;
    });
    return (_sgMeanCache=m);
  }

  var _sgQ="", _sgFam="all";
  window.sgSetFam=function(id){_sgFam=id;renderSigns();};
  window.sgSearch=function(v){
    _sgQ=String(v||"").toLowerCase().trim();
    var box=document.getElementById("sgrid");
    if(box){box.innerHTML=sgGridHtml();localizeDigits();}
  };

  function sgMatch(k){
    if(!_sgQ)return true;
    var mean=sgMeanings()[k]||"";
    var hay=[k,SIGNS[k].en,SIGNS[k].ar||"",KU_SIGNS[k]||"",mean].join(" ").toLowerCase();
    return hay.indexOf(_sgQ)>=0;
  }

  function sgCardHtml(k){
    var mean=sgMeanings()[k];
    return '<div class="sc">'+SIGNS[k].svg+'<div class="nm">'+esc(signLabel(k))+'</div>'+
      (mean?'<div class="mn">'+esc(mean)+'</div>':'')+'</div>';
  }

  function sgGridHtml(){
    var fams=sgFamilies(), out="", total=0;
    fams.forEach(function(f){
      if(_sgFam!=="all"&&_sgFam!==f.id)return;
      var keys=f.keys.filter(sgMatch);
      if(!keys.length)return;
      total+=keys.length;
      out+='<div class="sghead">'+esc(f.label)+'<span class="n">'+keys.length+'</span></div><div class="grid">';
      keys.forEach(function(k){out+=sgCardHtml(k);});
      out+='</div>';
    });
    return total?out:'<div class="sgnone">'+esc(t("sgNone"))+'</div>';
  }

  function renderSigns(){
    var fams=sgFamilies(), all=0;
    fams.forEach(function(f){all+=f.keys.length;});
    if(_sgFam!=="all"&&!fams.some(function(f){return f.id===_sgFam;}))_sgFam="all";

    var chips='<div class="sgchips"><button class="sgchip'+(_sgFam==="all"?" on":"")+'" onclick="sgSetFam(\'all\')">'+
      esc(t("sgAll"))+'<span class="n">'+all+'</span></button>';
    fams.forEach(function(f){
      chips+='<button class="sgchip'+(_sgFam===f.id?" on":"")+'" onclick="sgSetFam(\''+f.id+'\')">'+
        esc(f.label)+'<span class="n">'+f.keys.length+'</span></button>';
    });
    chips+='</div>';

    view.innerHTML='<div><h1>'+esc(t("signsB"))+'</h1><p class="sub">'+esc(t("signsBD"))+'</p></div>'+
      '<div class="sqbtns"><button class="btn" onclick="startFlash()">'+esc(t("flashB"))+'</button>'+
      '<button class="btn" onclick="startSignQuiz()">'+esc(t("signQuizB"))+'</button></div>'+
      '<div class="sgtools"><input id="sgq" type="search" autocomplete="off" placeholder="'+esc(t("sgSearch"))+
        '" value="'+esc(_sgQ)+'" oninput="sgSearch(this.value)" aria-label="'+esc(t("sgSearch"))+'">'+chips+'</div>'+
      '<div id="sgrid">'+sgGridHtml()+'</div>'+
      '<button class="btn ghost" onclick="Go(\'home\')">'+esc(t("back"))+'</button>';
  }


  /* ---------- language ---------- */
  window.setLang=function(l){
    S.lang=l;
    document.getElementById("enB").setAttribute("aria-pressed",l==="en");
    document.getElementById("kuB").setAttribute("aria-pressed",l==="ku");
    document.getElementById("app").setAttribute("dir",l==="ku"?"rtl":"ltr");
    document.getElementById("brandSub").textContent=UI[l].brand;
    render();
  };

  setLang("ku");
  try{if(localStorage.getItem("tareeq_big")){document.getElementById("app").classList.add("big");document.getElementById("szB").setAttribute("aria-pressed","true");}}catch(e){}
})();
</script>
