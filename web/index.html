      "The colour is the priority. Green and blue simply confirm something is switched on. Amber is a fault to have looked at. Red means a serious problem — brakes, oil pressure, temperature — and you should stop as soon as you safely can rather than drive on.","","ڕەنگی چراکانی ئاگادارکردنەوەی داشبۆرد چیت پێدەڵێن؟","ڕەنگەکە پێشینەکەیە. سەوز و شین تەنها پشتڕاست دەکەنەوە شتێک داگیرساوە. زەرد کێشەیەکە کە دەبێت سەیر بکرێت. سوور واتای کێشەیەکی جددی — برێک، پەستانی ڕۆن، پلەی گەرمی — و دەبێت هەرکە بەسەلامەتی توانیت بوەستیت نەک بەردەوام بیت."),
    Q("rules",null,"A vehicle wider than 2.5 m wants to use an expressway. Is that allowed?","",
      [O("No, unless the traffic police direct and escort it","","نەخێر، مەگەر پۆلیسی هاتوچۆ ئاراستە و هاوڕێیەتیی بکات"),O("Yes, at any time","","بەڵێ، لە هەر کاتێکدا"),O("Yes, but only at night","","بەڵێ، بەڵام تەنها بە شەو")],0,
      "Anything over 2.5 m wide is barred from expressways unless the traffic police direct it and warn other drivers. An over-wide load cannot stay inside one lane, so it has to be managed rather than simply driven.","","سوارڕۆیەک کە لە ٢٫٥ مەتر پانتر بێت دەیەوێت ڕێگای خێرا بەکاربهێنێت. ڕێگەپێدراوە؟","هەرچی لە ٢٫٥ مەتر پانتر بێت لە ڕێگای خێرا قەدەغەیە مەگەر پۆلیسی هاتوچۆ ئاراستەی بکات و شۆفێرانی تر ئاگادار بکاتەوە. بارێکی زۆر پان ناتوانێت لە ناو یەک ڕێڕەودا بمێنێتەوە، بۆیە دەبێت بەڕێوە ببرێت نەک تەنها لێی بخوڕدرێت."),Q("rules",null,"Which six things must you have with you when a traffic officer stops you?","",
      [O("Licence, vehicle registration, inspection certificate, warning triangle, fire extinguisher and first-aid kit","","مۆڵەت، تۆماری سوارڕۆ، بەڵگەنامەی پشکنین، سێگۆشەی ئاگادارکردنەوە، ئاگرکوژێنەرەوە و سندووقی فریاگوزاری"),O("Only the driving licence","","تەنها مۆڵەتی شۆفێری"),O("Licence and registration only","","تەنها مۆڵەت و تۆمار")],0,
      "All six, and the first three must still be in date — the licence must also match the type of vehicle you are driving, and the inspection sticker belongs on the windscreen.","","کام شەش شت دەبێت لەگەڵت بێت کاتێک ئەفسەرێکی هاتوچۆ ڕاتدەگرێت؟","هەر شەشەکەیان، و سێ دانەی یەکەم دەبێت ماوەیان بەسەرنەچووبێت — مۆڵەتەکەش دەبێت لەگەڵ ئەو جۆرە سوارڕۆیەدا بگونجێت کە لێی دەخوڕیت، و ستیکەری پشکنینیش لەسەر جامی پێشەوە دەبێت."),
    Q("rules",null,"How far should the driver’s seat be from the pedals?","",
      [O("Close enough that your knees stay bent at about 120 degrees","","بەو نزیکییەی ئەژنۆکانت لە نزیکەی ١٢٠ پلە چەماوە بمێننەوە"),O("As far back as possible for comfort","","تا دەکرێت بەرەو دواوە بۆ ئاسوودەیی"),O("So your legs are completely straight","","بەشێوەیەک قاچەکانت بە تەواوی ڕاست بن")],0,
      "Straight legs cannot press a pedal hard in an emergency, and sitting too close leaves no room to work. Keep the heel on the floor and press with the ball of the foot so you can feel how much pressure you are applying.","","کورسی شۆفێر دەبێت چەند لە پێدانەرەکان دوور بێت؟","بەو نزیکییەی ئەژنۆکانت لە نزیکەی ١٢٠ پلە چەماوە بمێننەوە. قاچی ڕاست ناتوانێت لە کاتی لەناکاودا بە توندی پێدانەر پەست بکات، و زۆر نزیک دانیشتنیش شوێنی کارکردن نایەڵێت. پاژنە لەسەر زەوی بهێڵە و بە سمی پێ پەستان بخە سەری تا هەست بە بڕی ئەو فشارە بکەیت کە دەیخەیتە سەری."),
    Q("rules",null,"How should the backrest and your distance from the steering wheel be set?","",
      [O("Backrest at about 90–110 degrees, with 10–30 cm between your chest and the wheel","","پشتی کورسی لە نزیکەی ٩٠–١١٠ پلە، بە ١٠–٣٠ سم لە نێوان سنگ و سوکاندا"),O("Reclined as far back as is comfortable","","تا دەکرێت بەرەو دواوە لارکراوە بۆ ئاسوودەیی"),O("Chest almost touching the wheel for better control","","سنگ بەنزیکی بەر سوکان بکەوێت بۆ کۆنترۆڵی باشتر")],0,
      "Sitting too close puts your chest inside the airbag’s inflation zone; reclining too far means you cannot steer properly or brace in a crash. Set the head restraint so its middle is level with your eyes.","","پشتی کورسی و دووریت لە سوکان چۆن دەبێت ڕێک بخرێن؟","پشتی کورسی لە نزیکەی ٩٠–١١٠ پلە، بە ١٠–٣٠ سم لە نێوان سنگ و سوکاندا. زۆر نزیک دانیشتن سنگت دەخاتە ناو ناوچەی کرانەوەی بالۆنی هەوایی؛ زۆر لارکردنەوەش واتە ناتوانیت بە دروستی ئاراستە بگۆڕیت یان لە ڕووداودا خۆت ڕابگریت. پاڵپشتەی سەریش بەشێوەیەک دابنێ کە ناوەڕاستی لەگەڵ چاوەکانتدا یەکسان بێت."),
    Q("rules",null,"A pregnant woman is travelling in the car. How should she wear the seat belt?","",
      [O("The lap part below the bump, across the hips, not over it","","بەشی ناوقەد لەژێر سکەکەوە، بەسەر ڕانەکاندا، نەک بەسەریدا"),O("She should not wear one at all","","هەرگیز نابێت پشتێن ببەستێت"),O("The lap part across the middle of the bump","","بەشی ناوقەد بەسەر ناوەڕاستی سکەکەدا")],0,
      "The lap belt must sit low across the hips, under the bump, with the diagonal between the breasts and to the side of it. Worn correctly it protects both — it is never a reason to travel unbelted.","","ئافرەتێکی دووگیان لە ئۆتۆمبیلەکەدایە. چۆن دەبێت پشتێنی سەلامەتی ببەستێت؟","بەشی ناوقەد دەبێت نزم و بەسەر ڕانەکاندا بێت، لەژێر سکەکەوە، و بەشی لاریش لە نێوان مەمکەکان و بەلایەکیدا. بە دروستی بەستراو هەردووکیان دەپارێزێت — هەرگیز هۆکارێک نییە بۆ گەشتکردن بەبێ پشتێن."),
    Q("rules",null,"How should the side mirrors be adjusted?","",
      [O("So that only a small strip of your own car shows at the inner edge","","بەشێوەیەک تەنها تەنکەیەکی بچووکی ئۆتۆمبیلەکەی خۆت لە لێواری ناوەوەدا دیار بێت"),O("So you can see the whole side of your car","","بەشێوەیەک هەموو لای ئۆتۆمبیلەکەت ببینیت"),O("Pointing down at the road surface","","ڕوو لە خوارەوە بۆ ڕووی ڕێگاکە")],0,
      "If you can see a lot of your own car, the mirror is wasted on metal you already know is there. Set the seat first, then the mirrors — and when reversing you may tilt the right mirror down to find the kerb.","","ئاوێنەکانی تەنیشت چۆن دەبێت ڕێک بخرێن؟","بەشێوەیەک تەنها تەنکەیەکی بچووکی ئۆتۆمبیلەکەی خۆت لە لێواری ناوەوەدا دیار بێت. ئەگەر زۆری ئۆتۆمبیلەکەی خۆت ببینیت، ئاوێنەکە بەفیڕۆ دەڕوات لەسەر کانزایەک کە دەزانیت لەوێیە. سەرەتا کورسییەکە ڕێک بخە، پاشان ئاوێنەکان — و لە کاتی بەدواوەچووندا دەتوانیت ئاوێنەی ڕاست بەرەو خوارەوە لار بکەیتەوە بۆ دۆزینەوەی شۆستەکە."),
    Q("rules",null,"Before which of these must you check your mirrors?","",
      [O("Before every one: signalling, changing direction, turning, overtaking, slowing, stopping, speeding up and opening a door","","پێش هەمووی: ئاماژەدان، گۆڕینی ئاراستە، سووڕانەوە، تێپەڕاندن، کەمکردنەوەی خێرایی، وەستان، خێراکردن و کردنەوەی دەرگا"),O("Only before overtaking","","تەنها پێش تێپەڕاندن"),O("Only before turning right","","تەنها پێش سووڕانەوە بۆ ڕاست")],0,
      "Any change in your speed or direction affects somebody behind you, so the mirror check comes before the action — including opening the door when you have stopped, which is how cyclists get hurt.","","پێش کام لەمانە دەبێت سەیری ئاوێنەکانت بکەیت؟","پێش هەمووی. هەر گۆڕانێک لە خێرایی یان ئاراستەکەت کاریگەری لەسەر کەسێکی دواتەوە هەیە، بۆیە پشکنینی ئاوێنە پێش کردارەکە دێت — لەوانە کردنەوەی دەرگا کاتێک وەستاویت، کە بەو شێوەیە پاسکیلسوارەکان بریندار دەبن."),
    Q("rules",null,"Why is sitting directly in front of a lorry dangerous?","",
      [O("The lorry driver cannot see the area right in front of the cab","","شۆفێری بارهەڵگر ناتوانێت ئەو ناوچەیە ببینێت کە ڕاست لەبەردەم کابینەکەیەتی"),O("Lorries always accelerate faster than cars","","بارهەڵگرەکان هەمیشە خێراتر لە ئۆتۆمبیل خێرا دەبن"),O("It is not dangerous if you are in your lane","","مەترسیدار نییە ئەگەر لە ڕێڕەوی خۆتدا بیت")],0,
      "A lorry has a blind area directly ahead of the cab as well as down each side and behind. The rule of thumb is simple: if you cannot see the lorry driver’s mirrors, they cannot see you.","","بۆچی مەترسیدارە ڕاست لەبەردەم بارهەڵگرێکدا بیت؟","بارهەڵگر ناوچەیەکی کوێری هەیە ڕاست لەبەردەم کابینەکە، هەروەها لە هەردوو لا و لە دواوە. بنەمای گشتی سادەیە: ئەگەر نەتوانیت ئاوێنەکانی شۆفێری بارهەڵگرەکە ببینیت، ئەویش ناتتبینێت."),
    Q("rules",null,"Why should you not drive barefoot or in high heels?","",
      [O("Your foot cannot control the pedals properly","","پێت ناتوانێت بە دروستی پێدانەرەکان کۆنترۆڵ بکات"),O("It is uncomfortable but perfectly safe","","ناڕەحەتە بەڵام بە تەواوی سەلامەتە"),O("It damages the pedal rubber","","لاستیکی پێدانەرەکان دەفەوتێنێت")],0,
      "A bare foot slips off a pedal and cannot press hard enough in an emergency; a heel catches and stops you pivoting from brake to accelerator. Wear flat, firm-soled shoes.","","بۆچی نابێت بە پێی پەتی یان بە لەپێکردنی نەعلی بەرز لێبخوڕیت؟","پێی پەتی لەسەر پێدانەر دەخلیسکێت و ناتوانێت لە کاتی لەناکاودا بە تەواوی پەستان بخاتە سەری؛ نەعلی بەرزیش دەگیرێت و ڕێگە لە سووڕانەوەت لە برێکەوە بۆ پێدانەری خێرایی دەگرێت. پێڵاوی تەخت و بنڕەقی لەپێ بکە."),Q("rules",null,"What is the correct order of checks before moving off or changing lane?","",
      [O("Mirrors, then blind spot, then signal, then move","","ئاوێنەکان، پاشان ناوچەی مردوو، پاشان ئاماژە، پاشان جووڵە"),O("Signal, then mirrors, then move","","ئاماژە، پاشان ئاوێنەکان، پاشان جووڵە"),O("Move first, then signal if anyone is near","","سەرەتا بجووڵێ، پاشان ئاماژە بدە ئەگەر کەسێک نزیک بوو")],0,
      "Look before you announce: the mirrors and the blind-spot check tell you whether the space exists, and only then does the signal tell others what you intend. Signalling first invites someone to act on a move you have not yet checked is safe.","","ڕیزبەندیی دروستی پشکنینەکان پێش جووڵان یان گۆڕینی ڕێڕەو چییە؟","پێش ئەوەی ڕایبگەیەنیت سەیر بکە: ئاوێنەکان و پشکنینی ناوچەی مردوو پێت دەڵێن ئایا بۆشاییەکە هەیە، و تەنها ئینجا ئاماژەکە بە ئەوانی تر دەڵێت مەبەستت چییە. ئاماژەدان لە سەرەتادا کەسێک هان دەدات کارێک بکات لەسەر جووڵەیەک کە هێشتا نەتپشکنیوە سەلامەتە."),
    Q("rules",null,"You have stopped at the kerb and expect to wait several minutes. What should you do?","",
      [O("Switch the engine off","","بزوێنەرەکە بکوژێنەوە"),O("Leave it running so the air conditioning works","","بیهێڵە کار بکات تا کۆندیشن کار بکات"),O("Rev it occasionally to keep it warm","","جار جار پێی بدە تا گەرم بمێنێتەوە")],0,
      "An idling engine burns fuel and pollutes for no gain. Choose a safe and legal place first, apply the handbrake if you are on a slope, and leave enough room from the cars around you if you intend to park.","","لەلای شۆستە وەستاویت و چاوەڕێی چەند خولەکێک دەکەیت. دەبێت چی بکەیت؟","بزوێنەری کارا سووتەمەنی دەسووتێنێت و ژینگە پیس دەکات بێ هیچ سوودێک. سەرەتا شوێنێکی سەلامەت و یاسایی هەڵبژێرە، ئەگەر لەسەر لێژایی بوویت برێکی دەستی دابگرە، و بۆشاییی پێویست لە ئۆتۆمبیلەکانی دەوروبەرت بهێڵەوە ئەگەر دەتەوێت پارک بکەیت."),
    Q("rules",null,"Two lanes merge into one. Which vehicle has priority?","",
      [O("The one that is already ahead","","ئەوەی پێشتر لە پێشەوەیە"),O("The one in the right-hand lane","","ئەوەی لە ڕێڕەوی لای ڕاستە"),O("The larger vehicle","","سوارڕۆ گەورەکە")],0,
      "At a merge the vehicle in front goes first — you fit in behind, you do not race for the gap. Where the road narrows from both sides instead, priority goes to whoever arrives first and the two streams zip together alternately.","","دوو ڕێڕەو دەبنە یەک. کام سوارڕۆ پێشڕەوی هەیە؟","لە یەکگرتندا ئەو سوارڕۆیەی لە پێشەوەیە یەکەم دەڕوات — تۆ لە دواوەی دەچیتە ناوی، پێشبڕکێ بۆ بۆشاییەکە ناکەیت. لەو شوێنەی ڕێگاکە لە هەردوو لاوە تەسک دەبێتەوە، پێشڕەوی بۆ ئەوەیە کە یەکەم دەگات و هەردوو لێشاوەکە یەک لەدوای یەک تێکەڵ دەبن."),
    Q("signs",null,"White arrows are painted along your lane. How much authority do they have?","",
      [O("The same authority as the blue round mandatory sign","","هەمان دەسەڵاتی هێمای بازنەیی شینی فەرز"),O("They are only a suggestion","","تەنها پێشنیارن"),O("They apply only to lorries","","تەنها بۆ بارهەڵگرەکان جێبەجێ دەبن")],0,
      "Painted lane arrows carry the same force as the blue round sign — you must go the way they point. They are put on the road so a driver whose view of the sign is blocked by a lorry or a tree still gets the instruction.","","تیری سپی بەسەر ڕێڕەوەکەتدا کێشراوە. چەند دەسەڵاتیان هەیە؟","تیری کێشراوی ڕێڕەو هەمان هێزی هێمای بازنەیی شینی هەیە — دەبێت بەو لادا بڕۆیت کە ئاماژەی پێدەکەن. لەسەر ڕێگا دادەنرێن تا ئەو شۆفێرەی دیدی بۆ هێماکە بە بارهەڵگرێک یان دارێک داخراوە هێشتا ڕێنماییەکە وەربگرێت."),
    Q("rules",null,"You are turning right at a junction. Which lane should you be in, and what must you watch for?","",
      [O("The nearest right-hand lane, watching for pedestrians crossing and for cyclists in the same lane","","نزیکترین ڕێڕەوی لای ڕاست، بە چاودێری پیادەی خەریکی پەڕینەوە و پاسکیلسوارانی هەمان ڕێڕەو"),O("The middle lane, watching only for oncoming cars","","ڕێڕەوی ناوەڕاست، تەنها بە چاودێری ئۆتۆمبیلی بەرامبەر"),O("Any lane, as long as you signal early","","هەر ڕێڕەوێک، بەمەرجێک زوو ئاماژە بدەیت")],0,
      "Take the nearest right lane in good time and signal at a suitable distance. The two dangers are the pedestrians already crossing the road you are turning into, and a cyclist or motorcyclist alongside you in the same lane who intends to go straight on.","","لە یەکتربڕێکدا بەرەو ڕاست دەسووڕێیتەوە. دەبێت لە کام ڕێڕەودا بیت، و چاوت لە چی بێت؟","نزیکترین ڕێڕەوی لای ڕاست لە کاتی خۆیدا بگرە و لە دوورییەکی گونجاو ئاماژە بدە. دوو مەترسییەکە بریتین لەو پیادانەی پێشتر خەریکی پەڕینەوەی ئەو ڕێگایەن کە بۆی دەسووڕێیتەوە، و پاسکیلسوار یان ماتۆڕسواری تەنیشتت لە هەمان ڕێڕەودا کە مەبەستی ڕۆیشتنی ڕاستەوڕاستە."),Q("rules",null,"How much room must you leave when overtaking a cyclist or motorcyclist?","",
      [O("At least 1.5 metres","","بەلایەنی کەم ١٫٥ مەتر"),O("Half a metre is enough","","نیو مەتر بەسە"),O("As little as possible, to pass quickly","","تا دەکرێت کەمتر، بۆ تێپەڕینی خێرا")],0,
      "A metre and a half gives them room to swerve round a pothole without meeting your car. Expect exactly that swerve, allow for their tyres slipping in rain, and watch their hand signals before you commit.","","کاتێک بە پاسکیلسوار یان ماتۆڕسوارێکدا تێدەپەڕیت چەند بۆشایی دەبێت بهێڵیتەوە؟","بەلایەنی کەم ١٫٥ مەتر. مەتر و نیوێک بۆشاییان پێدەدات بۆ لادان لە چاڵێک بەبێ ئەوەی بەر ئۆتۆمبیلەکەت بکەون. چاوەڕێی هەر ئەو لادانە بکە، ڕەچاوی خلیسکانی تایەکانیان لە بارانا بکە، و پێش ئەوەی دەست بکەیت سەیری ئاماژە دەستییەکانیان بکە."),
    Q("rules",null,"You are about to overtake a horse and rider. What must you avoid doing?","",
      [O("Sounding the horn or revving the engine","","لێدانی بۆڕی یان پێدانی بزوێنەر"),O("Slowing down before you pass","","کەمکردنەوەی خێرایی پێش تێپەڕین"),O("Leaving a wide gap","","هێشتنەوەی بۆشاییەکی پان")],0,
      "Noise is the danger with animals: a horn or a revving engine can panic a horse into the road. Slow down enough that you could stop, leave more room than you would for a car, and watch the rider’s signals.","","خەریکی تێپەڕاندنی ئەسپ و ئەسپسوارێکیت. دەبێت لە چی خۆت بپارێزیت؟","لێدانی بۆڕی یان پێدانی بزوێنەر. دەنگ مەترسییەکەیە لەگەڵ ئاژەڵدا: بۆڕی یان بزوێنەری بەدەنگ دەتوانێت ئەسپەکە بتۆقێنێت و بیخاتە ناو ڕێگاکەوە. ئەوەندە خێرایی کەم بکەرەوە کە بتوانیت بوەستیت، بۆشاییەکی زیاتر لەوەی بۆ ئۆتۆمبیل دەیهێڵیتەوە بهێڵەوە، و سەیری ئاماژەکانی سوارەکە بکە."),
    Q("rules",null,"The car in front is already travelling at the maximum permitted speed. May you overtake it?","",
      [O("No — overtaking it would put you over the limit","","نەخێر — تێپەڕاندنی لە سنوورەکە دەرت دەکات"),O("Yes, if the road ahead is clear","","بەڵێ، ئەگەر ڕێگای پێشەوە ڕوون بێت"),O("Yes, as long as you signal","","بەڵێ، بەمەرجێک ئاماژە بدەیت")],0,
      "You cannot pass a car at the limit without breaking it yourself. Overtaking is also forbidden if the driver behind has already begun to overtake you, if the car ahead has begun overtaking someone else, or if passing would force the other driver to change speed or direction.","","ئۆتۆمبیلی پێشەوە پێشتر بە زۆرترین خێراییی ڕێگەپێدراو دەڕوات. بۆت هەیە تێیبپەڕێنیت؟","نەخێر — تێپەڕاندنی لە سنوورەکە دەرت دەکات. تێپەڕاندن هەروەها قەدەغەیە ئەگەر ئەو شۆفێرەی لە دواتەوەیە پێشتر دەستی بە تێپەڕاندنی تۆ کردبێت، ئەگەر ئۆتۆمبیلی پێشەوە دەستی بە تێپەڕاندنی کەسێکی تر کردبێت، یان ئەگەر تێپەڕینەکە شۆفێرەکەی تر ناچار بکات خێرایی یان ئاراستە بگۆڕێت."),
    Q("rules",null,"Several vehicles are queued one behind another. How should you overtake them?","",
      [O("In stages — one vehicle at a time","","بە قۆناغ — یەک سوارڕۆ لە هەر جارێکدا"),O("All of them in one long move","","هەموویان لە یەک جوڵەی درێژدا"),O("Only if you can pass at least three at once","","تەنها ئەگەر بتوانیت بەلایەنی کەم بە سێدا تێبپەڕیت")],0,
      "Passing a whole queue in one move leaves you on the wrong side of the road far too long, with no gap to duck back into. Take them one at a time, returning to your lane between each.","","چەند سوارڕۆیەک یەک لەدوای یەک ڕیز بوونەتەوە. چۆن دەبێت تێیانبپەڕێنیت؟","بە قۆناغ — یەک سوارڕۆ لە هەر جارێکدا. تێپەڕاندنی هەموو ڕیزەکە لە یەک جوڵەدا زۆر درێژ لەلای هەڵەی ڕێگاکە ڕاتدەگرێت، بێ هیچ بۆشاییەک بۆ گەڕانەوە. یەک لەدوای یەک تێیانبپەڕێنە، و لە نێوان هەریەکەیاندا بگەڕێوە سەر ڕێڕەوی خۆت."),
    Q("rules",null,"Where is a three-point turn forbidden?","",
      [O("In a one-way street","","لە شەقامێکی یەک ئاراستە"),O("On any road with two lanes","","لەسەر هەر ڕێگایەکی دوو ڕێڕەو"),O("Anywhere outside a town","","لە هەر شوێنێکی دەرەوەی شار")],0,
      "A three-point turn is for a road too narrow to turn round in one movement — but in a one-way street it is banned outright, because it puts you against the flow. Check the signs and markings first, then use mirrors and blind spot at every one of the three stages.","","سووڕانەوەی سێ خاڵ لە کوێ قەدەغەیە؟","لە شەقامێکی یەک ئاراستە. سووڕانەوەی سێ خاڵ بۆ ڕێگایەکە کە تەسکترە لەوەی بە یەک جوڵە بسووڕێیتەوە — بەڵام لە شەقامی یەک ئاراستەدا بە تەواوی قەدەغەیە، چونکە بەرامبەر بە لێشاوەکە ڕاتدەگرێت. سەرەتا سەیری هێما و نیشانەکان بکە، پاشان لە هەر سێ قۆناغەکەدا ئاوێنە و ناوچەی مردوو بەکاربهێنە."),
    Q("rules",null,"You are reversing in a straight line. Where should you be looking?","",
      [O("Through the rear window over your shoulder, while also checking both mirrors and ahead","","بە جامی دواوەدا بەسەر شانتەوە، لەگەڵ پشکنینی هەردوو ئاوێنە و پێشەوەش"),O("Only in the rear-view mirror","","تەنها لە ئاوێنەی ناوەوە"),O("Only at the reversing camera screen","","تەنها لە شاشەی کامێرای بەک")],0,
      "Put your right hand on the back of the passenger seat and turn to look through the rear window, keeping the wheel steady with the left hand. Keep checking the mirrors and the front too — as the back swings one way the front swings the other.","","بە هێڵێکی ڕاست بە دواوە دەچیت. دەبێت سەیری کوێ بکەیت؟","بە جامی دواوەدا بەسەر شانتەوە، لەگەڵ پشکنینی هەردوو ئاوێنە و پێشەوەش. دەستی ڕاستت بخەرە سەر پشتی کورسی سەرنشین و بسووڕێوە بۆ سەیرکردن بە جامی دواوەدا، بە دەستی چەپ سوکانەکە جێگیر ڕابگرە. بەردەوام سەیری ئاوێنەکان و پێشەوەش بکە — کاتێک دواوە بەلایەکدا دەسووڕێت پێشەوە بەلایەکی تردا دەسووڕێت."),
    Q("rules",null,"Before reversing out of a parking space, what is the one check people most often skip?","",
      [O("Walking round or looking low behind the car for small children","","سووڕانەوە بەدەوری ئۆتۆمبیلەکە یان سەیرکردنی نزم لە پشتەوە بۆ منداڵی بچووک"),O("Adjusting the radio","","ڕێکخستنی ڕادیۆ"),O("Checking the fuel gauge","","سەیرکردنی پێوەری سووتەمەنی")],0,
      "A small child, or a ball that a child will chase, sits completely below the line of every mirror and camera. Reversing is among the most dangerous manoeuvres precisely because the danger can be somewhere you physically cannot see from the seat.","","پێش ئەوەی بە دواوە لە شوێنی پارککردن دەربچیت، کام پشکنین زۆرترین جار پشتگوێ دەخرێت؟","سووڕانەوە بەدەوری ئۆتۆمبیلەکە یان سەیرکردنی نزم لە پشتەوە بۆ منداڵی بچووک. منداڵێکی بچووک، یان تۆپێک کە منداڵێک بەدوایدا ڕادەکات، بە تەواوی لە خوار ئاستی هەموو ئاوێنە و کامێرایەکەوەیە. بەدواوەچوون یەکێکە لە مەترسیدارترین جوڵەکان هەر لەبەر ئەوەی مەترسییەکە دەتوانێت لە شوێنێک بێت کە بە جەستەیی لە کورسییەکەوە نایبینیت."),Q("rules",null,"Under the Kurdistan Traffic Directorate circular of 2011, what is the maximum speed between cities and towns?","",
      [O("100 km/h","","١٠٠ کم/کاتژمێر"),O("80 km/h","","٨٠ کم/کاتژمێر"),O("120 km/h","","١٢٠ کم/کاتژمێر")],0,
      "Circular No. 2 of 10/5/2011 sets three figures for the Region: 100 km/h between cities and towns, 60 km/h on main streets inside built-up areas, and 20 km/h in alleys and lanes. You may always drive slower than these where conditions or a posted sign require it.","","بەپێی بڵاونامەی بەڕێوەبەرایەتیی هاتوچۆی کوردستان لە ٢٠١١، زۆرترین خێرایی لە نێوان شار و شارۆچکەکاندا چەندە؟","بڵاونامەی ژمارە ٢ی ٢٠١١/٥/١٠ سێ ژمارە بۆ هەرێمەکە دیاری دەکات: ١٠٠ کم/کاتژمێر لە نێوان شار و شارۆچکەکان، ٦٠ کم/کاتژمێر لەسەر شەقامە سەرەکییەکانی ناو ناوچەی نیشتەجێبوون، و ٢٠ کم/کاتژمێر لە کۆڵانەکاندا. هەمیشە دەتوانیت لەمانە هێواشتر لێبخوڕیت لەو شوێنانەی بارودۆخ یان هێمایەکی دانراو داوای دەکات."),
    Q("rules",null,"What is the maximum speed in an alley or narrow lane inside a built-up area?","",
      [O("20 km/h","","٢٠ کم/کاتژمێر"),O("60 km/h","","٦٠ کم/کاتژمێر"),O("40 km/h","","٤٠ کم/کاتژمێر")],0,
      "Alleys have their own much lower limit of 20 km/h — far below the 60 that applies on main streets in the same town. Children play in them, there are rarely pavements, and sight lines at each corner are almost nil.","","زۆرترین خێرایی لە کۆڵان یان ڕێگای تەسکی ناو ناوچەی نیشتەجێبوون چەندە؟","٢٠ کم/کاتژمێر. کۆڵانەکان سنووری زۆر نزمتری خۆیان هەیە — زۆر خوارتر لەو ٦٠ـەی لەسەر شەقامە سەرەکییەکانی هەمان شار جێبەجێ دەبێت. منداڵ تێیاندا یاری دەکەن، بەدەگمەن شۆستەیان هەیە، و دیدیش لە هەر گۆشەیەکدا نزیکەی هیچە."),
    Q("rules",null,"How close to a junction corner may you park?","",
      [O("No closer than 10 metres","","نزیکتر لە ١٠ مەتر نا"),O("Right up to the corner, if there is space","","تا سەر گۆشەکە، ئەگەر شوێن هەبێت"),O("No closer than 2 metres","","نزیکتر لە ٢ مەتر نا")],0,
      "Ten metres from a corner, and at least five metres before a pedestrian crossing. A car parked closer hides approaching traffic from everyone turning in, and hides the people crossing from you.","","چەند نزیک بە گۆشەی یەکتربڕێک دەتوانیت پارک بکەیت؟","نزیکتر لە ١٠ مەتر نا، و بەلایەنی کەم ٥ مەتر پێش خەتی پەڕینەوەی پیادە. ئۆتۆمبیلێکی نزیکتر پارککراو هاتوچۆی نزیکبووەوە لە هەموو ئەوانەی دەسووڕێنەوە دەشارێتەوە، و ئەو کەسانەش کە دەپەڕنەوە لە تۆ دەشارێتەوە."),
    Q("rules",null,"Which of these is a place where parking is forbidden?","",
      [O("On a bridge or in an underpass, in a tunnel, on a bend, or in front of a gate or garage entrance","","لەسەر پرد یان لە ژێرپرد، لە تونێل، لەسەر پێچ، یان لەبەردەم دەروازە و دەرگای گەراج"),O("Anywhere with a wide shoulder","","لە هەر شوێنێک شانی فراوانی هەبێت"),O("Anywhere, if you stay in the car","","لە هەر شوێنێک، ئەگەر لە ئۆتۆمبیلەکە بمێنیتەوە")],0,
      "The banned list is long and shares one logic — anywhere your car blocks a way through or hides something. It also covers bus and taxi stops, cycle lanes, the left side of the road, alongside another parked car, in front of schools and mosques, and anywhere that hides a sign.","","کام لەمانە شوێنێکە کە پارککردنی تێیدا قەدەغەیە؟","لەسەر پرد یان لە ژێرپرد، لە تونێل، لەسەر پێچ، یان لەبەردەم دەروازە و دەرگای گەراج. لیستی قەدەغەکراوەکان درێژە و یەک لۆژیکیان هەیە — هەر شوێنێک ئۆتۆمبیلەکەت ڕێگایەک ببەستێت یان شتێک بشارێتەوە. هەروەها وەستانی پاس و تاکسی، ڕێڕەوی پاسکیل، لای چەپی ڕێگا، لەتەنیشت ئۆتۆمبیلێکی تری پارککراو، لەبەردەم قوتابخانە و مزگەوت، و هەر شوێنێک هێمایەک بشارێتەوە دەگرێتەوە."),
    Q("rules",null,"When may you stop inside a tunnel?","",
      [O("Only in an emergency or breakdown","","تەنها لە کاتی لەناکاو یان پەککەوتندا"),O("Whenever you want to rest","","هەر کاتێک بتەوێت پشوو بدەیت"),O("If you switch the hazard lights on","","ئەگەر لایتی ئاگادارکردنەوە دابگیرسێنیت")],0,
      "Stopping in a tunnel is for emergencies only, which is why the SOS points are there. A tunnel has no room to pass a stopped car and no way for the exhaust fumes to clear.","","کەی دەتوانیت لە ناو تونێلدا بوەستیت؟","تەنها لە کاتی لەناکاو یان پەککەوتندا. وەستان لە تونێلدا تەنها بۆ حاڵەتی لەناکاوە، بۆیە خاڵەکانی SOS لەوێن. تونێل نە شوێنی تێپەڕاندنی ئۆتۆمبیلێکی وەستاوی هەیە و نە ڕێگەیەک بۆ دەرچوونی دووکەڵەکە."),
    Q("rules",null,"At a junction where a main road meets a minor road, who has priority?","",
      [O("Traffic coming from the main road","","ئەو هاتوچۆیەی لە ڕێگا سەرەکییەکەوە دێت"),O("Traffic coming from the minor road","","ئەو هاتوچۆیەی لە ڕێگا لاوەکییەکەوە دێت"),O("Whoever arrives first","","ئەوەی یەکەم دەگات")],0,
      "Under Traffic Law No. 86 of 2004 priority always belongs to the main street, so at every junction the vehicles coming from it go first. Stay alert even so — many drivers are not careful about priority, and this is where crashes happen.","","لە یەکتربڕێکدا کە ڕێگایەکی سەرەکی بە ڕێگایەکی لاوەکییەوە دەگات، پێشڕەوی بۆ کێیە؟","ئەو هاتوچۆیەی لە ڕێگا سەرەکییەکەوە دێت. بەپێی یاسای هاتوچۆ ژمارە ٨٦ی ٢٠٠٤ پێشڕەوی هەمیشە بۆ شەقامە سەرەکییەکەیە، بۆیە لە هەر یەکتربڕێکدا ئەو سوارڕۆیانەی لێیەوە دێن یەکەم دەڕۆن. لەگەڵ ئەوەشدا ئاگاداربە — زۆر شۆفێر ڕەچاوی پێشڕەوی ناکەن، و لێرەدایە ڕووداوەکان ڕوودەدەن."),
    Q("rules",null,"You are reversing a car with a trailer attached. How much should you turn the steering wheel?","",
      [O("No more than a quarter or half a turn at a time","","زیاتر لە چارەکێک یان نیوێک لە هەر جارێکدا نا"),O("A full turn, to make the trailer respond","","سووڕانەوەیەکی تەواو، تا کەرەفانەکە کاردانەوەی هەبێت"),O("It does not matter how far you turn","","گرنگ نییە چەند بیسووڕێنیت")],0,
      "A trailer amplifies every input, so a small movement of the wheel becomes a large swing at the back — turn too far and it jack-knifes against the car. Have someone outside guiding you, and remember the trailer creates a blind area of its own.","","ئۆتۆمبیلێک بە کەرەفانەیەکەوە بە دواوە دەبەیت. دەبێت سوکانەکە چەند بسووڕێنیت؟","زیاتر لە چارەکێک یان نیوێک لە هەر جارێکدا نا. کەرەفانە هەر جوڵەیەک گەورە دەکاتەوە، بۆیە جوڵەیەکی بچووکی سوکان دەبێتە سووڕانەوەیەکی گەورە لە دواوە — زۆری بسووڕێنیت لەگەڵ ئۆتۆمبیلەکەدا دەبەریەککەوێت. کەسێک لە دەرەوە ڕێنماییت بکات، و لەبیرت بێت کەرەفانەکە ناوچەیەکی مردووی خۆی دروست دەکات."),
    Q("signs",null,"You cross a band of ridged lines painted across the road. What are they for?","",
      [O("To make you slow down before a hazard such as a bridge, bend, roundabout, tunnel or crossing","","بۆ ئەوەی خێرایی کەم بکەیتەوە پێش مەترسییەک وەک پرد، پێچ، فلکە، تونێل یان خەتی پەڕینەوە"),O("To mark the edge of the road","","بۆ دیاریکردنی لێواری ڕێگاکە"),O("To show where you may park","","بۆ پیشاندانی ئەو شوێنەی دەتوانیت پارک بکەیت")],0,
      "You feel and hear them before you have read any sign, which is the point — they appear before bridges, bends, roundabouts, tunnels, junctions, slopes, pedestrian crossings and toll points.","","بە دەستەیەک هێڵی برەودار تێدەپەڕیت کە بەسەر ڕێگاکەدا کێشراون. بۆ چین؟","بۆ ئەوەی خێرایی کەم بکەیتەوە پێش مەترسییەک. هەستیان پێدەکەیت و دەنگیان دەبیستیت پێش ئەوەی هیچ هێمایەک بخوێنیتەوە، و مەبەستیش هەر ئەوەیە — پێش پرد، پێچ، فلکە، تونێل، یەکتربڕ، لێژایی، خەتی پەڕینەوەی پیادە و خاڵی باج دەردەکەون."),Q("rules",null,"You park facing UPHILL beside a kerb. Which way do you turn the front wheels?","",
      [O("To the left, away from the kerb","","بەرەو چەپ، دوور لە شۆستەکە"),O("To the right, into the kerb","","بەرەو ڕاست، بەرەو شۆستەکە"),O("Straight ahead","","ڕاست بەرەو پێشەوە")],0,
      "Uphill the wheels go left, so if the car rolls back it turns into the kerb and stops. Downhill it is the opposite — wheels right, into the kerb. Either way, handbrake on and the gear in first or P.","","ڕوو لە هەوراز لەتەنیشت شۆستەیەک پارک دەکەیت. تایە پێشەوەکان بە کام لادا دەسووڕێنیت؟","بەرەو چەپ، دوور لە شۆستەکە. لە هەورازدا تایەکان بەرەو چەپ دەڕۆن، بۆیە ئەگەر ئۆتۆمبیلەکە بەرەو دواوە بجووڵێت بەرەو شۆستەکە دەسووڕێتەوە و دەوەستێت. لە نشێودا بەپێچەوانەیە — تایە بەرەو ڕاست، بەرەو شۆستەکە. لە هەردوو حاڵەتدا برێکی دەستی و گێر لەسەر یەک یان P."),
    Q("rules",null,"You need to run into a shop for two minutes. May you leave a small child alone in the car?","",
      [O("No — never leave a child alone in a vehicle","","نەخێر — هەرگیز منداڵ بە تەنها لە ئۆتۆمبیلدا مەهێڵە"),O("Yes, if the doors are locked","","بەڵێ، ئەگەر دەرگاکان قوفڵ بن"),O("Yes, if it is only a few minutes","","بەڵێ، ئەگەر تەنها چەند خولەکێک بێت")],0,
      "A child left alone can release the handbrake, knock the car out of gear, or be overcome by heat in minutes. There is no safe length of time and no safe version of it.","","پێویستت بە چوونە ناو دوکانێک هەیە بۆ دوو خولەک. بۆت هەیە منداڵێکی بچووک بە تەنها لە ئۆتۆمبیلەکەدا بهێڵیت؟","نەخێر — هەرگیز منداڵ بە تەنها لە ئۆتۆمبیلدا مەهێڵە. منداڵێکی بەتەنها دەتوانێت برێکی دەستی بەربدات، ئۆتۆمبیلەکە لە گێر دەربهێنێت، یان لە ماوەی چەند خولەکێکدا گەرما لێی بدات. هیچ ماوەیەکی سەلامەت نییە و هیچ شێوەیەکی سەلامەتیشی نییە."),
    Q("rules",null,"When you have finished parking, how far may the car be from the kerb?","",
      [O("No more than 30 cm","","زیاتر لە ٣٠ سم نا"),O("Up to one metre","","تا یەک مەتر"),O("It does not matter","","گرنگ نییە")],0,
      "Thirty centimetres, whether you park parallel, at 45 degrees or at 90 degrees. Take one bay only, leave about a metre and a half to the car in front, and check your mirrors and blind spot before opening the door.","","کاتێک پارککردنت تەواو کرد، ئۆتۆمبیلەکە دەتوانێت چەند لە شۆستەکە دوور بێت؟","زیاتر لە ٣٠ سم نا، جا بە شێوەی تەریب پارک بکەیت، بە گۆشەی ٤٥ یان بە گۆشەی ٩٠. تەنها یەک شوێن بگرە، نزیکەی مەتر و نیوێک بۆ ئۆتۆمبیلی پێشەوە بەجێبهێڵە، و پێش کردنەوەی دەرگا سەیری ئاوێنە و ناوچەی مردوو بکە."),
    Q("rules",null,"The light has just turned green and you are turning at the junction. What is the main thing to watch for?","",
      [O("Cyclists and pedestrians still crossing the road you are turning into","","پاسکیلسوار و پیادەی هێشتا خەریکی پەڕینەوەی ئەو ڕێگایەن کە بۆی دەسووڕێیتەوە"),O("Nothing — green means the way is yours","","هیچ — سەوز واتە ڕێگاکە هی تۆیە"),O("Only the cars behind you","","تەنها ئۆتۆمبیلەکانی دواتەوە")],0,
      "Green releases you, not the crossing. People who started while the light was against you are still out there, and a cyclist alongside may be going straight on. Enter a junction slowly enough that you could still stop.","","چراکە تازە سەوز بووە و لە یەکتربڕەکەدا دەسووڕێیتەوە. گرنگترین شت بۆ چاودێری چییە؟","پاسکیلسوار و پیادەی هێشتا خەریکی پەڕینەوەی ئەو ڕێگایەن کە بۆی دەسووڕێیتەوە. سەوز تۆ ئازاد دەکات، نەک خەتی پەڕینەوەکە. ئەو کەسانەی دەستیان پێکردووە کاتێک چراکە دژی تۆ بوو هێشتا لەوێن، و پاسکیلسوارێکی تەنیشتیشت لەوانەیە ڕاستەوڕاست بڕوات. بەو هێواشییە بچۆ ناو یەکتربڕەکە کە بتوانیت هێشتا بوەستیت."),
    Q("rules",null,"There is a stop line painted at the end of the street. Where must you stop?","",
      [O("Completely before the line, before entering the junction","","بە تەواوی پێش هێڵەکە، پێش چوونە ناو یەکتربڕەکە"),O("On the line, so you can see better","","لەسەر هێڵەکە، تا باشتر ببینیت"),O("Past the line, level with the crossing","","دوای هێڵەکە، یەکسان لەگەڵ خەتی پەڕینەوە")],0,
      "Stop fully before the line and give way to the pedestrians and vehicles that have priority. If there is no stop line, stop before the pedestrian crossing; if there is neither, stop far enough back that people can still cross.","","هێڵی وەستان لە کۆتایی شەقامەکەدا کێشراوە. دەبێت لە کوێ بوەستیت؟","بە تەواوی پێش هێڵەکە، پێش چوونە ناو یەکتربڕەکە، و ڕێگە بدە بەو پیادە و سوارڕۆیانەی پێشڕەوییان هەیە. ئەگەر هێڵی وەستان نەبوو، پێش خەتی پەڕینەوەی پیادە بوەستە؛ ئەگەر هیچیان نەبوو، بەو دوورییە بوەستە کە خەڵک هێشتا بتوانن بپەڕنەوە."),Q("rules",null,"You are leaving a roundabout. Which signal should you give?","",
      [O("Signal right just as you pass the exit before yours","","تەنها کاتێک بە دەرچوونی پێش هی خۆتدا تێدەپەڕیت ئاماژەی ڕاست بدە"),O("Signal right as soon as you enter the roundabout","","هەرکە چوویتە ناو فلکەکە ئاماژەی ڕاست بدە"),O("No signal is needed on a roundabout","","لە فلکەدا پێویست بە هیچ ئاماژەیەک ناکات")],0,
      "Signalling right too early tells the driver waiting at the exit before yours that you are coming off there, and they may pull out into you. Give the signal only once you are passing that exit.","","خەریکی دەرچوونیت لە فلکەیەک. کام ئاماژە دەدەیت؟","تەنها کاتێک بە دەرچوونی پێش هی خۆتدا تێدەپەڕیت ئاماژەی ڕاست بدە. ئاماژەدانی زوو بە ڕاست بەو شۆفێرە دەڵێت کە لەلای دەرچوونی پێشتر چاوەڕێیە کە تۆ لەوێ دەردەچیت، و لەوانەیە بێتە ناو ڕێگاکەت."),
    Q("rules",null,"Why are roundabouts used instead of ordinary crossroads?","",
      [O("They cut the severity of collisions, hold speeds down, save fuel and keep traffic flowing","","توندی پێکدادانەکان کەم دەکەنەوە، خێرایی دادەبەزێنن، سووتەمەنی دەپارێزن و هاتوچۆ بەردەوام دەکەن"),O("They let traffic travel faster through the junction","","ڕێگە دەدەن هاتوچۆ خێراتر بە یەکتربڕەکەدا بڕوات"),O("They remove the need to give way to anyone","","پێویستی ڕێگەدان بە کەس لادەبەن")],0,
      "A roundabout removes the head-on and right-angle impacts that make crossroads collisions so severe, keeps speeds down, and lets traffic keep moving instead of idling at a red light — which cuts both fuel use and pollution.","","بۆچی فلکە لەبری چوارڕیانی ئاسایی بەکاردەهێنرێت؟","توندی پێکدادانەکان کەم دەکەنەوە، خێرایی دادەبەزێنن، سووتەمەنی دەپارێزن و هاتوچۆ بەردەوام دەکەن. فلکە ئەو پێکدادانە ڕووبەڕوو و گۆشە ڕاستانە لادەبات کە پێکدادانی چوارڕیان ئەوەندە توند دەکەن، خێرایی نزم ڕادەگرێت، و ڕێگە دەدات هاتوچۆ بەردەوام بێت لەبری وەستان لەلای چرای سوور — کە هەم سووتەمەنی هەم پیسبوونی ژینگە کەم دەکاتەوە."),
    Q("signs",null,"A blue lane board shows speed numbers in white circles, and another shows them in red-ringed circles. What is the difference?","",
      [O("Blue circles set a minimum speed for the lane; red rings set a maximum","","بازنە سپییەکان کەمترین خێرایی ڕێڕەوەکە دیاری دەکەن؛ بازنە سوورەکان زۆرترین"),O("They mean the same thing","","هەردووکیان هەمان واتا دەگەیەنن"),O("Red rings are only advisory","","بازنە سوورەکان تەنها ئامۆژگارین")],0,
      "On a lane board the circle style tells you which kind of limit it is: a plain circle on the blue board is the minimum permitted speed for that lane, while a red-ringed circle with black figures is the maximum. Read the style before the number.","","تابلۆیەکی شینی ڕێڕەو ژمارەی خێرایی لە بازنەی سپیدا پیشان دەدات، و یەکێکی تر لە بازنەی سوورەوە. جیاوازییەکە چییە؟","بازنە سپییەکان کەمترین خێرایی ڕێڕەوەکە دیاری دەکەن؛ بازنە سوورەکان زۆرترین. لەسەر تابلۆی ڕێڕەو شێوەی بازنەکە پێت دەڵێت چ جۆرە سنوورێکە: بازنەی سادە لەسەر تابلۆی شین کەمترین خێراییی ڕێگەپێدراوی ئەو ڕێڕەوەیە، بەڵام بازنەی بە بازنەی سوورەوە و ژمارەی ڕەش زۆرترینە. پێش ژمارەکە شێوەکە بخوێنەوە."),
    // ---- Official textbook, part 2 (topics 120-160, book pages 164-224) ----
    // Segment marker (see BOOKSEG): keep this first and keep its wording.
    Q("rules",null,"On a sharp bend or the crest of a hill on a two-way road, what is forbidden?","",
      [O("Overtaking, parking and stopping","","تێپەڕاندن، پارککردن و وەستان"),O("Only parking","","تەنها پارککردن"),O("Nothing, if you drive slowly","","هیچ، ئەگەر بە هێواشی لێبخوڕیت")],0,
      "You cannot see far enough ahead to know the road is clear, and anyone coming the other way cannot see you either. Keep well to the right and do not create an obstacle where nobody can react in time.","","لە پێچێکی توند یان لەسەر لووتکەی بەرزاییەک لە ڕێگایەکی دوو ئاراستەدا، چی قەدەغەیە؟","بەقەدەر پێویست بەرچاوت ڕوون نییە تا بزانیت ڕێگاکە بەتاڵە، و ئەوەی بەرامبەرت دێت ئەویش تۆ نابینێت. باش بدە بە لای ڕاست و لەو شوێنەدا مەبە بە بەربەست کە کەس ناتوانێت بەکاتی خۆی وەڵام بداتەوە."),
    Q("rules",null,"You are going down a long, steep hill. What must you not do?","",
      [O("Coast with the gear in neutral or the clutch held down","","بە گێری بەتاڵ یان دەبریاژ داگیراو بڕۆیت"),O("Use a low gear","","گێرێکی نزم بەکاربهێنیت"),O("Keep well to the right","","باش بدەیت بە لای ڕاست")],0,
      "Coasting takes the engine out of the job of holding the car back, so everything falls on the brakes — and brakes that work continuously downhill overheat and fade. Choose a low gear before the descent, not halfway down it.","","بە شیوێکی درێژ و توندی هاتنە خوارەوەیت. چی نابێت بکەیت؟","ڕۆیشتن بە گێری بەتاڵ ئەرکی ڕاگرتنی ئۆتۆمبیل لە بزوێنەر دەسێنێتەوە، بۆیە هەموو بارەکە دەکەوێتە سەر بڕەیک — و بڕەیکی بەردەوام لە شیودا گەرم دەبێت و کاریگەرییەکەی لاواز دەبێت. پێش هاتنە خوارەوە گێرێکی نزم هەڵبژێرە، نەک لە نیوەی ڕێگادا."),
    Q("rules",null,"Visibility drops below about 100 metres in fog or heavy rain. Which lights do you use?","",
      [O("Dipped headlights (and fog lights if fitted)","","چرای نزم (و چرای تەم ئەگەر هەیە)"),O("Full beam, to see as far as possible","","چرای بەرز، بۆ ئەوەی تا دەکرێت دوور ببینیت"),O("Parking lights only","","تەنها چرای پارک")],0,
      "Full beam reflects back off fog and rain into your own eyes, so you see less, not more. Dipped beam throws light under the fog and — just as important — makes you visible to everyone else.","","لە تەم یان بارانی بەخوڕدا ڕوونی لە نزیکەی ١٠٠ مەتر کەمتر دەبێتەوە. کام چرا بەکاردەهێنیت؟","چرای بەرز لە تەم و بارانەوە دەگەڕێتەوە ناو چاوی خۆت، بۆیە کەمتر دەبینیت نەک زیاتر. چرای نزم ڕووناکی دەخاتە ژێر تەمەکەوە و — کە هەمان ئەندازە گرنگە — وا دەکات هەموو کەس بتبینێت."),
    Q("rules",null,"How big a gap should you keep from the vehicle in front in good conditions?","",
      [O("At least two seconds","","لانیکەم دوو چرکە"),O("At least two metres","","لانیکەم دوو مەتر"),O("One car length","","درێژی یەک ئۆتۆمبیل")],0,
      "Pick a fixed point ahead; when the car in front passes it, you should not reach it before you have counted two seconds. A distance in metres is useless because the faster you go the more metres you need, but the two seconds stay the same.","","لە بارودۆخی باشدا چەند مەودا لە ئۆتۆمبیلی پێشەوە دەهێڵیتەوە؟","خاڵێکی جێگیر لە پێشەوە هەڵبژێرە؛ کاتێک ئۆتۆمبیلی پێشەوە پێی تێدەپەڕێت، نابێت پێش ئەوەی دوو چرکە بژمێریت تۆ بگەیتێ. مەودا بە مەتر بەکەڵک نایەت چونکە هەرچەند خێراتر بیت مەتری زیاترت دەوێت، بەڵام دوو چرکەکە هەروەک خۆی دەمێنێتەوە."),
    Q("rules",null,"When should you stretch that gap to about four seconds?","",
      [O("In rain, snow or fog, and behind a heavy vehicle","","لە باران، بەفر و تەمدا، و لە دوای ئۆتۆمبیلێکی قورس"),O("Only at night","","تەنها بە شەو"),O("Never — two seconds always works","","هەرگیز — دوو چرکە هەمیشە بەسە")],0,
      "A wet or icy surface lengthens your braking distance well beyond what two seconds buys you, and behind a lorry you also cannot see past it to read the road ahead.","","کەی دەبێت ئەو مەودایە بکەیتە نزیکەی چوار چرکە؟","ڕووی تەڕ یان بەستوو دووری بڕەیکەکەت زۆر درێژتر دەکاتەوە لەوەی دوو چرکە پێت دەدات، و لە دوای بارهەڵگرێکەوە نایشتوانیت لە پێشەوەی ببینیت تا ڕێگاکە بخوێنیتەوە."),
    Q("rules",null,"Your car starts to skid. What is the correct response?","",
      [O("Ease off the accelerator and steer gently the way you want to go","","پێ لە پێدانەر لاببە و بە نەرمی ئاراستەی بکە بەو لایەی دەتەوێت بڕۆیت"),O("Brake as hard as you can","","بە هەموو هێزتەوە بڕەیک بگرە"),O("Turn the wheel sharply the other way","","سوکان بە توندی بۆ لای بەرامبەر بسووڕێنە")],0,
      "Hard braking locks the wheels and a locked wheel cannot steer at all. Lifting off restores grip, and small, smooth steering lets the tyres bite again — sudden movements only start a second skid.","","ئۆتۆمبیلەکەت دەست دەکات بە خلیسکان. وەڵامی دروست چییە؟","بڕەیکی توند تایەکان قوفڵ دەکات و تایەکی قوفڵکراو هەرگیز ئاراستە ناکات. لابردنی پێ گرتن دەگەڕێنێتەوە، و ئاراستەکردنی بچووک و نەرم وا دەکات تایەکان دیسان بگرن — جوڵەی لەناکاو تەنها خلیسکانێکی دووەم دەست پێدەکات."),
    Q("rules",null,"Why should you look under and around your car before starting it on a cold morning?","",
      [O("Cats and other animals shelter against the warm engine","","پشیلە و ئاژەڵی تر خۆیان دەدەنە پاڵ بزوێنەری گەرم"),O("To check the tax disc","","بۆ پشکنینی وەسڵی باج"),O("It is only needed in summer","","تەنها لە هاویندا پێویستە")],0,
      "A warm engine bay is the best shelter around on a freezing night, and an animal curled up there is completely hidden from the driver's seat. One walk around the car takes seconds.","","بۆچی لە بەیانییەکی ساردا پێش خاوکردنەوەی ئۆتۆمبیل دەبێت سەیری ژێر و دەوروبەری بکەیت؟","لە شەوێکی زۆر سارددا جێی بزوێنەری گەرم باشترین پەناگەیە، و ئاژەڵێک کە لەوێ خۆی کۆکردبێتەوە بە تەواوی لە جێگای شۆفێرەوە نادیارە. یەک سووڕانەوە بە دەوری ئۆتۆمبیلەکەدا چەند چرکەیەکە."),
    Q("rules",null,"You meet a herd of sheep or goats on a mountain road. What do you do?","",
      [O("Slow right down, wait, and do not sound the horn","","زۆر هێواش ببەرەوە، چاوەڕێ بکە، و بۆری لێمەدە"),O("Sound the horn to clear a path","","بۆری لێبدە تا ڕێگا چۆڵ بکات"),O("Drive through the gaps in the herd","","بە بۆشاییەکانی ناو ڕانەکەدا بڕۆ")],0,
      "A horn scatters animals unpredictably — often straight across your bonnet — and it can panic the herder's horse too. Patience costs a minute; a startled animal costs a windscreen or worse.","","لە ڕێگایەکی چیاییدا تووشی ڕانێک مەڕ یان بزن دەبیت. چی دەکەیت؟","بۆری ئاژەڵەکان بەشێوەیەکی پێشبینینەکراو پەرتەوازە دەکات — زۆر جار ڕاستەوخۆ بەردەم ئۆتۆمبیلەکەت — و دەکرێت ئەسپی شوانەکەش بتۆقێنێت. ئارامگرتن خولەکێک تێدەچێت؛ ئاژەڵێکی تۆقیو نرخی جامێک یان خراپتری دەوێت."),
    Q("rules",null,"It is a hot summer day. What must you never do?","",
      [O("Leave a child or an animal in a parked car","","منداڵ یان ئاژەڵ لە ئۆتۆمبیلی پارککراودا بەجێبهێڵیت"),O("Park in the shade","","لە سێبەردا پارک بکەیت"),O("Use the air conditioning","","کۆندیشن بەکاربهێنیت")],0,
      "The inside of a closed car climbs to lethal temperatures within minutes, and leaving a window cracked open does not stop it. Never leave them, even for a short errand.","","ڕۆژێکی گەرمی هاوینە. چی هەرگیز نابێت بکەیت؟","ناوەوەی ئۆتۆمبیلێکی داخراو لە ماوەی چەند خولەکێکدا دەگاتە پلەی گەرمی کوشندە، و بەجێهێشتنی پەنجەرەیەکی کەمێک کراوە ئەوە ناوەستێنێت. هەرگیز بەجێیان مەهێڵە، تەنانەت بۆ کارێکی کورتیش."),

    Q("rules",null,"You feel sleepy at the wheel. What actually works?","",
      [O("Stop somewhere safe and sleep","","لە شوێنێکی سەلامەت بوەستە و بخەوە"),O("Open the window and turn the radio up","","پەنجەرە بکەرەوە و ڕادیۆ بەرز بکەرەوە"),O("Drink coffee and carry on driving","","قاوە بخۆرەوە و بەردەوام بە لە لێخوڕین")],0,
      "Cold air and loud music wake you for a minute or two and then the drowsiness comes back stronger. Sleep is the only thing that repays the debt — the rest just hides it while you keep driving.","","لە پشت سوکاندا هەست بە خەواڵووبوون دەکەیت. بەڕاستی چی سوودی هەیە؟","هەوای سارد و مۆسیقای بەرز خولەکێک دوو خولەک بەئاگات دەهێننەوە و پاشان خەواڵووبوونەکە بەهێزتر دەگەڕێتەوە. خەو تاکە شتێکە قەرزەکە دەداتەوە — ئەوانی تر تەنها دەیشارنەوە لە کاتێکدا تۆ بەردەوامیت لە لێخوڕین."),
    Q("rules",null,"How long should you stay out of the driving seat after surgery under anaesthetic?","",
      [O("At least 24 to 48 hours, and longer if the doctor says so","","لانیکەم ٢٤ بۆ ٤٨ کاتژمێر، و زیاتریش ئەگەر پزیشک بڵێت"),O("Until you feel able to drive","","تا هەست بکەیت دەتوانیت لێبخوڕیت"),O("There is no need to wait","","پێویست ناکات چاوەڕێ بکەیت")],0,
      "Anaesthetic slows your thinking and reactions for far longer than it takes to feel awake, and that applies to a small procedure such as dental treatment too. Feeling fine is not the same as being fit to drive.","","دوای نەشتەرگەری بە بێهۆشکردن، چەند ماوە دەبێت لە جێگای شۆفێر دوور بیت؟","بێهۆشکەر بیرکردنەوە و وەڵامدانەوەکەت زۆر درێژتر لەوە هێواش دەکات کە پێویستە تا هەست بە بەئاگابوون بکەیت، و ئەمە بۆ کارێکی بچووکیش وەک چارەسەری ددان جێبەجێ دەبێت. هەستکردن بە باشی هەمان ئەوە نییە کە شیاوی لێخوڕین بیت."),
    Q("rules",null,"You have been prescribed a new medicine. What should you do before driving?","",
      [O("Read the leaflet or ask the doctor whether it affects driving","","ڕەنووسەکە بخوێنەرەوە یان لە پزیشک بپرسە ئایا کاریگەری لەسەر لێخوڕین هەیە"),O("Nothing — prescribed medicines are always safe","","هیچ — دەرمانی ڕەچەتەکراو هەمیشە سەلامەتە"),O("Take a double dose so it wears off faster","","بڕێکی دووقات وەربگرە تا زووتر بەسەربچێت")],0,
      "Painkillers, blood-pressure and allergy treatments and cold remedies can all dull you, some of them for days after you stop taking them. Mixing two medicines, or a medicine with alcohol, can be worse than either alone.","","دەرمانێکی نوێت بۆ ڕەچەتە کراوە. پێش لێخوڕین چی دەکەیت؟","دەرمانی ئازارشکێن، فشاری خوێن، هەستەوەری و هەڵامەت هەموویان دەتوانن سستت بکەن، هەندێکیان بۆ چەند ڕۆژێک دوای ئەوەی وازیان لێدەهێنیت. تێکەڵکردنی دوو دەرمان، یان دەرمان لەگەڵ مەی، دەکرێت لە هەریەکەیان بە تەنها خراپتر بێت."),
    Q("rules",null,"Which of these is a real effect of alcohol on a driver?","",
      [O("False confidence — you feel you are driving better than you are","","متمانەی بەخۆبوونی درۆیین — هەست دەکەیت باشتر لێدەخوڕیت لەوەی هەیت"),O("Sharper night vision","","بینینی شەوانەی تیژتر"),O("Faster reactions","","وەڵامدانەوەی خێراتر")],0,
      "That is exactly what makes it dangerous: alcohol removes the caution that would normally hold you back, while slowing your reactions and blurring your judgement of speed and distance.","","کامیان کاریگەرییەکی ڕاستەقینەی مەیە لەسەر شۆفێر؟","هەر ئەوەیە کە مەترسیداری دەکات: مەی ئەو وریایی لادەبات کە بەئاسایی ڕایدەگرتیت، لە هەمان کاتدا وەڵامدانەوەکەت هێواش دەکات و ناسینەوەی خێرایی و دوورییەکەت شێواو دەکات."),
    Q("rules",null,"Two people drink the same amount of alcohol. Who is affected more?","",
      [O("The smaller, lighter person","","ئەو کەسەی بچووکتر و سووکترە"),O("The bigger, heavier person","","ئەو کەسەی گەورەتر و قورسترە"),O("Body size makes no difference","","قەبارەی جەستە هیچ جیاوازییەک ناکات")],0,
      "The same quantity of alcohol is spread through less body mass, so the concentration in the blood is higher. Poor health, tiredness and stress each increase the effect as well.","","دوو کەس هەمان بڕ مەی دەخۆنەوە. کام زیاتر کاری تێدەکات؟","هەمان بڕ مەی بەسەر کێشێکی کەمتری جەستەدا بڵاو دەبێتەوە، بۆیە ڕێژەکەی لە خوێندا بەرزترە. نەخۆشی، ماندووبوون و فشاری دەروونیش هەریەکەیان کاریگەرییەکە زیاد دەکەن."),
    Q("rules",null,"You drank a lot last night. Can you drive to work in the morning?","",
      [O("Not necessarily — alcohol can still be in your blood","","بەپێویست نا — لەوانەیە مەی هێشتا لە خوێنتدا بێت"),O("Yes, a night's sleep always clears it","","بەڵێ، خەوی شەوێک هەمیشە پاکی دەکاتەوە"),O("Yes, as long as you feel fine","","بەڵێ، تا هەست بە باشی دەکەیت")],0,
      "Your body removes alcohol at a fixed slow rate that neither sleep, a shower nor coffee can speed up. You can be over the limit at breakfast and feel completely normal.","","دوێنێ شەو زۆرت خواردەوە. بەیانی دەتوانیت بۆ کار لێبخوڕیت؟","جەستەت مەی بە ڕێژەیەکی هێواشی جێگیر دەردەکات کە نە خەو، نە سەرشۆر و نە قاوە ناتوانن خێرای بکەن. دەکرێت لە کاتی نانی بەیانیدا لە سنوور تێپەڕاندبیت و بە تەواوی هەست بە ئاسایی بکەیت."),
    Q("rules",null,"Which type of drug makes a driver see or feel things that are not really there?","",
      [O("Hallucinogens","","وریناکەرەکان (هەڵوەسەکردن)"),O("Depressants","","ئارامکەرەوەکان"),O("Stimulants","","وریاکەرەوەکان")],0,
      "This is the most dangerous group behind a wheel, because the driver acts on a world that does not exist — the textbook's own image is of someone driving as though flying a plane.","","کام جۆری ماددەی هۆشبەر وا دەکات شۆفێر شتانێک ببینێت یان هەست پێبکات کە بوونیان نییە؟","ئەمە مەترسیدارترین کۆمەڵەیە لە پشت سوکاندا، چونکە شۆفێرەکە بەپێی جیهانێک کار دەکات کە بوونی نییە — وێنەی خودی کتێبەکە کەسێکە کە وەک فڕۆکەوانێک لێدەخوڕێت."),
    Q("rules",null,"How much water does the body need over 24 hours?","",
      [O("About 12 glasses","","نزیکەی ١٢ پەرداخ"),O("About 3 glasses","","نزیکەی ٣ پەرداخ"),O("Tea and coffee cover it","","چا و قاوە ئەوە دابین دەکەن")],0,
      "Even mild dehydration shows up as poor concentration, slower thinking and headache — all of which matter at the wheel. Tea and coffee do not replace water; they are drinks in their own right and are best kept to before the evening so they do not spoil your sleep.","","جەستە لە ماوەی ٢٤ کاتژمێردا چەند ئاوی پێویستە؟","تەنانەت کەمئاوییەکی سووکیش خۆی دەردەخات وەک تەرکیزی خراپ، بیرکردنەوەی هێواشتر و سەرێشە — هەموویان لە پشت سوکاندا گرنگن. چا و قاوە جێگای ئاو ناگرنەوە؛ خۆیان خواردنەوەن و باشترە پێش ئێوارە بخورێنەوە تا خەوت تێک نەدەن."),
    Q("rules",null,"Which of these puts a driver at risk just as much as illness does?","",
      [O("Anger, stress or being in a hurry","","تووڕەیی، فشاری دەروونی یان پەلەکردن"),O("Listening to a passenger","","گوێگرتن لە سەرنشینێک"),O("Driving a clean car","","لێخوڕینی ئۆتۆمبیلێکی پاک")],0,
      "The textbook is blunt about this: a bad state of mind is often more dangerous than a physical illness, precisely because the driver does not notice it. Leave earlier, and if you are angry let someone else drive.","","کامیان بە هەمان ئەندازەی نەخۆشی شۆفێر دەخاتە مەترسییەوە؟","کتێبەکە بەڕاشکاوی دەڵێت: بارودۆخێکی خراپی دەروونی زۆر جار لە نەخۆشییەکی جەستەیی مەترسیدارترە، بەهۆی ئەوەی شۆفێرەکە هەستی پێناکات. زووتر بەڕێکەوە، و ئەگەر تووڕەیت با کەسێکی تر لێبخوڕێت."),

    Q("rules",null,"Why should you not fill the fuel tank right to the top in summer?","",
      [O("Fire risk rises, and the extra weight burns more fuel","","مەترسی ئاگرکەوتنەوە بەرز دەبێتەوە، و کێشی زیادە سووتەمەنی زیاتر دەسووتێنێت"),O("The fuel goes stale","","سووتەمەنییەکە کۆن دەبێت"),O("It damages the engine","","زیان بە بزوێنەر دەگەیەنێت")],0,
      "Petrol expands as it warms. A brim-full tank has nowhere to put that expansion, and the extra load means you carry the weight of fuel you are not about to use.","","بۆچی لە هاویندا نابێت تانکی سووتەمەنی تا سەرەوە پڕ بکەیت؟","بەنزین بە گەرمبوون فراوان دەبێت. تانکێکی تا دەم پڕ هیچ شوێنێکی نییە بۆ ئەو فراوانبوونە، و بارە زیادەکەش واتای ئەوەیە کێشی سووتەمەنێک هەڵدەگریت کە بەم زووانە بەکاری ناهێنیت."),
    Q("rules",null,"What is forbidden while refuelling?","",
      [O("Smoking and using a mobile phone","","جگەرەکێشان و بەکارهێنانی مۆبایل"),O("Switching the engine off","","کوژاندنەوەی بزوێنەر"),O("Standing beside the car","","وەستان لەتەنیشت ئۆتۆمبیلەکە")],0,
      "Petrol vapour sits invisibly around the filler, and it only needs one spark. Leaving the safety catch on the nozzle wedged open so you can walk away is a bad idea for the same reason.","","لە کاتی پڕکردنی سووتەمەنیدا چی قەدەغەیە؟","هەڵمی بەنزین بە نەبینراوی لە دەوری دەمی تانکەکە کۆدەبێتەوە، و تەنها یەک پریشک بەسە. بەجێهێشتنی قوفڵی سەلامەتی بنچینەکە بە کراوەیی تا بتوانیت دووربکەویتەوە بۆ هەمان هۆکار بیرۆکەیەکی خراپە."),
    Q("rules",null,"How much of a car's fuel use is down to how the driver drives?","",
      [O("About 45%, and good technique can cut about 30%","","نزیکەی ٤٥٪، و شێوازی باش دەتوانێت نزیکەی ٣٠٪ کەم بکاتەوە"),O("About 5%","","نزیکەی ٥٪"),O("None — it depends only on the engine","","هیچ — تەنها بە بزوێنەرەوە بەندە")],0,
      "That is the whole case for smooth driving: it is the single biggest lever you personally control. Harsh acceleration and late braking cost fuel, brakes, tyres and safety together.","","چەند لە بەکارهێنانی سووتەمەنی ئۆتۆمبیل بەو شێوەیەوە بەندە کە شۆفێرەکە لێدەخوڕێت؟","ئەمە هەموو بەڵگەی لێخوڕینی نەرمە: گەورەترین دەستەوسانە کە خۆت کۆنترۆڵی دەکەیت. خێراکردنی توند و بڕەیکی درەنگ بە یەکەوە سووتەمەنی، بڕەیک، تایە و سەلامەتی دەخوات."),
    Q("mech",null,"When should you change up a gear to save fuel?","",
      [O("Before about 2500 rpm in a petrol car, 2000 in a diesel","","پێش نزیکەی ٢٥٠٠ خولانەوە لە ئۆتۆمبیلی بەنزینی، ٢٠٠٠ لە دیزڵی"),O("Only at maximum revs","","تەنها لە بەرزترین خولانەوەدا"),O("Gear choice does not affect fuel","","هەڵبژاردنی گێر کاریگەری لەسەر سووتەمەنی نییە")],0,
      "Change up as early as the engine will comfortably take it. Holding a low gear at high revs pours fuel through the engine and makes far more noise for no extra progress.","","کەی دەبێت گێر بەرز بکەیتەوە بۆ پاشەکەوتی سووتەمەنی؟","هەرچەند زوو کە بزوێنەر بە ئاسوودەیی هەڵیدەگرێت گێر بەرز بکەرەوە. ڕاگرتنی گێرێکی نزم لە خولانەوەی بەرزدا سووتەمەنی بە بزوێنەردا دەڕژێنێت و دەنگێکی زۆر زیاتر دروست دەکات بێ ئەوەی پێشکەوتنێکی زیادە بکات."),
    Q("mech",null,"You will be stopped for more than a minute. What is the eco-friendly action?","",
      [O("Switch the engine off","","بزوێنەر بکوژێنەرەوە"),O("Leave it idling — restarting uses more fuel","","بەبۆشی بیهێڵەرەوە — دووبارە خاوکردنەوە سووتەمەنی زیاتر دەخوات"),O("Rev it occasionally","","کاتی خۆی خولانەوەکەی بەرز بکەرەوە")],0,
      "An idling engine returns exactly zero distance for the fuel it burns. The same goes for warming up on a cold morning: about a minute is enough, then drive away gently and let the car warm as it moves.","","زیاتر لە خولەکێک وەستاویت. کاری ژینگەپارێزانە چییە؟","بزوێنەرێکی بەبۆش بەرامبەر ئەو سووتەمەنییەی دەیسووتێنێت هیچ مەودایەک نابڕێت. هەمان شت بۆ گەرمکردنەوە لە بەیانییەکی سارددا: نزیکەی خولەکێک بەسە، پاشان بە نەرمی بەڕێکەوە و با ئۆتۆمبیلەکە لە کاتی جوڵاندا گەرم بێت."),
    Q("rules",null,"Which of these counts as pollution caused by traffic?","",
      [O("Air, water, soil, noise and light pollution","","پیسبوونی هەوا، ئاو، خاک، دەنگ و ڕووناکی"),O("Only exhaust fumes","","تەنها دووکەڵی ئەگزۆز"),O("Only engine noise","","تەنها دەنگی بزوێنەر")],0,
      "The textbook lists all five. Washing your car in the street sends detergent and oil into the drains, and pouring waste oil down a gutter is both illegal and long-lasting damage.","","کامیان بە پیسبوونی بەهۆی هاتوچۆوە دادەنرێت؟","کتێبەکە هەر پێنجەکە دەژمێرێت. شوشتنی ئۆتۆمبیلەکەت لەسەر شەقام مادەی شوشتن و ڕۆن دەنێرێتە ناو ئاوەڕۆکان، و ڕشتنی ڕۆنی بەکارهاتوو بۆ ناو ئاوەڕۆ هەم یاسایی نییە هەم زیانێکی درێژخایەنە."),

    Q("firstaid",null,"What are the three aims of first aid?","",
      [O("Preserve life, stop things getting worse, aid recovery","","پاراستنی ژیان، ڕێگرتن لە خراپتربوون، خێراکردنی چاکبوونەوە"),O("Diagnose, treat and discharge","","دەستنیشانکردن، چارەسەر و بەڕێکردن"),O("Move the casualty, call a taxi, wait","","گواستنەوەی برینداری، بانگکردنی تاکسی، چاوەڕوانی")],0,
      "First aid is not medical treatment — it is what keeps someone alive and stable until the ambulance arrives. Anyone may give it, provided they do it properly and do not make things worse.","","سێ ئامانجی فریاگوزاری سەرەتایی چین؟","فریاگوزاری سەرەتایی چارەسەری پزیشکی نییە — ئەوەیە کە کەسێک بە زیندوویی و جێگیری ڕادەگرێت تا ئەمبولانس دەگات. هەر کەسێک دەتوانێت ئەنجامی بدات، بەمەرجێک بە دروستی بیکات و بارەکە خراپتر نەکات."),
    Q("firstaid",null,"You are first to arrive at a crash. What comes first?","",
      [O("Make the scene safe — park clear, hazard lights on","","شوێنەکە سەلامەت بکە — دوور پارک بکە، هێمای وریاکردنەوە دابگیرسێنە"),O("Pull the casualties out of the cars","","بریندارەکان لە ئۆتۆمبیلەکان ڕابکێشە دەرەوە"),O("Photograph the scene for the police","","وێنەی شوێنەکە بۆ پۆلیس بگرە")],0,
      "You are no use to anybody if you become the second casualty. Park somewhere safe, put the hazards on, check for fire or the smell of fuel, and look for children who may have wandered from the scene.","","یەکەم کەسیت دەگەیتە شوێنی ڕوودانێک. چی لە پێشەوەیە؟","ئەگەر ببیت بە قوربانی دووەم بۆ هیچ کەس بەکەڵک نایەیت. لە شوێنێکی سەلامەت پارک بکە، هێمای وریاکردنەوە دابگیرسێنە، سەیری ئاگر یان بۆنی سووتەمەنی بکە، و بەدوای منداڵدا بگەڕێ کە لەوانەیە لە شوێنەکە دوورکەوتبێتنەوە."),
    Q("firstaid",null,"When may you move an injured person after a crash?","",
      [O("Only when they are in direct danger, such as fire","","تەنها کاتێک لە مەترسی ڕاستەوخۆدان، وەک ئاگر"),O("Always, to get them off the road","","هەمیشە، بۆ لابردنیان لە ڕێگا"),O("Whenever they ask you to","","هەر کاتێک داوات لێبکەن")],0,
      "Neck and spine injuries do not show from the outside, and moving someone can turn a survivable injury into a permanent one. If you truly must move them, support the head and neck in line with the body.","","کەی بۆت هەیە کەسێکی بریندار دوای ڕوودان بجوڵێنیت؟","تەنها کاتێک لە مەترسی ڕاستەوخۆدان، وەک ئاگر.  برینی ملی و بڕبڕەی پشت لە دەرەوە دیار نین، و جوڵاندنی کەسێک دەتوانێت برینێکی چارەسەرکراو بکات بە یەکێکی هەمیشەیی. ئەگەر بەڕاستی ناچار بوویت، سەر و مل لەگەڵ جەستەدا بە ڕێکی بگرە."),
    Q("firstaid",null,"A motorcyclist is lying injured, still wearing the helmet. What do you do?","",
      [O("Leave the helmet on for the paramedics","","کڵاوەکە لەسەری بهێڵەرەوە بۆ تیمی فریاگوزاری"),O("Remove it so they can breathe","","لایبەرە تا بتوانێت هەناسە بدات"),O("Remove it only if they are conscious","","تەنها ئەگەر بەهۆشە لایبەرە")],0,
      "Taking a helmet off means moving the head and neck, which is exactly what you are trying to avoid. Leave it to the crew who are trained to do it as a pair.","","ماتۆڕسکیلسوارێک بە بریندارییەوە کەوتووە و هێشتا کڵاوی سەلامەتی لەسەرە. چی دەکەیت؟","لابردنی کڵاوێک واتای جوڵاندنی سەر و ملە، کە هەر ئەوەیە هەوڵدەدەیت خۆی لێبپارێزیت. بیهێڵەرەوە بۆ ئەو تیمەی ڕاهێنراوە بە دوو کەس ئەنجامی بدات."),
    Q("firstaid",null,"What is the compression-to-breath ratio in adult CPR?","",
      [O("30 compressions then 2 breaths","","٣٠ پەستان پاشان ٢ هەناسە"),O("10 compressions then 5 breaths","","١٠ پەستان پاشان ٥ هەناسە"),O("2 compressions then 30 breaths","","٢ پەستان پاشان ٣٠ هەناسە")],0,
      "Press in the centre of the chest, about 5 cm deep, at 100 to 120 compressions per minute. Before you start, check that the scene is safe and that the person really is unresponsive.","","لە بووژاندنەوەی دڵی گەورەساڵاندا ڕێژەی پەستان بۆ هەناسە چەندە؟","لە ناوەڕاستی سنگدا پەستان بدە، بە قووڵایی نزیکەی ٥ سم، بە ڕێژەی ١٠٠ بۆ ١٢٠ پەستان لە خولەکێکدا. پێش دەستپێکردن، دڵنیابە شوێنەکە سەلامەتە و کەسەکە بەڕاستی وەڵام نادات."),
    Q("firstaid",null,"Bright red blood is spurting from a wound. What does that tell you?","",
      [O("It is arterial bleeding — the most dangerous kind","","خوێنبەربوونی لوولە خوێنبەرەکانە — مەترسیدارترین جۆر"),O("It is a minor surface graze","","خوڕانەوەیەکی سووکی ڕووکەشە"),O("It is venous bleeding","","خوێنبەربوونی لوولە خوێنهێنەرەکانە")],0,
      "Bright red and pulsing means it is coming straight from the heart under pressure, and it must be stopped at once. Dark red blood that flows steadily is venous — serious, but less immediately life-threatening.","","خوێنی سووری گەش بە فیشقە لە برینێکەوە دێتە دەرەوە. ئەمە چیت پێدەڵێت؟","سووری گەش و لێدەردار واتای ئەوەیە ڕاستەوخۆ لە دڵەوە بە فشار دێت، و دەبێت دەستبەجێ بوەستێنرێت. خوێنی سووری ڕەشباو کە بەردەوام دەڕوات لە لوولە خوێنهێنەرەکانەوەیە — مەترسیدارە، بەڵام کەمتر ژیان لە ساتەوەختدا دەخاتە مەترسییەوە."),
    Q("firstaid",null,"A large piece of glass is embedded deep in a wound. What do you do?","",
      [O("Leave it in place and press around it","","لە جێی خۆی بیهێڵەرەوە و بە دەوریدا پەستان بدە"),O("Pull it straight out","","ڕاستەوخۆ ڕایبکێشە دەرەوە"),O("Push it in further to seal the wound","","زیاتر پاڵی پێوەبنێ تا برینەکە دابخات")],0,
      "The object is partly plugging the wound; pulling it out opens the bleeding wide and can tear more tissue on the way. Pad around it and let the hospital remove it.","","پارچەیەکی گەورەی شووشە بە قووڵی چووەتە ناو برینێک. چی دەکەیت؟","شتەکە بەشێک لە برینەکە دادەخات؛ ڕاکێشانی دەرەوەی خوێنبەربوونەکە فراوان دەکاتەوە و دەتوانێت لە ڕێگادا شانەی زیاتر بدڕێنێت. بە دەوریدا داپۆشە و با نەخۆشخانە لایبەرێت."),
    Q("firstaid",null,"Someone has a nosebleed. What is the correct position?","",
      [O("Sitting up, head tilted forward, pinching the soft part","","دانیشتوو، سەر بەرەو پێشەوە، لە بەشە نەرمەکەی پەستان بدە"),O("Lying down with the head back","","پاڵکەوتوو و سەر بەرەو دواوە"),O("Standing with the head tilted back","","وەستاو و سەر بەرەو دواوە لار")],0,
      "Tilting the head back sends blood down the throat, which causes choking and vomiting. Pinch just below the bridge of the nose for at least 10 to 15 minutes without letting go to check.","","کەسێک لووتی خوێن دەکات. جێگای دروست چییە؟","لارکردنەوەی سەر بۆ دواوە خوێن دەنێرێتە خوارەوە بۆ قوڕگ، کە دەبێتە هۆی خنکان و ڕشانەوە. لە ژێر پردی لووتەوە پەستان بدە بۆ لانیکەم ١٠ بۆ ١٥ خولەک بێ ئەوەی بەریدەیت بۆ پشکنین."),
    Q("firstaid",null,"What is the difference between a closed and an open fracture?","",
      [O("In an open fracture the bone breaks through the skin","","لە شکانی کراوەدا ئێسک پێستەکە دەبڕێت"),O("A closed fracture is always more serious","","شکانی داخراو هەمیشە مەترسیدارترە"),O("There is no medical difference","","هیچ جیاوازییەکی پزیشکی نییە")],0,
      "A closed fracture stays under intact skin — you see pain, swelling, discolouring and deformity. An open one adds a wound and bleeding, and with it a real risk of infection.","","جیاوازی نێوان شکانی داخراو و کراوە چییە؟","لە شکانی کراوەدا ئێسک پێستەکە دەبڕێت. شکانی داخراو لە ژێر پێستی ساغدا دەمێنێتەوە — ئازار، ئاوسان، گۆڕانی ڕەنگ و ناڕێکی دەبینیت. کراوەکە برین و خوێنبەربوونیشی لەگەڵدایە، و لەگەڵ ئەوەشدا مەترسییەکی ڕاستەقینەی هەوکردن."),
    Q("firstaid",null,"How do you treat a burn at the scene?","",
      [O("Cool it with water for at least 10 to 15 minutes","","بە ئاو ساردی بکەرەوە بۆ لانیکەم ١٠ بۆ ١٥ خولەک"),O("Cover it with ice","","بە سەهۆڵ دایپۆشە"),O("Rub cream into it straight away","","دەستبەجێ کرێم بیخە سەری")],0,
      "Cool running water carries the heat away and limits how deep the burn goes. Take off rings, watches and belts near the burn before it swells, and cover it with something clean that will not stick.","","لە شوێنی ڕوودان چۆن سووتانێک چارەسەر دەکەیت؟","ئاوی سارد گەرمییەکە دەبات و سنووری قووڵبوونەوەی سووتانەکە دەبەستێتەوە. پێش ئاوسان ئەنگوستیلە، کاتژمێر و قایش لە نزیک سووتانەکە لابەرە، و بە شتێکی پاک دایپۆشە کە نەنووسێت پێوەی."),
    Q("firstaid",null,"Someone is bitten by a snake or stung by a scorpion. What must you NOT do?","",
      [O("Cut the wound, suck out the venom or apply ice","","برینەکە ببڕیت، ژەهرەکە هەڵمژیت یان سەهۆڵی بخەیتە سەر"),O("Keep them still and calm","","بێجوڵە و ئارامیان ڕابگریت"),O("Remove rings and watches","","ئەنگوستیلە و کاتژمێر لابەیت")],0,
      "Cutting and sucking spread the venom and add infection; ice damages the tissue further. Keep the person still so the venom moves slowly, wash the site, remove anything tight before swelling, and call 122.","","کەسێک مار پێیدا داوە یان دووپشک پێیوەداوە. چی نابێت بکەیت؟","بڕین و هەڵمژین ژەهرەکە بڵاو دەکەنەوە و هەوکردنیش زیاد دەکەن؛ سەهۆڵ زیانی زیاتر بە شانەکە دەگەیەنێت. کەسەکە بێجوڵە ڕابگرە تا ژەهرەکە بە هێواشی بجوڵێت، شوێنەکە بشۆ، پێش ئاوسان هەر شتێکی توند لابەرە، و پەیوەندی بە ١٢٢ ەوە بکە."),
    Q("firstaid",null,"Should you give an injured person food or a drink at the scene?","",
      [O("No — nothing by mouth until the paramedics arrive","","نەخێر — هیچ بە دەم نەدرێت تا تیمی فریاگوزاری دەگات"),O("Yes, water helps with shock","","بەڵێ، ئاو بۆ شۆک سوودی هەیە"),O("Yes, sweet tea is best","","بەڵێ، چای شیرین باشترینە")],0,
      "They may need an anaesthetic at hospital, and anything in the stomach makes that dangerous. If they are unconscious, food or drink can also block the airway.","","دەبێت لە شوێنی ڕووداودا خواردن یان خواردنەوە بدەیت بە کەسێکی بریندار؟","لەوانەیە لە نەخۆشخانەدا پێویستیان بە بێهۆشکەر بێت، و هەر شتێک لە گەدەدا بێت ئەوە مەترسیدار دەکات. ئەگەر لە هۆش خۆی چووبێت، خواردن یان خواردنەوە دەتوانێت ڕێڕەوی هەناسەش ببەستێت."),
    Q("firstaid",null,"Which emergency numbers does the textbook give for a crash in the Kurdistan Region?","",
      [O("911 for any emergency — or 115 fire, 440 traffic police, 104 emergency police, 122 ambulance","","٩١١ بۆ هەر فریاکەوتنێک — یان ١١٥ ئاگرکوژێنەوە، ٤٤٠ پۆلیسی هاتوچۆ، ١٠٤ پۆلیسی فریاکەوتن، ١٢٢ فریاگوزاری"),O("Only 911","","تەنها ٩١١"),O("Only 122","","تەنها ١٢٢")],0,
      "The handbook puts 911 first for any sudden emergency, then lists the specific lines. At a crash you may need more than one service — fire for a fuel leak, ambulance for casualties, traffic police for the report — so learn the whole set.","","کتێبەکە کام ژمارەی فریاکەوتن بۆ ڕوودانێک لە هەرێمی کوردستان دەدات؟","کتێبەکە ٩١١ دەخاتە پێشەوە بۆ هەر بارودۆخێکی کتوپڕ، پاشان هێڵە دیاریکراوەکان ڕیز دەکات. لە ڕوودانێکدا لەوانەیە پێویستت بە زیاتر لە خزمەتگوزارییەک بێت — ئاگرکوژێنەوە بۆ دزەکردنی سووتەمەنی، فریاگوزاری بۆ برینداران، پۆلیسی هاتوچۆ بۆ ڕاپۆرتەکە — بۆیە هەموو کۆمەڵەکە فێربە."),

    Q("rules",null,"Your car breaks down on the road. Where do you place the warning triangle?","",
      [O("About 50 m behind the car, at the right-hand edge","","نزیکەی ٥٠ مەتر لە دوای ئۆتۆمبیلەکە، لە لێواری لای ڕاست"),O("On the roof of the car","","لەسەر سەربانی ئۆتۆمبیلەکە"),O("Directly behind the bumper","","ڕاستەوخۆ لە پشت بەمپەرەکە")],0,
      "The point of the triangle is to give following traffic time to react, which it cannot do if the triangle appears at the same moment as your car. Put the hazard lights on as well, and never stop in a tunnel or under a bridge if you have any choice.","","ئۆتۆمبیلەکەت لەسەر ڕێگا پەکی دەکەوێت. سێگۆشەی وریاکردنەوە لەکوێ دادەنێیت؟","مەبەست لە سێگۆشەکە ئەوەیە کاتی وەڵامدانەوە بە هاتوچۆی دواوە بدات، کە ناتوانێت ئەوە بکات ئەگەر سێگۆشەکە لە هەمان ساتی ئۆتۆمبیلەکەتدا دەربکەوێت. هێمای وریاکردنەوەش دابگیرسێنە، و ئەگەر هەڵبژاردنت هەبێت هەرگیز لە تونێل یان لە ژێر پردێکدا مەوەستە."),
    Q("mech",null,"Smoke is rising from under the bonnet. What do you do?","",
      [O("Do not raise the bonnet fully — extra oxygen feeds the fire","","بۆنیتەکە بە تەواوی بەرز مەکەرەوە — ئۆکسیجینی زیادە ئاگرەکە خۆراک دەدات"),O("Open the bonnet wide to cool it","","بۆنیتەکە بە پانی بکەرەوە تا سارد بێتەوە"),O("Pour water over the engine","","ئاو بەسەر بزوێنەردا بڕێژە")],0,
      "Lifting the bonnet feeds air to a smouldering fire and can turn it into flames in your face. Get everyone out and well clear, and only use an extinguisher if you have been trained and the fire is still small.","","دووکەڵ لە ژێر بۆنیتەوە بەرز دەبێتەوە. چی دەکەیت؟","بەرزکردنەوەی بۆنیت هەوا دەداتە ئاگرێکی هێمن و دەتوانێت بیکات بە گڕ لە ڕووتدا. هەموو کەسێک بێنە دەرەوە و باش دووریان بخەرەوە، و تەنها ئەگەر ڕاهێنراوبیت و ئاگرەکە هێشتا بچووکە ئاگرکوژێنەوە بەکاربهێنە."),
    Q("mech",null,"Which class of extinguisher is meant for burning fuel or oil?","",
      [O("Class B","","پۆلی B"),O("Class A","","پۆلی A"),O("Class C","","پۆلی C")],0,
      "A is for cloth, wood, rubber and paper; B is for fuel, oil and paint; C is for electrical fires; D is for burning metals and K for cooking oil. A car fire that starts at the engine is usually a B or a C.","","کام پۆلی ئاگرکوژێنەوە بۆ سووتانی سووتەمەنی یان ڕۆنە؟","A بۆ قوماش، دار، لاستیک و کاغەزە؛ B بۆ سووتەمەنی، ڕۆن و بۆیەیە؛ C بۆ ئاگری کارەبایی؛ D بۆ کانزا گڕگرتووەکان و K بۆ ڕۆنی چێشتلێنان. ئاگری ئۆتۆمبیل کە لە بزوێنەرەوە دەست پێدەکات بەزۆری B یان C ە."),
    Q("mech",null,"What is the correct way to use a fire extinguisher?","",
      [O("Pull the pin, aim at the base of the fire, squeeze, sweep","","بزمارەکە ڕابکێشە، ئاراستەی بنچینەی ئاگرەکە بکە، بیگوشە، بیسووڕێنە"),O("Aim at the top of the flames","","ئاراستەی سەرەوەی گڕەکان بکە"),O("Spray from as close as you can get","","لە نزیکترین شوێنەوە بیپرژێنە")],0,
      "Flames are only the visible part; the fuel is at the base, and that is what has to be smothered. Stand at a safe distance with an escape route behind you, and check the extinguisher is in date before you ever need it.","","ڕێگای دروستی بەکارهێنانی ئاگرکوژێنەوە چییە؟","گڕەکان تەنها بەشە بینراوەکەن؛ سووتەمەنییەکە لە بنچینەدایە، و هەر ئەوەیە دەبێت بخنکێنرێت. لە دوورییەکی سەلامەتەوە بوەستە بە ڕێگای دەربازبوونێک لە پشتتەوە، و پێش ئەوەی هەرگیز پێویستت پێی بێت دڵنیابە بەرواری بەسەرچوونی تێنەپەڕیوە."),
    Q("rules",null,"You are involved in a crash. Are you allowed to drive away?","",
      [O("No — leaving the scene is a serious offence","","نەخێر — بەجێهێشتنی شوێنەکە تاوانێکی قورسە"),O("Yes, if the other driver caused it","","بەڵێ، ئەگەر شۆفێری بەرامبەر بووبێتە هۆکار"),O("Yes, if nobody appears to be hurt","","بەڵێ، ئەگەر وا دەرکەوێت کەس بریندار نەبووە")],0,
      "You must stay whether or not the crash was your fault. The textbook also notes that helping the injured — taking them to a hospital or health centre, or alerting the police — can count in your favour.","","تووشی ڕوودانێک دەبیت. بۆت هەیە لێبخوڕیت و بڕۆیت؟","دەبێت بمێنیتەوە جا ڕوودانەکە هەڵەی تۆ بووبێت یان نا. کتێبەکە ئەوەش دەڵێت کە یارمەتیدانی بریندارەکان — گواستنەوەیان بۆ نەخۆشخانە یان بنکەیەکی تەندروستی، یان ئاگادارکردنەوەی پۆلیس — دەکرێت بە سوودی تۆ دابنرێت."),
    // ---- Part 2, pages 170-187: winter kit, wind, water, hazard perception, loads ----
    Q("rules",null,"You are setting off on a mountain road in winter. What should be in the car?","",
      [O("Chains, a rope, a shovel, a blanket, a phone and a warning triangle","","زنجیر، گوریس، خاکەنداز، بەتانی، مۆبایل و سێگۆشەی وریاکردنەوە"),O("Nothing special is needed","","پێویست بە هیچی تایبەت ناکات"),O("Only a spare tyre","","تەنها تایەیەکی یەدەگ")],0,
      "If the weather does not suit the journey, the textbook's first advice is simply not to go. If you must, carry the kit that lets you dig out, get towed, keep warm and call for help.","","لە زستاندا بەرەو ڕێگایەکی چیایی بەڕێدەکەویت. دەبێت چی لە ئۆتۆمبیلەکەدا بێت؟","ئەگەر کەشوهەوا لەگەڵ گەشتەکەدا نەگونجێت، یەکەم ئامۆژگاری کتێبەکە بەسادەیی ئەوەیە کە مەڕۆ. ئەگەر ناچار بوویت، ئەو کەلوپەلە هەڵبگرە کە ڕێگەت پێدەدات خۆت دەربهێنیت، ڕابکێشرێیت، گەرم بمێنیتەوە و داوای یارمەتی بکەیت."),
    Q("mech",null,"The windscreen is frozen. What must you not use to clear it?","",
      [O("Very hot water — it can crack the glass","","ئاوی زۆر گەرم — دەتوانێت جامەکە بتەقێنێت"),O("The car's heater","","گەرمکەرەوەی ئۆتۆمبیلەکە"),O("A scraper or de-icing spray","","فڵچە یان سپرای بەستنشکێن")],0,
      "A sudden temperature change across cold glass is exactly what cracks it. Warm the car through, or use a scraper and a proper de-icer — and clear the mirrors and all the windows, not just a porthole in front of you.","","جامی پێشەوە بەستووە. بۆ پاککردنەوەی چی نابێت بەکاربهێنیت؟","گۆڕانێکی لەناکاوی پلەی گەرمی بەسەر جامی سارددا هەر ئەوەیە کە دەیتەقێنێت. ئۆتۆمبیلەکە گەرم بکەرەوە، یان فڵچە و سپرایەکی گونجاو بەکاربهێنە — و ئاوێنە و هەموو پەنجەرەکان پاک بکەرەوە، نەک تەنها کونێکی بچووک لە پێشتەوە."),
    Q("rules",null,"Where is ice most likely to catch you out?","",
      [O("On bridges and high, exposed stretches","","لەسەر پرد و ڕێگا بەرز و کراوەکان"),O("In the middle of a town","","لە ناوەڕاستی شارێکدا"),O("Only where you can see snow","","تەنها لەو شوێنانەی بەفر دەبینیت")],0,
      "Bridges freeze first because cold air passes underneath them as well as over. In snow, remember that signs and boards can be plastered over and unreadable, so you cannot rely on them.","","لەکوێ زۆرترین ئەگەری هەیە بەستن تووشت بێت؟","پرد یەکەم جار دەبەستێت چونکە هەوای سارد لە ژێریشیەوە تێدەپەڕێت نەک تەنها بەسەریدا. لە بەفردا لەبیرت بێت هێما و تابلۆکان دەتوانن داپۆشرێن و نەخوێنرێنەوە، بۆیە ناتوانیت پشتیان پێببەستیت."),
    Q("rules",null,"Which vehicles are most at risk in a strong crosswind?","",
      [O("High-sided ones such as lorries and buses","","ئەوانەی تەنیشتیان بەرزە وەک لۆری و پاس"),O("Low sports cars","","ئۆتۆمبیلی وەرزشی نزم"),O("Wind affects all vehicles equally","","با بە یەکسانی کاردەکاتە سەر هەموو ئۆتۆمبیلێک")],0,
      "A tall flat side is a sail. The wind is strongest on open stretches, on bridges and in high exposed places — and the gust that hits you as you draw alongside a lorry is a hazard for small cars, motorcycles and cyclists too.","","لە بایەکی بەهێزی تەنیشتدا کام ئۆتۆمبیلەکان زۆرترین مەترسییان لەسەرە؟","تەنیشتێکی بەرزی تەخت وەک چەرخەیەک وایە. با لە ڕێگا کراوەکان، لەسەر پرد و لە شوێنە بەرز و کراوەکاندا بەهێزترینە — و ئەو تەقەی بایەی بەرت دەکەوێت کاتێک دێیتە تەنیشت لۆرییەک بۆ ئۆتۆمبیلی بچووک، ماتۆڕسکیل و پاسکیلسواریش مەترسییە."),
    Q("rules",null,"You reach a stretch of road covered in standing water. What is the danger?","",
      [O("The tyres can lose grip, and rocks or potholes may be hidden","","تایەکان دەتوانن گرتن لەدەست بدەن، و بەرد یان چاڵ لەوانەیە شاردرابنەوە"),O("There is no danger if you drive fast through it","","ئەگەر بە خێرایی پێیدا بڕۆیت هیچ مەترسییەک نییە"),O("Only that the car gets dirty","","تەنها ئەوەی ئۆتۆمبیلەکە پیس دەبێت")],0,
      "Water lifts the tyres off the surface and the steering goes light — and you cannot see what the water is covering. Slow down before you reach it, not once you are in it.","","دەگەیتە بەشێکی ڕێگا کە ئاوی لەسەر وەستاوە. مەترسییەکە چییە؟","ئاو تایەکان لە ڕووی ڕێگا بەرز دەکاتەوە و سوکان سووک دەبێت — و ناتوانیت ببینیت ئاوەکە چی داپۆشیوە. پێش ئەوەی پێی بگەیت خێرایی کەم بکەرەوە، نەک کاتێک تێیدا بوویت."),
    Q("rules",null,"What does hazard perception actually mean?","",
      [O("Continuously scanning ahead, behind and to the sides","","بەردەوام تەماشاکردنی پێشەوە، دواوە و لایەکان"),O("Watching only the car in front","","تەنها تەماشاکردنی ئۆتۆمبیلی پێشەوە"),O("Reacting once something happens","","وەڵامدانەوە دوای ئەوەی شتێک ڕوودەدات")],0,
      "The point is to see the hazard while it is still far away, when you still have choices. Looking only at the car ahead leaves you reacting to events instead of anticipating them.","","هەڵسەنگاندنی مەترسی بەڕاستی واتای چییە؟","مەبەست ئەوەیە مەترسییەکە ببینیت لە کاتێکدا هێشتا دوورە، کاتێک هێشتا هەڵبژاردنت هەیە. تەنها تەماشاکردنی ئۆتۆمبیلی پێشەوە وات لێدەکات وەڵامی ڕووداوەکان بدەیتەوە لەجیاتی پێشبینیکردنیان."),
    Q("rules",null,"Why are parked cars along a street a hazard?","",
      [O("A pedestrian can step out between them, or a door can open","","پیادەیەک دەتوانێت لە نێوانیانەوە دەربکەوێت، یان دەرگایەک بکرێتەوە"),O("They slow the traffic down","","هاتوچۆ هێواش دەکەنەوە"),O("They block the view of shops","","دیمەنی دووکانەکان دەشارنەوە")],0,
      "A parked line hides everything low and small — a child especially. Treat any gap between parked cars as somewhere a person could appear, and pass slowly enough to stop.","","بۆچی ئۆتۆمبیلی پارککراو لەسەر شەقام مەترسییە؟","ڕیزێکی پارککراو هەموو شتێکی نزم و بچووک دەشارێتەوە — بەتایبەت منداڵێک. هەر بۆشاییەک لە نێوان ئۆتۆمبیلە پارککراوەکاندا وەک شوێنێک سەیر بکە کە کەسێک دەتوانێت لێی دەربکەوێت، و بەو هێواشییە تێپەڕە کە بتوانیت بوەستیت."),
    Q("rules",null,"Why do children need extra caution near the road?","",
      [O("They judge hazards less well and need more time to act","","کەمتر مەترسی هەڵدەسەنگێنن و کاتی زیاتریان دەوێت بۆ کاردانەوە"),O("They are always accompanied by an adult","","هەمیشە گەورەیەکیان لەگەڵدایە"),O("They are easy to see","","بە ئاسانی دەبینرێن")],0,
      "A child can be looking straight at your car and still step out, because judging speed and distance is a skill that develops with age. Near schools and playgrounds, drive as though someone will run out.","","بۆچی منداڵان لە نزیک ڕێگاوە پێویستیان بە وریایی زیاترە؟","منداڵێک دەکرێت ڕاستەوخۆ سەیری ئۆتۆمبیلەکەت بکات و هێشتا دەربکەوێت، چونکە هەڵسەنگاندنی خێرایی و دووری لێهاتوویەکە کە لەگەڵ تەمەندا گەشە دەکات. لە نزیک قوتابخانە و یاریگاکان، بەو شێوەیە لێبخوڕە کە وەک کەسێک ڕادەکاتە دەرەوە."),
    Q("rules",null,"You are driving at night outside a town. Why are wild animals a particular danger?","",
      [O("Headlights dazzle them and they freeze or bolt across","","چرا کوێریان دەکات و دەوەستن یان بە ناکاو دەپەڕنەوە"),O("They can be heard from far away","","لە دوورەوە دەنگیان دەبیسترێت"),O("They only move in daylight","","تەنها لە ڕووناکی ڕۆژدا دەجوڵێن")],0,
      "A dazzled animal does not behave predictably, and where you see one there are usually more behind it. Areas where soil or rubbish is dumped attract foxes, dogs and cats for the same reason.","","بە شەو لە دەرەوەی شار لێدەخوڕیت. بۆچی ئاژەڵی کێوی مەترسییەکی تایبەتە؟","ئاژەڵێکی کوێرکراو بە شێوەیەکی پێشبینیکراو ڕەفتار ناکات، و لەکوێ یەکێک ببینیت بەزۆری چەند دانەی تر لە دوایەوەن. ئەو ناوچانەی خۆڵ و خاشاکیان تێدا فڕێدەدرێت بۆ هەمان هۆکار ڕێوی و سەگ و پشیلە ڕادەکێشن."),
    Q("rules",null,"Which of these places should you expect a sudden crowd of pedestrians?","",
      [O("Outside a mosque or a place of mourning as it empties","","لە بەردەم مزگەوت یان شوێنی پرسەدان کاتێک بەتاڵ دەبێتەوە"),O("On a motorway","","لەسەر ڕێگای خێرا"),O("In a tunnel","","لە ناو تونێلدا")],0,
      "The textbook lists mosques and places of mourning alongside markets, playgrounds, cinemas, halls and office fronts — anywhere a large number of people come out onto the street in a very short time.","","لە کام لەم شوێنانەدا چاوەڕێی کۆمەڵێکی لەناکاوی پیادە دەکەیت؟","کتێبەکە مزگەوت و شوێنی پرسەدان لەگەڵ بازاڕ، یاریگا، سینەما، هۆڵەکان و بەردەم فەرمانگەکاندا دەژمێرێت — هەر شوێنێک کە ژمارەیەکی زۆری خەڵک لە ماوەیەکی زۆر کەمدا دێنە سەر شەقام."),
    Q("rules",null,"According to the textbook, what causes most crashes?","",
      [O("Human factors — the drivers themselves","","هۆکارە مرۆییەکان — خودی شۆفێرەکان"),O("Bad roads","","ڕێگای خراپ"),O("Old vehicles","","ئۆتۆمبیلی کۆن")],0,
      "Most people blame the roads, the cars or other road users. The textbook makes the point deliberately: think about your own driving, because that is the largest single factor.","","بەپێی کتێبەکە، زۆرترین ڕووداو بە هۆی چییەوەیە؟","زۆربەی خەڵک ڕێگا و ئۆتۆمبیل و بەکارهێنەرانی تری ڕێگا تاوانبار دەکەن. کتێبەکە بەئەنقەست ئەم خاڵە دەخاتەڕوو: بیر لە لێخوڕینی خۆت بکەرەوە، چونکە ئەوە گەورەترین هۆکارە."),
    Q("rules",null,"Why should you avoid driving alongside a bus or lorry for long?","",
      [O("You sit in its blind spot where the driver cannot see you","","لە خاڵی کوێری ئەودا دەبیت کە شۆفێرەکە نایبینیت"),O("It is illegal","","یاسایی نییە"),O("It uses more fuel","","سووتەمەنی زیاتر دەخوات")],0,
      "Large vehicles have blind areas down each side and close behind. Either drop back or complete the overtake — sitting level with the cab is the one place you do not want to be.","","بۆچی نابێت ماوەیەکی درێژ لە تەنیشت پاس یان لۆرییەکەوە لێبخوڕیت؟","ئۆتۆمبیلە گەورەکان لە هەردوو تەنیشت و لە پشتەوەی نزیکدا ناوچەی کوێریان هەیە. یان دوابکەوە یان تێپەڕاندنەکە تەواو بکە — وەستان لە ئاستی کابینەکەدا ئەو شوێنەیە کە نامەوێت تێیدا بیت."),
    Q("rules",null,"You are on a narrow road full of potholes. What is the right technique?","",
      [O("Both hands on the wheel, slow down, avoid water-filled holes","","هەردوو دەست لەسەر سوکان، خێرایی کەم بکەرەوە، لە چاڵی پڕ ئاو دوور بکەوە"),O("Speed up to skim over them","","خێرایی زیاد بکە تا بەسەریاندا بڕۆیت"),O("Brake hard at each hole","","لە هەر چاڵێکدا بە توندی بڕەیک بگرە")],0,
      "You cannot tell how deep a water-filled pothole is, and a hard hit can burst a tyre or damage the steering. Keep a bigger gap than usual so you are never forced to brake sharply.","","لەسەر ڕێگایەکی تەسکی پڕ چاڵیت. شێوازی دروست چییە؟","ناتوانیت بزانیت چاڵێکی پڕ لە ئاو چەند قووڵە، و لێدانێکی توند دەتوانێت تایە بتەقێنێت یان زیان بە سوکان بگەیەنێت. مەودایەکی گەورەتر لە ئاسایی بهێڵەوە تا هەرگیز ناچار نەبیت بە توندی بڕەیک بگریت."),
    Q("rules",null,"Who is responsible for a load carried on or in your vehicle?","",
      [O("The driver","","شۆفێرەکە"),O("The person who loaded it","","ئەو کەسەی باری کردووە"),O("Nobody, if it is properly tied","","کەس، ئەگەر بە باشی بەستراوە")],0,
      "The driver must keep within the legal limits and make sure the load is properly secured. You also need to know your vehicle's height and width once it is loaded, because bridges, tunnels and narrow streets do not move.","","بەرپرسیاری ئەو بارەی لەسەر یان لەناو ئۆتۆمبیلەکەتدایە کێیە؟","شۆفێر دەبێت لە سنووری یاسایی نەترازێت و دڵنیابێت لەوەی بارەکە بە باشی بەستراوەتەوە. هەروەها پێویستە بەرزی و پانی ئۆتۆمبیلەکەت بزانیت دوای بارکردن، چونکە پرد و تونێل و شەقامە تەسکەکان ناجوڵێن."),
    Q("rules",null,"You are carrying a container of fuel or gas. What does the textbook require?","",
      [O("A proper sealed container, secured, with a hazard sign at the rear","","دەفرێکی گونجاوی داخراو، بەستراو، لەگەڵ هێمای مەترسی لە دواوە"),O("Nothing, if the amount is small","","هیچ، ئەگەر بڕەکە کەم بێت"),O("Just keep it on the back seat","","تەنها لەسەر کورسی دواوە دایبنێ")],0,
      "Even a small quantity has to be flagged, so that rescue teams arriving at a crash know what they are dealing with. Check the container for leaks or cracks and make sure it cannot move while you drive.","","دەفرێک سووتەمەنی یان گازت هەڵگرتووە. کتێبەکە داوای چی دەکات؟","تەنانەت بڕێکی کەمیش دەبێت ئاماژەی پێبدرێت، تاوەکو تیمە فریاگوزارییەکان کە دەگەنە شوێنی ڕووداو بزانن چییان لەبەردەمدایە. دەفرەکە بۆ لێچوون یان شکان بپشکنە و دڵنیابە لە کاتی لێخوڕیندا ناجوڵێت."),
    Q("rules",null,"Where must an animal never travel in a car?","",
